version: 2

project_name: dva

builds:
  - id: dva
    main: ./cmd/dva
    binary: dva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ScriptonBasestar/dva/internal/config.Version={{.Version}}

archives:
  - id: dva
    builds:
      - dva
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ScriptonBasestar
    name: dva
  draft: false
  prerelease: auto
