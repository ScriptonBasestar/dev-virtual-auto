# TASK-241 authorizes local release preparation only. Public publication still requires its
# explicit human authorization gate. CI runs only the snapshot gate and has no publication
# credentials or tag-triggered release workflow.
version: 2

project_name: dva

builds:
  - id: dva
    main: ./cmd/dva
    binary: dva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ScriptonBasestar/dva/internal/config.Version={{.Version}}
      - -X github.com/ScriptonBasestar/dva/internal/config.Commit={{.Commit}}
      - -X github.com/ScriptonBasestar/dva/internal/config.BuildDate={{.Date}}

archives:
  - id: dva
    ids:
      - dva
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  # releasecheck owns exact-tag detection; the nearest historical tag is not
  # the identity of an untagged snapshot.
  version_template: "{{ .Env.DVA_SNAPSHOT_VERSION }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ScriptonBasestar
    name: dva
  target_commitish: "{{ .Commit }}"
  use_existing_draft: true
  replace_existing_artifacts: true
  draft: false
  prerelease: auto
