# This pipeline has never run. See tasks/blocked/063-documented-release-download-has-no-release.md.
#
# goreleaser releases from a tag and this repository has none, so no asset has ever been
# published and `releases/latest/download/...` 404s. TASK-063 chose to stop documenting the
# download rather than to publish, so nothing here is expected to execute.
#
# The file is kept rather than deleted so that publishing later needs a tag, not a rewrite. CI's
# `goreleaser-check` job validates this file's syntax and says nothing about whether it ever runs
# — the same shape of false assurance TASK-112 removed from the Makefile.
version: 2

project_name: dva

builds:
  - id: dva
    main: ./cmd/dva
    binary: dva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ScriptonBasestar/dva/internal/config.Version={{.Version}}

archives:
  - id: dva
    builds:
      - dva
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ScriptonBasestar
    name: dva
  draft: false
  prerelease: auto
