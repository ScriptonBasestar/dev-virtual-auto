# No public release has been published. TASK-063 deliberately removed the release-download
# documentation; this configuration is exercised only as a local/CI snapshot build until a human
# decides to create and publish a version tag. Snapshot validation produces no GitHub release.
version: 2

project_name: dva

builds:
  - id: dva
    main: ./cmd/dva
    binary: dva
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ScriptonBasestar/dva/internal/config.Version={{.Version}}
      - -X github.com/ScriptonBasestar/dva/internal/config.Commit={{.Commit}}
      - -X github.com/ScriptonBasestar/dva/internal/config.BuildDate={{.Date}}

archives:
  - id: dva
    ids:
      - dva
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: ScriptonBasestar
    name: dva
  draft: false
  prerelease: auto
