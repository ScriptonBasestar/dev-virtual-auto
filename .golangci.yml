# golangci-lint configuration (v1 format).
# Requires golangci-lint built with Go >= the go.mod directive (currently 1.26.x).
run:
  timeout: 5m

issues:
  # Do not cap the number of reported issues.
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Unchecked error returns in tests are acceptable: tests fail loudly on the
    # real assertion, and defensive error checks add noise to fixtures.
    - path: _test\.go
      linters:
        - errcheck

    # Pre-existing unwired symbols in init.go, tracked for a dedicated cleanup:
    #   - libraryReferenceText: a //go:embed target retained for `make generate`.
    #   - formatComposeWarnings and the subProject/scanSubProject/detectSubprojects
    #     cluster: recursive-scaffold helpers not currently wired to `dva init`.
    # Suppressed by name so genuinely new dead code in init.go is still reported.
    - path: internal/cli/init\.go
      linters:
        - unused
      text: "(libraryReferenceText|formatComposeWarnings|subProject|scanSubProject|detectSubprojects)"
