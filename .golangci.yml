# golangci-lint configuration (v2 format).
# Run with golangci-lint v2.x (built with Go >= the go.mod directive). Pinned in
# .mise.toml and CI so the toolchain version gate cannot drift again.
version: "2"

run:
  timeout: 5m

linters:
  # golangci-lint's default set is errcheck/govet/ineffassign/staticcheck/unused,
  # none of which look at language modernity. `modernize` ships in the same pinned
  # binary and is off by default, so `0 issues.` used to be silent about 47 findings
  # it could see. Enabled for tests too: excluding _test.go would restore exactly the
  # unstated coverage gap this was enabled to close. TASK-111.
  #
  # `govet` runs its default analyzer subset, so unusedwrite/nilness/etc. were
  # available in this same pinned binary and silently off — the identical shape
  # TASK-111 closed for modernize. `unparam` likewise ships here and is off by
  # default. Both are enabled by TASK-126.
  enable:
    - modernize
    - unparam
  settings:
    govet:
      enable-all: true
      # The two govet analyzers that stay off, named rather than left implicit:
      # TASK-111 closed by asserting "no analyzer is now deliberately excluded",
      # which was already untrue, and that overstatement is what let unusedwrite
      # sit unreported. Anything excluded here gets a reason.
      disable:
        # Reports struct field ordering for memory savings. Config structs here
        # mirror dva.yml key order on purpose; that readability is worth more
        # than the padding.
        - fieldalignment
        # Flags every shadowed `err`, which is idiomatic in this codebase.
        - shadow
  exclusions:
    generated: lax
    # No `presets:`. There were four, and measuring them one at a time showed
    # `comments`, `common-false-positives` and `legacy` suppressed nothing at all
    # while `std-error-handling` alone suppressed 6 errcheck findings — including an
    # unchecked f.Close() on a temp script that was then chmod'ed and executed
    # (internal/exec/exec.go). A preset is an exclusion whose contents are decided
    # elsewhere and change when the linter updates, so it cannot carry a reason that
    # stays true; `legacy`'s comment claimed a migration-smoothing effect it did not
    # have. The six are now dropped explicitly at their call sites with `_ =`, which
    # puts the reason next to the code. TASK-127.
    rules:
      # Unchecked error returns in tests are acceptable: the real assertion
      # fails loudly, and defensive error checks add noise to fixtures.
      - path: _test\.go
        linters:
          - errcheck
      # libraryReferenceText is a //go:embed target for `make generate` that is
      # not currently read; kept pending a decision to rewire `dva init` to use
      # it or remove the generate pipeline. Suppressed by name so other dead
      # code in init.go is still reported.
      - path: internal/cli/init\.go
        linters:
          - unused
        text: "libraryReferenceText"
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
