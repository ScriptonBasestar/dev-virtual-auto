# yaml-language-server: $schema=https://raw.githubusercontent.com/ScriptonBasestar/dva/master/internal/config/schema.json
# dva.yml — DVA CLI (Go)
# Pattern: Host Build (no Docker infrastructure)
# All commands run locally via Makefile targets
version: "0.1.44"

checks:
  - name: "Go toolchain available"
    type: command
    command: "go version > /dev/null 2>&1"
    fix_hint: "Install Go: https://go.dev/dl/"
  - name: "golangci-lint available"
    type: command
    command: "golangci-lint version > /dev/null 2>&1"
    fix_hint: "Install: https://golangci-lint.run/usage/install/"
  - name: "gopls available"
    type: command
    # Mirror Makefile:60-66 — gopls is resolved via mise first, then PATH, so a contributor who
    # has it only under mise must still pass this check (TASK-160).
    command: "{ command -v mise >/dev/null 2>&1 && mise which gopls >/dev/null 2>&1; } || command -v gopls >/dev/null 2>&1"
    fix_hint: "Install gopls (https://pkg.go.dev/golang.org/x/tools/gopls) or run 'mise install'"

interaction:
  # 'build' is a reserved DVA command — override it with a replace hook.
  # 'clean' stopped being one (docs/43): teardown is now 'dva down <plan> --purge',
  # and a flag has no interaction key to hook. It is an ordinary command here.
  build:
    replace:
      - step: "Build dva binary"
        run: "make build"

  clean:
    description: "Remove build artifacts"
    command: "make clean"
    runner: local

  install:
    description: "Install dva to ~/.local/bin (auto version bump)"
    command: "make install"
    runner: local

  generate:
    description: "Generate embedded files from workflow/"
    command: "make generate"
    runner: local

  check-generate:
    description: "Verify generated files are up to date"
    command: "make check-generate"
    runner: local

  test:
    description: "Run all tests"
    command: "make test"
    runner: local
    subcommands:
      integration:
        description: "Run integration tests"
        command: "make test-integration"
        runner: local

  lint:
    description: "Run linters (golangci-lint, gopls)"
    command: "make lint"
    runner: local

  fmt:
    description: "Format code"
    command: "make fmt"
    runner: local
    subcommands:
      files:
        description: "Format only the listed Go files"
        command: "gofmt -w -s"
        runner: local

  vet:
    description: "Run go vet"
    command: "make vet"
    runner: local

provision:
  default:
    - step: "Build binary"
      run: "make build"
    - step: "Run tests"
      run: "make test"
    - step: "Ready"
      note: "Run 'dva install' to install to ~/.local/bin"
  reset:
    - step: "Remove build artifacts"
      run: "make clean"
    - step: "Rebuild"
      run: "make build"
