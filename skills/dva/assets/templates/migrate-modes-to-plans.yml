version: "0.1.44"

vars:
  APP_ENV: dev

env_file:
  files:
    - path: .env.example
      required: true
    - path: .env
      required: false

stack:
  infra:
    description: Migrated compose infrastructure bundle
    default_runner: compose
    runners:
      compose:
        files:
          - compose.yaml
        project_name: CHANGE_ME
        up_options: ["-d", "--wait"]
        services:
          postgres:
            tags: [infra, data]
          redis:
            tags: [infra, data]
          app:
            tags: [app]

  app:
    description: Migrated application entry
    default_runner: native
    runners:
      native:
        dir: CHANGE_ME
        build: CHANGE_ME build
        run: CHANGE_ME run

plans:
  local-infra:
    description: Replacement for minimal/infra mode
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis]

  local-dev:
    description: Replacement for hybrid/native dev mode
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis]
      - name: app
        runner: native
        order: 20
        depends_on: [infra]

  full-stack:
    description: Replacement for full-stack Docker mode
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis, app]

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local
    entry_overrides:
      app:
        runner: native

interaction:
  app-logs:
    description: Application logs
    runner: local
    command: CHANGE_ME logs

  db:
    description: Database operations
    service: postgres
    command: psql -U CHANGE_ME -d CHANGE_ME

provision:
  default:
    - step: Create local env file
      run: cp -n .env.example .env 2>/dev/null || true
