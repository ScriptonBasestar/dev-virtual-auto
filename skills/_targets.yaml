# Conversion manifest for portable skills.
# Canonical source = skills/<name>/SKILL.md (Agent Skills format).
# Edit the canonical skill, then (re)generate the targets below. See skills/README.md.

version: 1

# Per-skill default overrides. A skill's own frontmatter `x-targets:` wins over these.
defaults:
  # File globs that make a rule/instruction target attach to DVA config work.
  globs:
    - "dva.yml"
    - "**/dva.yml"
    - "dva.override.yml"
    - ".sb/dva/*.yml"

targets:
  # ── Agent-Skills-format targets: read SKILL.md directly via a symlinked dir.
  #    No conversion — the symlink IS the projection (single source, zero drift). ──
  claude-code:
    shape: agent-skill
    output: claude-plugin/skills   # symlink -> ../skills
    generated: false

  antigravity:
    # Antigravity reads .agents/skills/<name>/SKILL.md (NOT bare root skills/).
    # references/ is a supported skill subdir. Ref: antigravity.google/docs/skills
    shape: agent-skill
    output: .agents/skills         # symlink -> ../skills
    generated: false

  opencode:
    # OpenCode has native Agent Skills at .opencode/skills/<name>/SKILL.md
    # (also reads .agents/skills/). Unknown frontmatter (allowed-tools, x-targets)
    # is ignored; references/ is not auto-loaded but the body links them for
    # on-demand file reads. name must match dir: ^[a-z0-9]+(-[a-z0-9]+)*$.
    # Ref: opencode.ai/docs/skills
    shape: agent-skill
    output: .opencode/skills       # symlink -> ../skills
    generated: false

  # ── Down-projected targets: real conversion ──
  cursor:
    shape: mdc
    output: .cursor/rules/
    ext: .mdc
    generated: true
    frontmatter: [description, globs, alwaysApply]
    references: link          # link references/ by repo path, never inline
    default_alwaysApply: false

  codex:
    # The only true AGENTS.md target. Codex has no SKILL.md concept, so skills
    # project to a non-destructive marked section (pointer-only: always-injected).
    shape: agents-md
    output: AGENTS.md
    merge: section            # replace only the marked block
    marker: "skills:auto"     # merge boundary in AGENTS.md
    references: link
    generated: true
