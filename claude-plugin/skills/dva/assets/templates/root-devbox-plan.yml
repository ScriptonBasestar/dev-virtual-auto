version: "0.1.44"

vars:
  APP_ENV: dev
  LOG_LEVEL: debug

env_file:
  - .env.example
  - .env

stack:
  infra:
    description: Shared infrastructure via Docker Compose
    default_runner: compose
    runners:
      compose:
        files:
          - compose.yaml
        project_name: CHANGE_ME
        up_options: ["-d", "--wait"]

  api:
    description: Backend API
    default_runner: native
    runners:
      native:
        dir: CHANGE_ME-api
        build: make build
        run: make run
      docker:
        image: CHANGE_ME-api:dev
        run: docker run --rm CHANGE_ME-api:dev

  web:
    description: Frontend web app
    default_runner: native
    runners:
      native:
        dir: CHANGE_ME-web
        build: pnpm build
        run: pnpm dev
      docker:
        image: CHANGE_ME-web:dev
        run: docker run --rm CHANGE_ME-web:dev

checks:
  - name: Docker daemon accessible
    type: docker_socket
    fix_hint: Start Docker Desktop or ensure dockerd is running
  - name: Compose file exists
    type: file_exists
    path: compose.yaml
  - name: Environment template exists
    type: file_exists
    path: .env.example

suggestion_ignore:
  - "deploy-*"
  - "ci-*"
  - "release-*"

environments:
  dev:
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug
  ci:
    environment:
      APP_ENV: ci
      CI: "true"
      LOG_LEVEL: info

sites:
  local:
    vars:
      DVA_SITE: local
    entry_overrides:
      api:
        runner: native
      web:
        runner: native
  docker-host:
    vars:
      DVA_SITE: docker-host
    entry_overrides:
      api:
        runner: docker
      web:
        runner: docker

plans:
  local-infra:
    description: Core infrastructure only
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis]

  local-dev:
    description: Infrastructure plus native app processes
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis]
      - name: api
        runner: native
        order: 20
        depends_on: [infra]
      - name: web
        runner: native
        order: 30
        depends_on: [api]

  docker-full:
    description: Full stack through Docker-compatible runners
    environment: dev
    site: docker-host
    entries:
      - name: infra
        runner: compose
        order: 10
      - name: api
        runner: docker
        order: 20
        depends_on: [infra]
      - name: web
        runner: docker
        order: 30
        depends_on: [api]

interaction:
  db:
    description: Database operations
    service: postgres
    command: psql -U CHANGE_ME -d CHANGE_ME
    subcommands:
      migrate:
        description: Run database migrations
        runner: local
        command: make migrate

  test:
    description: Run test suite
    runner: local
    command: make test

  lint:
    description: Run lint checks
    runner: local
    command: make lint

provision:
  default:
    - step: Create local env file
      run: cp -n .env.example .env 2>/dev/null || true
    - step: Start core infrastructure
      run: docker compose -f compose.yaml up -d --wait postgres redis
    - step: Run migrations
      run: make migrate

subprojects:
  api:
    path: CHANGE_ME-api
    exclude_tags: [infra]
  web:
    path: CHANGE_ME-web
    exclude_tags: [infra]

endpoints:
  api:
    label: API
    url: http://localhost:8080
    tags: [app]
    paths:
      /health: Health check
  web:
    label: Web
    url: http://localhost:3000
    tags: [ui]
