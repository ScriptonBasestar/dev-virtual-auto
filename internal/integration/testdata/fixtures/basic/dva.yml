version: "0.1.22"

environment:
  APP_ENV: development

lifecycle:
  - name: compose
    plugin: compose
    order: 10
    compose:
      files: [compose.yml]
      project_name: basic-test

interaction:
  shell:
    description: Start a shell
    service: web
    command: /bin/bash
  test:
    description: Run tests
    command: make test
