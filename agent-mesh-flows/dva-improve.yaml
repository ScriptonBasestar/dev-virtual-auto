      이 binding은 생성 입력일 뿐이다. provider/consumer/ownership/evidence가 현재
      프로젝트 또는 workspace 사실과 맞는지 검증하고, 승인된 binding만 지원되는
      stack/plan/health 필드로 materialize하라. `capability_bindings` 자체를 dva.yml
      key로 생성하지 말고, 충돌하거나 미검증인 provider를 추측하지 마라.

