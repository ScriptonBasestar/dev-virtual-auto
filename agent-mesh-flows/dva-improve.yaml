# yaml-language-server: $schema=schemas/flow.schema.json
name: dva-improve
description: "AI-assisted dva.yml improvement — scan project, detect drift, optimize configuration"
contract:
  goal: "프로젝트 구조를 분석하여 dva.yml을 최적화하고 검증까지 완료한다"
  expected_results:
    - "dva.yml이 프로젝트 현재 상태와 동기화된다"
    - "누락된 필수 섹션이 추가된다"
    - "dva config validate가 ERROR 0으로 통과한다"
    - "version 필드를 건드리지 않는다 — reader floor는 설정 작성자의 선언이다"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "dva config validate 통과 (최대 3회 재시도)"
    - "기존 interaction 이름과 구조가 보존된다 (preserve 모드)"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_improver

parameters:
  - name: mode
    description: "Improve mode: preserve (minimal changes) or rewrite (rebuild from scratch)"
    default: "preserve"
    enum: [preserve, rewrite]
  - name: model
    description: "Claude model to use"
    default: "sonnet"
    enum: [haiku, sonnet, opus]
  - name: target
    description: "Target directory"
    default: "."
  - name: capability_bindings
    description: "JSON array of portfolio/provider bindings with capability, provider, consumer, ownership, and evidence"
    default: "[]"
interactive:
  confirm_before: [improve]

steps:
  # ══════════════════════════════════════════════
  # Phase 0: Prerequisites
  # ══════════════════════════════════════════════
  # This flow only behaves when the run directory *is* the target, and the `target`
  # parameter reads as though any project could be passed. Two subsystems disagree about
  # what a path means: `file` and `read_file` resolve against the run directory and are
  # path-sandboxed, while `context`/`shell` follow whatever `cd` did. Point the flow
  # somewhere else and the shell steps obey while every declarative write is refused with
  # "escaped all approved roots" -- including the backup below, which exists so that the
  # agent edit further down is recoverable. Measured on two fixtures against am cb8b4ce.
  #
  # Stopping here is the same idiom `check_prerequisites` already uses for a missing CLI:
  # exit non-zero and let the step failure carry the reason. In batch (`-y`) that aborts
  # the pipeline before anything is written. Interactively am asks "Continue anyway?", so
  # the message has to be good enough for a person to answer no -- hence both directories
  # by name and the exact command that fixes it.
  #
  # `=` is used rather than `!=`: only `=` was measured against am's shell policy analyzer,
  # which reads an unquoted bare word as a command name and would block the step at runtime
  # while `am validate` stays green. Same reason every path here is quoted.
  - id: check_run_dir
    type: context
    context:
      run_dir_ok: |
        RUN="$PWD"
        cd '{{param.target}}' || exit 1
        if [ "$PWD" = "$RUN" ]; then
          printf 'yes'
        else
          echo "ERROR: dva-improve must run with the target as the working directory." >&2
          echo "  run directory: $RUN" >&2
          echo "  target:        $PWD" >&2
          echo "" >&2
          echo "am resolves file/read_file paths against the run directory and refuses to" >&2
          echo "write outside it. Continuing would skip the config backup while the agent" >&2
          echo "still edits the config, leaving nothing to restore from." >&2
          echo "" >&2
          echo "Fix: cd '$PWD' && am run dva dva-improve" >&2
          exit 1
        fi

  - id: check_prerequisites
    type: context
    depends_on: [check_run_dir]
    context:
      # A missing prerequisite is a stop, not a finish. `exit_if_empty` ends the pipeline
      # *successfully* (flow.schema.json), so an absent CLI produced a clean run that did
      # nothing — indistinguishable from a run that had nothing to do. Exit non-zero here
      # instead and let the step failure carry the reason.
      dva_available: |
        if ! command -v dva >/dev/null 2>&1; then
          echo "ERROR: DVA CLI not found. Install:" >&2
          echo "  go install github.com/ScriptonBasestar/dva@latest" >&2
          exit 1
        fi
        printf 'yes'
      # `dva version` has no --short flag; it exits 1 and the fallback used to make this
      # 'unknown'. --json is the machine-readable contract, so parse that instead of the
      # human first line. This value describes the *running* binary and must never be
      # written into a target's `version:` — that field is the reader floor (TASK-135).
      dva_version: "dva version --json 2>/dev/null | jq -r '.version // \"unknown\"' 2>/dev/null || echo 'unknown'"
      dva_version_json: "dva version --json 2>/dev/null || echo '{\"version\": \"unknown\"}'"

  - id: check_config
    type: context
    depends_on: [check_prerequisites]
    context:
      has_dva_yml: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false
      config_path: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] && echo 'dva.yml' || { [ -f 'dva.yaml' ] && echo 'dva.yaml' || echo ''; }; }

  # Snapshot the config before any agent edits it. This is not a second history alongside
  # git -- git is the history. It covers the one window git cannot: uncommitted local edits
  # at the moment the flow runs, which `git checkout --` would discard rather than restore.
  #
  # It lands in `backups/dva/`, not under `tmp/`. `tmp/` means "safe to delete at any time"
  # -- the guided stages already put their disposable run reports there -- and a snapshot is
  # the one thing that must survive exactly the cleanup `tmp/` invites. The `dva/` component
  # is not decoration: a project may already own a `backups/` directory, and the marker below
  # would hide its contents from git. Namespacing keeps the blast radius to our own subtree.
  #
  # The backup directory carries a `.gitignore` of `*`, so it ignores its own contents and
  # the snapshots never reach the target's index. That marker is why the target's own
  # .gitignore is never opened: this flow edits somebody else's repository, and adding a
  # line to their ignore rules is a change they did not ask for. Measured: with the marker
  # in place `git status --porcelain` is empty and no root .gitignore is created.
  #
  # The path is recomputed here instead of read from `check_config.config_path`, which is
  # emitted with `echo`. am does not trim, so interpolating that value would assign a
  # trailing newline into the variable and every `[ -f ]` against it would fail -- the same
  # defect as an `echo` gate producer, reached outside a gate.
  - id: backup_paths
    type: context
    depends_on: [check_config]
    context:
      marker: |
        printf '%s/backups/dva/.gitignore' '{{param.target}}'
      src: |
        cd '{{param.target}}'
        # Every filename is quoted. The am shell policy analyzer reads an unquoted bare word
        # as a command name wherever it appears -- [ -f dva.yml ] blocks the step on
        # dva.yml not in allowlist, and printf yes blocks it on yes. Quoting the word
        # is what makes the analyzer see it as data. Measured both ways.
        CONFIG=''
        if [ -f 'dva.yml' ]; then CONFIG='dva.yml'; elif [ -f 'dva.yaml' ]; then CONFIG='dva.yaml'; fi
        if [ -n "$CONFIG" ]; then printf '%s/%s' '{{param.target}}' "$CONFIG"; fi
      dest: |
        cd '{{param.target}}'
        CONFIG=''
        if [ -f 'dva.yml' ]; then CONFIG='dva.yml'; elif [ -f 'dva.yaml' ]; then CONFIG='dva.yaml'; fi
        if [ -n "$CONFIG" ]; then
          printf '%s/backups/dva/%s.%s.bak' '{{param.target}}' "$CONFIG" "$(date +%Y%m%d-%H%M%S)"
        fi

  # Both steps read the flag `check_config` already publishes rather than computing a
  # second copy of it, so they skip together when there is nothing to snapshot -- a fresh
  # project scaffolds its config below and has no prior state to lose. `improve` is
  # deliberately ungated and runs either way.
  - id: backup_marker
    type: file
    depends_on: [backup_paths]
    when: "{{check_config.has_dva_yml}} == 'true'"
    file:
      op: write
      path: "{{backup_paths.marker}}"
      content: "*\n"

  - id: backup_config
    type: file
    depends_on: [backup_marker]
    when: "{{check_config.has_dva_yml}} == 'true'"
    file:
      op: copy
      from: "{{backup_paths.src}}"
      to: "{{backup_paths.dest}}"

  # Keep the newest 10 snapshots and drop the rest. `backup_config` only ever copies, so
  # without this the directory grows once per run forever -- and it carries a `.gitignore`
  # of `*`, so nothing will ever appear in `git status` to prompt a cleanup.
  #
  # A shell loop rather than `op: delete`, which the technical note on TASK-184 preferred.
  # Measured against am cb8b4ce: `op: delete` hands its path to a single remove call, so it
  # does not expand a glob and cannot express keep-N over a backlog of unknown size -- one
  # delete per run would need forty runs to bring a fifty-file directory back to the bound.
  #
  # Scope is the whole safety argument. The step cds into the backup directory, and every
  # name it removes comes from `ls` of that directory, so no name can hold a slash and
  # nothing outside the directory is reachable. `ls` without `-a` never lists the
  # `.gitignore` marker, and the grep demands a `.bak` suffix on top of that.
  - id: prune_backups
    type: shell
    depends_on: [backup_config]
    when: "{{check_config.has_dva_yml}} == 'true'"
    action: |
      cd '{{param.target}}/backups/dva' 2>/dev/null || exit 0
      # Sorted on the timestamp inside the name, not on the whole name and not on mtime.
      # Name order is the canonical one -- a snapshot copied in from elsewhere carries an
      # mtime that disagrees with its own name -- but ordering on the whole name sorts every
      # dva.yaml snapshot ahead of every dva.yml one, so a project that renamed its config
      # would prune its newest snapshots and keep the stale ones. Field 3 is the timestamp
      # for both names, and it is fixed width, so a text sort of it is chronological.
      OLD=$(ls -1 | grep '\.bak$' | sort -t '.' -k 3 -r | tail -n +11)
      printf '%s\n' "$OLD" | while IFS= read -r f; do
        if [ -n "$f" ]; then rm -f "$f"; fi
      done

  # Scaffold dva.yml if missing. Unquoted, this gate never held: `dva init` ran on every
  # improve of an already-configured project. See the `when:` contract in
  # dva-improve-guided.yaml; the same defect was in all five gates below.
  - id: scaffold
    type: shell
    depends_on: [check_config]
    when: "{{check_config.has_dva_yml}} != 'true'"
    action: |
      cd '{{param.target}}'
      echo "--- Scaffolding initial dva.yml ---"
      dva init 2>&1 | tail -20
      echo "--- scaffold complete ---"

  # ══════════════════════════════════════════════
  # Phase 1: Project Exploration (replaces Go detectXxxSummary functions)
  # ══════════════════════════════════════════════
  - id: scan_compose
    type: context
    depends_on: [scaffold]
    context:
      # Root compose files + services
      root_compose: |
        cd '{{param.target}}'
        files=$(ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null)
        if [ -z "$files" ]; then echo "None"; exit 0; fi
        echo "$files"
        # Emit the keys of each top-level block separately. A flat indent grep conflates
        # services with networks/volumes, so a network reads as an undeclared service
        # (measured: the backend network of cwrapper-devbox reported as a missing service).
        for f in $files; do
          echo "=== $f ==="
          # One awk pass per file rather than a shell function: the am allowlist knows
          # commands, not a function the step just defined, so calling one blocks the
          # step -- and a blocked step does not stop the run, it just produces nothing.
          awk '
            BEGIN { split("services networks volumes", want, " ") }
            /^[^[:space:]#]/ {
              cur = ""
              for (i = 1; i <= 3; i++) if ($0 ~ "^" want[i] ":[[:space:]]*(#.*)?$") { cur = want[i]; base = 0 }
              next
            }
            cur != "" && match($0, /^[[:space:]]+/) {
              ind = RLENGTH; rest = substr($0, ind + 1)
              if (rest ~ /^#/) next
              if (rest ~ /^[A-Za-z0-9_.-]+:/) {
                if (base == 0) base = ind
                if (ind == base) { sub(/:.*/, "", rest); keys[cur] = keys[cur] rest " " }
              }
            }
            END { for (i = 1; i <= 3; i++) printf "  %-9s %s\n", want[i] ":", keys[want[i]] }
          ' "$f"
        done
      # Infra directory compose files
      infra_compose: |
        cd '{{param.target}}'
        files=$(ls infra/compose*.y*ml docker/compose*.y*ml compose/compose*.y*ml infrastructure/compose*.y*ml \
                   compose.*.yaml compose.*.yml docker-compose.*.yml docker-compose.*.yaml 2>/dev/null)
        if [ -z "$files" ]; then echo "None"; exit 0; fi
        # Emit the keys of each top-level block separately. A flat indent grep conflates
        # services with networks/volumes, so a network reads as an undeclared service
        # (measured: the backend network of cwrapper-devbox reported as a missing service).
        for f in $files; do
          echo "=== $f ==="
          # One awk pass per file rather than a shell function: the am allowlist knows
          # commands, not a function the step just defined, so calling one blocks the
          # step -- and a blocked step does not stop the run, it just produces nothing.
          awk '
            BEGIN { split("services networks volumes", want, " ") }
            /^[^[:space:]#]/ {
              cur = ""
              for (i = 1; i <= 3; i++) if ($0 ~ "^" want[i] ":[[:space:]]*(#.*)?$") { cur = want[i]; base = 0 }
              next
            }
            cur != "" && match($0, /^[[:space:]]+/) {
              ind = RLENGTH; rest = substr($0, ind + 1)
              if (rest ~ /^#/) next
              if (rest ~ /^[A-Za-z0-9_.-]+:/) {
                if (base == 0) base = ind
                if (ind == base) { sub(/:.*/, "", rest); keys[cur] = keys[cur] rest " " }
              }
            }
            END { for (i = 1; i <= 3; i++) printf "  %-9s %s\n", want[i] ":", keys[want[i]] }
          ' "$f"
        done
      # Kubernetes manifests
      k8s_manifests: |
        cd '{{param.target}}'
        found=$(find . \( -path '*/node_modules' -o -path '*/.git' -o -path '*/vendor' \) -prune -o \
          \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null | \
          xargs grep -l '^kind:' 2>/dev/null | head -20)
        if [ -n "$found" ]; then
          echo "K8s manifest files:"
          echo "$found"
          echo "\nKinds detected:"
          echo "$found" | xargs grep -h '^kind:' 2>/dev/null | sort | uniq -c | sort -rn | head -15
        else
          echo "None"
        fi
      # Helm charts
      helm_charts: |
        cd '{{param.target}}'
        charts=$(find . \( -path '*/node_modules' -o -path '*/.git' \) -prune -o -name 'Chart.yaml' -print 2>/dev/null | head -10)
        if [ -n "$charts" ]; then
          echo "Helm charts found:"
          for c in $charts; do
            dir=$(dirname "$c")
            name=$(grep '^name:' "$c" 2>/dev/null | head -1)
            version=$(grep '^version:' "$c" 2>/dev/null | head -1)
            echo "  $dir — $name $version"
          done
        else
          echo "None"
        fi

  - id: scan_build
    type: context
    depends_on: [scaffold]
    context:
      build_tools: |
        cd '{{param.target}}'
        found=""
        for f in Makefile package.json build.gradle pom.xml pyproject.toml Gemfile go.mod Cargo.toml; do
          [ -f "$f" ] && found="$found $f"
        done
        echo "${found:-None}"
      package_json_scripts: |
        cd '{{param.target}}'
        if [ ! -f 'package.json' ]; then echo "None"; exit 0; fi
        if command -v jq >/dev/null 2>&1; then
          scripts=$(jq -r '.scripts // {} | to_entries[] | "  \(.key): \(.value)"' package.json 2>/dev/null)
          if [ -n "$scripts" ]; then
            echo "package.json scripts:"
            echo "$scripts"
          else
            echo "package.json has no scripts"
          fi
        else
          # Fallback: grep if jq not available
          echo "package.json scripts (raw):"
          grep -A 50 '"scripts"' package.json 2>/dev/null | grep -E '^\s+"[^"]+":' | head -30
        fi
      makefile_targets: |
        cd '{{param.target}}'
        if [ ! -f 'Makefile' ]; then echo "None"; exit 0; fi
        # Extract targets with ## comments + recipe lines
        grep -E '^[a-zA-Z_-]+:.*##' Makefile 2>/dev/null | head -40
        for inc in $(grep -E '^-?include ' Makefile 2>/dev/null | sed 's/^-\?include //' | head -10); do
          resolved=$(eval echo "$inc" 2>/dev/null)
          for f in $resolved; do
            [ -f "$f" ] && grep -E '^[a-zA-Z_-]+:.*##' "$f" 2>/dev/null | head -20
          done
        done

  - id: scan_env
    type: context
    depends_on: [scaffold]
    context:
      env_summary: |
        cd '{{param.target}}'
        env_files=$(ls .env .env.example .env.local .env.dev 2>/dev/null)
        if [ -z "$env_files" ]; then echo "None"; exit 0; fi
        echo "Files: $env_files"
        # Compare .env.example vs .env
        if [ -f '.env.example' ]; then
          example_vars=$(grep -v '^#' .env.example 2>/dev/null | grep '=' | cut -d= -f1 | sed 's/^export //' | sort)
          echo ""
          echo ".env.example variables ($(echo "$example_vars" | wc -l)): $(echo $example_vars | tr '\n' ', ')"
          if [ -f '.env' ]; then
            env_vars=$(grep -v '^#' .env 2>/dev/null | grep '=' | cut -d= -f1 | sed 's/^export //' | sort)
            missing=$(comm -23 <(echo "$example_vars") <(echo "$env_vars") 2>/dev/null)
            if [ -n "$missing" ]; then
              echo "WARNING: .env MISSING variables: $missing"
            else
              echo "OK: .env covers all variables from .env.example"
            fi
          else
            echo "WARNING: .env file does NOT exist — must be created from .env.example before dva up"
          fi
        fi

  - id: scan_subprojects
    type: context
    depends_on: [scaffold]
    context:
      subprojects: |
        cd '{{param.target}}'
        for d in */; do
          [ -d "$d" ] || continue
          base=$(basename "$d")
          case "$base" in
            node_modules|vendor|.git|.idea|.vscode|tmp|build|dist|target|compose|docker|infra|infrastructure|scripts|docs|monitoring|k8s|data|specs|reports|agent-mesh-flows) continue ;;
          esac
          markers=""
          [ -f "$d/package.json" ] && markers="$markers package.json"
          [ -f "$d/go.mod" ] && markers="$markers go.mod"
          [ -f "$d/pyproject.toml" ] && markers="$markers pyproject.toml"
          [ -f "$d/Cargo.toml" ] && markers="$markers Cargo.toml"
          [ -f "$d/Gemfile" ] && markers="$markers Gemfile"
          { [ -f "$d/dva.yml" ] || [ -f "$d/dva.yaml" ]; } && markers="$markers dva.yml"
          { [ -f "$d/compose.yaml" ] || [ -f "$d/docker-compose.yml" ]; } && markers="$markers compose"
          [ -n "$markers" ] && echo "$base:$markers"
        done
      workspace_map: |
        cd '{{param.target}}'
        # pnpm workspaces
        if [ -f 'pnpm-workspace.yaml' ]; then
          echo "=== pnpm-workspace.yaml ==="
          cat pnpm-workspace.yaml
        elif [ -f 'pnpm-workspace.yml' ]; then
          echo "=== pnpm-workspace.yml ==="
          cat pnpm-workspace.yml
        fi
        # npm/yarn workspaces in package.json
        if [ -f 'package.json' ]; then
          ws=$(grep -A 20 '"workspaces"' package.json 2>/dev/null | head -20)
          [ -n "$ws" ] && echo "=== package.json workspaces ===$ws"
        fi
        # Cargo workspace members
        if [ -f 'Cargo.toml' ]; then
          members=$(awk '/^\[workspace\]/,/^\[/' Cargo.toml 2>/dev/null | grep 'members' -A 20 | head -20)
          [ -n "$members" ] && echo "=== Cargo.toml [workspace.members] ==="
          [ -n "$members" ] && echo "$members"
        fi
        # Go workspaces
        if [ -f 'go.work' ]; then
          echo "=== go.work ==="
          cat go.work
        fi
        # If none found
        [ ! -f 'pnpm-workspace.yaml' ] && [ ! -f 'pnpm-workspace.yml' ] && \
        [ ! -f 'Cargo.toml' ] && [ ! -f 'go.work' ] && echo "None"

  # ══════════════════════════════════════════════
  # Phase 2: Current DVA State (replaces Go config.Load + validation)
  # ══════════════════════════════════════════════
  - id: dva_state
    type: context
    depends_on: [scaffold]
    context:
      raw_config: "cat {{param.target}}/dva.yml 2>/dev/null || cat {{param.target}}/dva.yaml 2>/dev/null || echo ''"
      manifest: |
        cd '{{param.target}}' && dva manifest -f json 2>/dev/null || echo '{}'
      resolved_config: |
        cd '{{param.target}}' && dva config show -f yaml 2>/dev/null | head -300 || echo ''
      validation: |
        cd '{{param.target}}' && dva config validate 2>&1 || true
      validation_strict: |
        cd '{{param.target}}' && dva config validate --strict 2>&1 || true

  # ══════════════════════════════════════════════
  # Phase 4: AI Improve (replaces Claude Code -p invocation)
  # ══════════════════════════════════════════════
  - id: improve
    type: llm
    depends_on:
      - backup_config
      - scan_compose
      - scan_build
      - scan_env
      - scan_subprojects
      - dva_state
    agent: claude
    profile: dva_improver
    instruction: |
      # Role & Objective
      당신은 DVA(Dev Virtual Auto) 설정 전문가입니다.
      프로젝트 구조를 분석하여, 개발자가 복잡한 Docker Compose나 스크립트 명령어 대신
      단순한 `dva [cmd]` 형식으로 작업할 수 있도록 `dva.yml`을 최적화하는 것이 목표입니다.

      ## Mode: {{param.mode}}
      적용할 모드의 전용 규칙만 따르세요.

      ### preserve 모드 전용 규칙
      <!-- AUTOGEN:dva_flow_mode_preserve:start -->
      이미 존재하는 `dva.yml`을 **현재 프로젝트 상태에 맞게 정렬**하세요.
      앱 코드를 바꾸는 것이 아니라 `dva.yml`과 관련 문서를 개선하는 것입니다.

      # Mode: Default (Preserve)

      1. 기존 `dva.yml`을 가능한 한 **최소 변경**으로 개선하되, **누락된 필수 섹션은 반드시 추가**하세요.
      2. 기존 명령 이름이 이미 팀에 알려져 있다면, 특별한 이유 없이는 유지하세요.
      3. **기존 `stack.<entry>.runners.compose` -> `services` 메타데이터(`tags`)를 삭제하지 마세요.** 수정/추가만 허용됩니다.
      4. **`services`는 `tags` 전용입니다.** 예전 스키마에 있던 `ports`/`related`/`hint`는 제거됐고 지금은 `dva validate`가 거부합니다. 기존 파일에 남아 있으면 그대로 두지 말고 옮기세요 — `ports` -> 최상위 `endpoints:`, `hint` -> `health_checks.<name>.start_hint`, `related` -> `tags` 또는 `modes.<name>.compose_services`. 새로 추가하지 마세요.
      5. **기존 `applications:` 섹션은 `stack` 엔트리로 변환하세요.** 이 키는 제거됐고
         (docs/43) `dva validate`가 거부합니다 — 보존 모드라도 그대로 두면 파일이 로드되지
         않습니다. `dva config migrate`가 `stack.<name>.default_runner: native` +
         `runners.native`로 변환합니다. 앱 정의 자체는 **삭제하지 말고** 옮기세요.
         변환되지 않는 필드(`dev`, `variants`, `depends_on`, `port`)는 migrate 리포트가
         이름을 대며 알려주므로, 그 항목만 손으로 처리하세요.

      > 공통 규칙은 DVA Library Reference의 "DVA Configuration Guardrails (Shared)" 섹션을 따르세요.
      <!-- AUTOGEN:dva_flow_mode_preserve:end -->

      ### rewrite 모드 전용 규칙
      <!-- AUTOGEN:dva_flow_mode_rewrite:start -->
      기존 `dva.yml`을 보존하지 않고, 프로젝트 분석 결과를 기반으로 **최적의 dva.yml을 처음부터 새로 작성**하세요.
      앱 코드를 바꾸는 것이 아니라 `dva.yml`과 관련 문서를 재작성하는 것입니다.

      # Mode: Rewrite (Fresh)

      1. **기존 dva.yml의 구조, 명령 이름, 메타데이터에 얽매이지 마세요.** 프로젝트 분석 결과를 기반으로 최적의 구조를 새로 설계하세요.
      2. 기존 설정에서 재사용할 가치가 있는 부분(커스텀 provision 스크립트, 복잡한 health check 등)은 참고하되, 구조는 새로 잡으세요.
      3. **앱 서버/워커는 `stack` 선언과 named `plans`로 구성하세요.** `applications:`는
         제거된 키라 쓰면 파일이 로드되지 않고, `modes:`는 legacy이므로 신규 설정에
         만들지 마세요.

      ## CRITICAL: lifecycle 소유권

      Compose 서비스는 compose stack entry가 소유하고 plan이 선택합니다. 동일
      서비스를 standalone `docker` runner로 다시 선언하지 마세요. native 개발
      프로세스가 필요하면 별도 native/process stack entry로 선언하고 hybrid plan에서
      선택하세요.

      ## CRITICAL: named plans

      실행 조합은 named plan으로 표현하세요:

      ```yaml
      plans:
        hybrid:
          entries:
            - name: infra
              runner: compose
              services: [postgres, redis]
            - name: api
              runner: native
        full-stack:
          entries:
            - name: infra
              runner: compose
              services: [postgres, redis, api]
      ```

      ## suggestion_ignore 정리

      `suggestion_ignore`에는 **현재 프로젝트에 실제로 존재하는** Makefile/package.json 타겟만 포함하세요.
      다른 프로젝트의 legacy 패턴(예: Go 프로젝트의 타겟이 Rust 프로젝트에 포함)은 제거하세요.
      주석에 해당 타겟이 왜 무시되는지 정확한 이유를 적으세요.

      > 공통 규칙은 DVA Library Reference의 "DVA Configuration Guardrails (Shared)" 섹션을 따르세요.
      <!-- AUTOGEN:dva_flow_mode_rewrite:end -->

      ## DVA Configuration Guardrails
      <!-- AUTOGEN:dva_flow_guardrails:start -->
      # DVA Configuration Guardrails (Shared)

      > Single source of truth for dva.yml generation/improvement rules.
      > Referenced by: improve prompt (auto mode), guided improve pipeline (interactive mode).

      > **Auto-generated sections** — rule 4 (`version:`), rule 9 (reserved commands) and rule 14
      > (section order) are regenerated from `internal/config` by `make generate` (tools/libgen) and
      > bounded by `<!-- AUTOGEN:... -->` markers. Edit the Go source, not the marker block. Other
      > rules are hand-authored. See `shared/library/README.md` for the ownership boundary.

      ## Critical Rules

      1. **`stack:` section required** — Compose config MUST be under `stack.<entry>.runners.compose`. Migrate legacy root-level `compose:` and `stack.<entry>.compose` fields to `runners.compose`.
      2. **`plans:` current model** — New/rewrite configs MUST use named `plans:`.
         Preserve legacy `modes:` only until an explicit migration; never generate new
         modes/applications merely to satisfy an old example.
      3. **Plan scope** — Derive self-contained plans from the capability closure in
         `naming-presets.md`. Provide only plans backed by evidence. Service selection
         belongs in `plans.*.entries[].services`; plans do not inherit or overlay each other.
      4. **`version:` field** — Optional, and it is a **minimum required reader version**, not the
         version of the binary that generated the config. Canonical source:
         `internal/config/version.go` — the block below is regenerated by `make generate`
         (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:version_rule:start -->
         Omit `version:` for no compatibility gate. When declaring it, use `0.1.44` — the floor `dva init` writes. Never scaffold the running CLI version: that makes every generated config refuse to load on an older DVA, ratcheting the floor up on each release. Subproject `version:` is checked against the running DVA independently; DVA never compares a subproject's version to root, so do not require them to agree.
         <!-- AUTOGEN:version_rule:end -->
      5. **`health_checks`: `start` and/or `start_hint`** — `start` is the auto-start command (optional). `start_hint` is human-readable hint text shown by `dva status` (optional). If `start` is set, `start_hint` is only needed when it differs from the start command. Do not set both to identical values (validation warning).
      6. **Health check URLs: literal values only** — `url:` and `address:` fields must use literal values (e.g., `http://localhost:14000/health`), NOT `${VAR:-DEFAULT}` patterns.
      7. **Port conventions** — Never use common default ports as host ports: 2181, 3000, 3306, 5432, 6379, 8080, 8443, 9090, 9092, 9200, 15672, 27017. Pick a project-specific range instead (e.g. 11100-11199).
      8. **`runner: local` for host commands** — Build/test/lint/fmt/check MUST use `runner: local`. Never use `echo 'Run: ...'` wrappers.
      9. **Reserved commands** — DVA built-in commands that MUST NOT appear as plain interaction
         keys. Hookable ones use `replace:` hooks; others must be renamed (e.g., `service-status`,
         `db-migrate`). Canonical source: `internal/config/reserved.go` — the block below is
         regenerated by `make generate` (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:reserved_commands:start -->
         Reserved (24, must not be interaction keys): `build`, `completion`, `compose`, `config`, `console`, `doctor`, `down`, `help`, `init`, `ktl`, `logs`, `ls`, `manifest`, `provision`, `restart`, `run`, `show`, `skill`, `ssh`, `status`, `stop`, `up`, `validate`, `version`
         Hookable (use `replace:` hooks, 6): `build`, `down`, `logs`, `restart`, `stop`, `up`
         <!-- AUTOGEN:reserved_commands:end -->
      10. **Provision: setup only** — NEVER call `run: "dva <command>"` (circular
          dependency), and do not duplicate plan up/down actions with raw lifecycle commands.
      11. **Provision evidence** — Generate only profiles backed by actual setup work;
          never invent `default`, `full`, or `reset` profiles to satisfy a template.
      12. **`env_file:` object format** — Prefer `{ files: [...] }` (optional `required:`); plain string path is also valid.
      13. **Built-in checks first** — Do not generate custom Docker socket, Compose
          file, or env-file checks already emitted by `dva doctor`. Add `checks:` only
          for project-specific prerequisites.
      14. **Section order (canonical)** — Canonical source:
          `internal/config/validate_warnings.go` — the order below is regenerated by
          `make generate` (tools/libgen). Legacy keys (`checks` … `modes`) retain a
          deterministic position during migration only; do not generate them for new configs.

          <!-- AUTOGEN:section_order:start -->
          `version` → `vars` → `environment` → `env_file` → `stack` → `plans` → `default_plan` → `environments` → `sites` → `checks` → `default_mode` → `suggestion_ignore` → `modes` → `health_checks` → `interaction` → `provision` → `modules` → `subprojects` → `endpoints` → `infra` → `ssh` → `devcontainer`
          <!-- AUTOGEN:section_order:end -->
      15. **File header** — First line must be `# yaml-language-server: $schema=...` schema comment.
      16. **`stack.<entry>.runners.compose.tags: [infra]`** — Primary compose runner MUST have compose-level `tags:` field.
      17. **Service metadata: tags required** — Every service MUST have `tags:`. Port metadata (label, http, paths) belongs in `endpoints:` section, NOT in `services.ports`.
      18. **Compose `name:` required** — compose.yml must have top-level `name:` matching `stack.<entry>.runners.compose.project_name`.
      19. **Compose `version:` key** — Remove if present (Compose Specification does not require it).
      20. **Stack files: verify existence** — Every file listed in `stack.{entry}.runners.compose.files` MUST actually exist. Run `ls` to verify.
      21. **Multi-stack entries: no duplicate base files** — Do NOT repeat base `compose.yml` in every entry.
      22. **Package names: EXACT from manifests** — Use `[package] name` from Cargo.toml, module path from go.mod, `name` from package.json. NOT directory names.
      23. **Naming presets** — Tags: infra, api, worker, ui, data, monitoring, build.
          Plans: local-infra, local-dev, full-stack, observability, tools. Environments:
          dev, test, stg, prd. The exact inclusion/default matrix and injected platform
          binding rules live in `naming-presets.md`.
          Environment names label variable sets, not deployment targets — see rule 41.
      24. **No echo wrappers** — Never generate `echo 'Run: ...'` dummy commands.
      25. **No code changes** — Only modify `dva.yml` and related config. Do not touch app code or Dockerfiles.
      26. **Subprojects** — `exclude_tags: [infra]` to avoid parent infra duplication. Allowed fields: `path`, `exclude_tags`, `import`. Only add non-empty `import` entries after the child `dva.yml` exists; placeholders may omit `import` or use `import: {}`.
      27. **App declarations** — Model native app processes as native/process stack
          runners and select them from plans. Compose-hosted apps remain services of
          the compose stack entry.
      28. **Single lifecycle owner** — A Compose service MUST NOT also appear as
          `applications.*.run.docker.service`, a standalone docker runner, a raw
          `docker compose up` interaction, or a provision lifecycle step.
      29. **Runner meaning** — `compose` manages Compose services. `docker` manages a
          standalone `docker run` container. Merely being containerized does not
          justify generating both runners.
      30. **Plan dependencies** — Express cross-entry startup order with
          `plans.entries[].depends_on` and `order`.
      31. **Health ownership** — Compose healthchecks remain in Compose; native
          process readiness belongs to its stack runner/health configuration.
      32. **`stop` vs `down` semantics** — Validate both operations for the same
          named plan. `stop` preserves resources; `down` tears entries down in reverse dependency order.
      33. **Named lifecycle** — Use `dva up <plan>`/`down <plan>` for declarative
          lifecycle. `dva app` and `dva stack` were removed; `--mode` is migration-only.
      34. **No synthetic dual path** — Do not invent native and docker alternatives.
          Declare only execution paths proven by project files and developer workflow.
      35. **Environment switching** — Put dev/stg/prd variables in `environments:`
          and host/location differences in `sites:`; plans select both. Remote sites carry
          development or maintenance intent (rule 41).
      36. **Provision boundary** — Provision prepares files, dependencies, directories,
          or credentials. Lifecycle startup belongs to plans.
      37. **Interaction boundary** — Interactions are one-shot developer commands,
          not alternate lifecycle wrappers.
      38. **Compose command reuse** — Container exec interactions should use
          `service:` + `command:`. Avoid repeating declared Compose file/project flags.
      39. **Preserve migration** — In preserve mode, report legacy ownership overlap
          before migration; do not silently delete working commands.
      40. **Rewrite migration** — In rewrite mode, remove legacy applications/modes
          only after equivalent stack runners and plans exist.
      41. **Local-first scope** — Generated configuration serves local development and
          maintenance. Default every execution target to a local virtual environment, and
          declare a remote target only for a resource that cannot run locally (a shared
          database, a managed service). Never generate release, rollout, or incident-response
          workflows: DVA is not a production operations tool. Environment names follow
          `naming-presets.md` § Environment Presets.
      42. **Capability closure and safe default** — Every selected service must have one
          verified provider for each required capability. Never invent a provider or select
          two lifecycle owners. Prefer `default_plan: local-infra` only when it is local and
          non-destructive; never generate `full-stack` as the default. If no safe default is
          provable, omit `default_plan` and require `dva up <plan>`.
      43. **Platform bindings are input context** — Apply an injected `capability_bindings`
          preference only when its provider target and evidence are verified. Do not emit
          capability metadata as unsupported `dva.yml` keys, hardcode portfolio product names
          into generic defaults, or replace a working provider silently in preserve mode.
      <!-- AUTOGEN:dva_flow_guardrails:end -->

      ## CRITICAL: version 필드
      - `version` 필드는 **건드리지 마세요**. 이 필드는 설정이 *읽는 쪽*에 요구하는 최소 DVA
        버전(reader floor)이지, 이 설정을 만든 바이너리의 버전이 아닙니다. 실행 중인 버전을
        써넣으면 그 설정은 더 낮은 DVA에서 전부 로드에 실패합니다.
      - 기존 값이 있으면 그대로 두고, 없으면 생략하세요. `version`은 optional이며 생략은
        "읽는 쪽에 아무것도 요구하지 않는다"는 뜻입니다.

