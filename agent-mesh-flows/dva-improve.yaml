# yaml-language-server: $schema=schemas/flow.schema.json
name: dva-improve
description: "AI-assisted dva.yml improvement — scan project, detect drift, optimize configuration"
contract:
  goal: "프로젝트 구조를 분석하여 dva.yml을 최적화하고 검증까지 완료한다"
  expected_results:
    - "dva.yml이 프로젝트 현재 상태와 동기화된다"
    - "누락된 필수 섹션이 추가된다"
    - "dva config validate가 ERROR 0으로 통과한다"
    - "version 필드를 건드리지 않는다 — reader floor는 설정 작성자의 선언이다"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "dva config validate 통과 (최대 3회 재시도)"
    - "기존 interaction 이름과 구조가 보존된다 (preserve 모드)"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_improver

parameters:
  - name: mode
    description: "Improve mode: preserve (minimal changes) or rewrite (rebuild from scratch)"
    default: "preserve"
    enum: [preserve, rewrite]
  - name: model
    description: "Claude model to use"
    default: "sonnet"
    enum: [haiku, sonnet, opus]
  - name: target
    description: "Target directory"
    default: "."
  - name: discovery_report
    description: "Path to a precomputed discovery report JSON"
    default: "tmp/improve-guided/00-analysis-report.json"
  - name: shared_dir
    description: "Absolute path to agent-mesh-flows/shared. Empty → $DVA_SHARED_DIR, then the run directory. Must also appear in am's allowed_roots_add."
    default: ""

interactive:
  confirm_before: [improve]

steps:
  # ══════════════════════════════════════════════
  # Phase 0: Prerequisites
  # ══════════════════════════════════════════════
  # This flow only behaves when the run directory *is* the target, and the `target`
  # parameter reads as though any project could be passed. Two subsystems disagree about
  # what a path means: `file` and `read_file` resolve against the run directory and are
  # path-sandboxed, while `context`/`shell` follow whatever `cd` did. Point the flow
  # somewhere else and the shell steps obey while every declarative write is refused with
  # "escaped all approved roots" -- including the backup below, which exists so that the
  # agent edit further down is recoverable. Measured on two fixtures against am cb8b4ce.
  #
  # Stopping here is the same idiom `check_prerequisites` already uses for a missing CLI:
  # exit non-zero and let the step failure carry the reason. In batch (`-y`) that aborts
  # the pipeline before anything is written. Interactively am asks "Continue anyway?", so
  # the message has to be good enough for a person to answer no -- hence both directories
  # by name and the exact command that fixes it.
  #
  # `=` is used rather than `!=`: only `=` was measured against am's shell policy analyzer,
  # which reads an unquoted bare word as a command name and would block the step at runtime
  # while `am validate` stays green. Same reason every path here is quoted.
  - id: check_run_dir
    type: context
    context:
      run_dir_ok: |
        RUN="$PWD"
        cd '{{param.target}}' || exit 1
        if [ "$PWD" = "$RUN" ]; then
          printf 'yes'
        else
          echo "ERROR: dva-improve must run with the target as the working directory." >&2
          echo "  run directory: $RUN" >&2
          echo "  target:        $PWD" >&2
          echo "" >&2
          echo "am resolves file/read_file paths against the run directory and refuses to" >&2
          echo "write outside it. Continuing would skip the config backup while the agent" >&2
          echo "still edits the config, leaving nothing to restore from." >&2
          echo "" >&2
          echo "Fix: cd '$PWD' && am run dva dva-improve" >&2
          exit 1
        fi

  - id: check_prerequisites
    type: context
    depends_on: [check_run_dir]
    context:
      # A missing prerequisite is a stop, not a finish. `exit_if_empty` ends the pipeline
      # *successfully* (flow.schema.json), so an absent CLI produced a clean run that did
      # nothing — indistinguishable from a run that had nothing to do. Exit non-zero here
      # instead and let the step failure carry the reason.
      dva_available: |
        if ! command -v dva >/dev/null 2>&1; then
          echo "ERROR: DVA CLI not found. Install:" >&2
          echo "  go install github.com/ScriptonBasestar/dva@latest" >&2
          exit 1
        fi
        printf 'yes'
      # `dva version` has no --short flag; it exits 1 and the fallback used to make this
      # 'unknown'. --json is the machine-readable contract, so parse that instead of the
      # human first line. This value describes the *running* binary and must never be
      # written into a target's `version:` — that field is the reader floor (TASK-135).
      dva_version: "dva version --json 2>/dev/null | jq -r '.version // \"unknown\"' 2>/dev/null || echo 'unknown'"
      dva_version_json: "dva version --json 2>/dev/null || echo '{\"version\": \"unknown\"}'"

  - id: check_config
    type: context
    depends_on: [check_prerequisites]
    context:
      has_dva_yml: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false
      config_path: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] && echo 'dva.yml' || { [ -f 'dva.yaml' ] && echo 'dva.yaml' || echo ''; }; }

  # Snapshot the config before any agent edits it. This is not a second history alongside
  # git -- git is the history. It covers the one window git cannot: uncommitted local edits
  # at the moment the flow runs, which `git checkout --` would discard rather than restore.
  #
  # It lands in `backups/dva/`, not under `tmp/`. `tmp/` means "safe to delete at any time"
  # -- the guided stages already put their disposable run reports there -- and a snapshot is
  # the one thing that must survive exactly the cleanup `tmp/` invites. The `dva/` component
  # is not decoration: a project may already own a `backups/` directory, and the marker below
  # would hide its contents from git. Namespacing keeps the blast radius to our own subtree.
  #
  # The backup directory carries a `.gitignore` of `*`, so it ignores its own contents and
  # the snapshots never reach the target's index. That marker is why the target's own
  # .gitignore is never opened: this flow edits somebody else's repository, and adding a
  # line to their ignore rules is a change they did not ask for. Measured: with the marker
  # in place `git status --porcelain` is empty and no root .gitignore is created.
  #
  # The path is recomputed here instead of read from `check_config.config_path`, which is
  # emitted with `echo`. am does not trim, so interpolating that value would assign a
  # trailing newline into the variable and every `[ -f ]` against it would fail -- the same
  # defect as an `echo` gate producer, reached outside a gate.
  - id: backup_paths
    type: context
    depends_on: [check_config]
    context:
      marker: |
        printf '%s/backups/dva/.gitignore' '{{param.target}}'
      src: |
        cd '{{param.target}}'
        # Every filename is quoted. am's shell policy analyzer reads an unquoted bare word
        # as a command name wherever it appears -- [ -f dva.yml ] blocks the step on
        # "dva.yml not in allowlist", and printf yes blocks it on "yes". Quoting the word
        # is what makes the analyzer see it as data. Measured both ways.
        CONFIG=''
        if [ -f 'dva.yml' ]; then CONFIG='dva.yml'; elif [ -f 'dva.yaml' ]; then CONFIG='dva.yaml'; fi
        if [ -n "$CONFIG" ]; then printf '%s/%s' '{{param.target}}' "$CONFIG"; fi
      dest: |
        cd '{{param.target}}'
        CONFIG=''
        if [ -f 'dva.yml' ]; then CONFIG='dva.yml'; elif [ -f 'dva.yaml' ]; then CONFIG='dva.yaml'; fi
        if [ -n "$CONFIG" ]; then
          printf '%s/backups/dva/%s.%s.bak' '{{param.target}}' "$CONFIG" "$(date +%Y%m%d-%H%M%S)"
        fi

  # Both steps read the flag `check_config` already publishes rather than computing a
  # second copy of it, so they skip together when there is nothing to snapshot -- a fresh
  # project scaffolds its config below and has no prior state to lose. `improve` is
  # deliberately ungated and runs either way.
  - id: backup_marker
    type: file
    depends_on: [backup_paths]
    when: "{{check_config.has_dva_yml}} == 'true'"
    file:
      op: write
      path: "{{backup_paths.marker}}"
      content: "*\n"

  - id: backup_config
    type: file
    depends_on: [backup_marker]
    when: "{{check_config.has_dva_yml}} == 'true'"
    file:
      op: copy
      from: "{{backup_paths.src}}"
      to: "{{backup_paths.dest}}"

  # Scaffold dva.yml if missing. Unquoted, this gate never held: `dva init` ran on every
  # improve of an already-configured project. See the `when:` contract in
  # dva-improve-guided.yaml; the same defect was in all five gates below.
  - id: scaffold
    type: shell
    depends_on: [check_config]
    when: "{{check_config.has_dva_yml}} != 'true'"
    action: |
      cd '{{param.target}}'
      echo "--- Scaffolding initial dva.yml ---"
      dva init 2>&1 | tail -20
      echo "--- scaffold complete ---"

  # ══════════════════════════════════════════════
  # Phase 1: Project Exploration (replaces Go detectXxxSummary functions)
  # ══════════════════════════════════════════════
  - id: scan_compose
    type: context
    depends_on: [scaffold]
    context:
      # Root compose files + services
      root_compose: |
        cd '{{param.target}}'
        files=$(ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null)
        if [ -z "$files" ]; then echo "None"; exit 0; fi
        echo "$files"
        # Emit each top-level block's keys separately. A flat indent grep conflates
        # services with networks/volumes, so a network reads as an undeclared service
        # (measured: cwrapper-devbox's backend network reported as a missing service).
        yaml_block_keys() {
          awk -v blk="$2" '
            BEGIN { inb = 0; base = 0 }
            $0 ~ "^" blk ":[[:space:]]*(#.*)?$" { inb = 1; base = 0; next }
            /^[^[:space:]#]/ { inb = 0 }
            inb && match($0, /^[[:space:]]+/) {
              ind = RLENGTH; rest = substr($0, ind + 1)
              if (rest ~ /^#/) next
              if (rest ~ /^[A-Za-z0-9_.-]+:/) {
                if (base == 0) base = ind
                if (ind == base) { sub(/:.*/, "", rest); printf "%s ", rest }
              }
            }
            END { printf "\n" }
          ' "$1"
        }
        for f in $files; do
          echo "=== $f ==="
          echo "  services: $(yaml_block_keys "$f" services)"
          echo "  networks: $(yaml_block_keys "$f" networks)"
          echo "  volumes:  $(yaml_block_keys "$f" volumes)"
        done
      # Infra directory compose files
      infra_compose: |
        cd '{{param.target}}'
        files=$(ls infra/compose*.y*ml docker/compose*.y*ml compose/compose*.y*ml infrastructure/compose*.y*ml \
                   compose.*.yaml compose.*.yml docker-compose.*.yml docker-compose.*.yaml 2>/dev/null)
        if [ -z "$files" ]; then echo "None"; exit 0; fi
        # Emit each top-level block's keys separately. A flat indent grep conflates
        # services with networks/volumes, so a network reads as an undeclared service
        # (measured: cwrapper-devbox's backend network reported as a missing service).
        yaml_block_keys() {
          awk -v blk="$2" '
            BEGIN { inb = 0; base = 0 }
            $0 ~ "^" blk ":[[:space:]]*(#.*)?$" { inb = 1; base = 0; next }
            /^[^[:space:]#]/ { inb = 0 }
            inb && match($0, /^[[:space:]]+/) {
              ind = RLENGTH; rest = substr($0, ind + 1)
              if (rest ~ /^#/) next
              if (rest ~ /^[A-Za-z0-9_.-]+:/) {
                if (base == 0) base = ind
                if (ind == base) { sub(/:.*/, "", rest); printf "%s ", rest }
              }
            }
            END { printf "\n" }
          ' "$1"
        }
        for f in $files; do
          echo "=== $f ==="
          echo "  services: $(yaml_block_keys "$f" services)"
          echo "  networks: $(yaml_block_keys "$f" networks)"
          echo "  volumes:  $(yaml_block_keys "$f" volumes)"
        done
      # Kubernetes manifests
      k8s_manifests: |
        cd '{{param.target}}'
        found=$(find . \( -path '*/node_modules' -o -path '*/.git' -o -path '*/vendor' \) -prune -o \
          \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null | \
          xargs grep -l '^kind:' 2>/dev/null | head -20)
        if [ -n "$found" ]; then
          echo "K8s manifest files:"
          echo "$found"
          echo "\nKinds detected:"
          echo "$found" | xargs grep -h '^kind:' 2>/dev/null | sort | uniq -c | sort -rn | head -15
        else
          echo "None"
        fi
      # Helm charts
      helm_charts: |
        cd '{{param.target}}'
        charts=$(find . \( -path '*/node_modules' -o -path '*/.git' \) -prune -o -name 'Chart.yaml' -print 2>/dev/null | head -10)
        if [ -n "$charts" ]; then
          echo "Helm charts found:"
          for c in $charts; do
            dir=$(dirname "$c")
            name=$(grep '^name:' "$c" 2>/dev/null | head -1)
            version=$(grep '^version:' "$c" 2>/dev/null | head -1)
            echo "  $dir — $name $version"
          done
        else
          echo "None"
        fi

  - id: scan_build
    type: context
    depends_on: [scaffold]
    context:
      build_tools: |
        cd '{{param.target}}'
        found=""
        for f in Makefile package.json build.gradle pom.xml pyproject.toml Gemfile go.mod Cargo.toml; do
          [ -f "$f" ] && found="$found $f"
        done
        echo "${found:-None}"
      package_json_scripts: |
        cd '{{param.target}}'
        if [ ! -f 'package.json' ]; then echo "None"; exit 0; fi
        if command -v jq >/dev/null 2>&1; then
          scripts=$(jq -r '.scripts // {} | to_entries[] | "  \(.key): \(.value)"' package.json 2>/dev/null)
          if [ -n "$scripts" ]; then
            echo "package.json scripts:"
            echo "$scripts"
          else
            echo "package.json has no scripts"
          fi
        else
          # Fallback: grep if jq not available
          echo "package.json scripts (raw):"
          grep -A 50 '"scripts"' package.json 2>/dev/null | grep -E '^\s+"[^"]+":' | head -30
        fi
      makefile_targets: |
        cd '{{param.target}}'
        if [ ! -f 'Makefile' ]; then echo "None"; exit 0; fi
        # Extract targets with ## comments + recipe lines
        grep -E '^[a-zA-Z_-]+:.*##' Makefile 2>/dev/null | head -40
        for inc in $(grep -E '^-?include ' Makefile 2>/dev/null | sed 's/^-\?include //' | head -10); do
          resolved=$(eval echo "$inc" 2>/dev/null)
          for f in $resolved; do
            [ -f "$f" ] && grep -E '^[a-zA-Z_-]+:.*##' "$f" 2>/dev/null | head -20
          done
        done

  - id: scan_env
    type: context
    depends_on: [scaffold]
    context:
      env_summary: |
        cd '{{param.target}}'
        env_files=$(ls .env .env.example .env.local .env.dev 2>/dev/null)
        if [ -z "$env_files" ]; then echo "None"; exit 0; fi
        echo "Files: $env_files"
        # Compare .env.example vs .env
        if [ -f '.env.example' ]; then
          example_vars=$(grep -v '^#' .env.example 2>/dev/null | grep '=' | cut -d= -f1 | sed 's/^export //' | sort)
          echo ""
          echo ".env.example variables ($(echo "$example_vars" | wc -l)): $(echo $example_vars | tr '\n' ', ')"
          if [ -f '.env' ]; then
            env_vars=$(grep -v '^#' .env 2>/dev/null | grep '=' | cut -d= -f1 | sed 's/^export //' | sort)
            missing=$(comm -23 <(echo "$example_vars") <(echo "$env_vars") 2>/dev/null)
            if [ -n "$missing" ]; then
              echo "WARNING: .env MISSING variables: $missing"
            else
              echo "OK: .env covers all variables from .env.example"
            fi
          else
            echo "WARNING: .env file does NOT exist — must be created from .env.example before dva up"
          fi
        fi

  - id: scan_subprojects
    type: context
    depends_on: [scaffold]
    context:
      subprojects: |
        cd '{{param.target}}'
        for d in */; do
          [ -d "$d" ] || continue
          base=$(basename "$d")
          case "$base" in
            node_modules|vendor|.git|.idea|.vscode|tmp|build|dist|target|compose|docker|infra|infrastructure|scripts|docs|monitoring|k8s|data|specs|reports|agent-mesh-flows) continue ;;
          esac
          markers=""
          [ -f "$d/package.json" ] && markers="$markers package.json"
          [ -f "$d/go.mod" ] && markers="$markers go.mod"
          [ -f "$d/pyproject.toml" ] && markers="$markers pyproject.toml"
          [ -f "$d/Cargo.toml" ] && markers="$markers Cargo.toml"
          [ -f "$d/Gemfile" ] && markers="$markers Gemfile"
          { [ -f "$d/dva.yml" ] || [ -f "$d/dva.yaml" ]; } && markers="$markers dva.yml"
          { [ -f "$d/compose.yaml" ] || [ -f "$d/docker-compose.yml" ]; } && markers="$markers compose"
          [ -n "$markers" ] && echo "$base:$markers"
        done
      workspace_map: |
        cd '{{param.target}}'
        # pnpm workspaces
        if [ -f 'pnpm-workspace.yaml' ]; then
          echo "=== pnpm-workspace.yaml ==="
          cat pnpm-workspace.yaml
        elif [ -f 'pnpm-workspace.yml' ]; then
          echo "=== pnpm-workspace.yml ==="
          cat pnpm-workspace.yml
        fi
        # npm/yarn workspaces in package.json
        if [ -f 'package.json' ]; then
          ws=$(grep -A 20 '"workspaces"' package.json 2>/dev/null | head -20)
          [ -n "$ws" ] && echo "=== package.json workspaces ===$ws"
        fi
        # Cargo workspace members
        if [ -f 'Cargo.toml' ]; then
          members=$(awk '/^\[workspace\]/,/^\[/' Cargo.toml 2>/dev/null | grep 'members' -A 20 | head -20)
          [ -n "$members" ] && echo "=== Cargo.toml [workspace.members] ==="
          [ -n "$members" ] && echo "$members"
        fi
        # Go workspaces
        if [ -f 'go.work' ]; then
          echo "=== go.work ==="
          cat go.work
        fi
        # If none found
        [ ! -f 'pnpm-workspace.yaml' ] && [ ! -f 'pnpm-workspace.yml' ] && \
        [ ! -f 'Cargo.toml' ] && [ ! -f 'go.work' ] && echo "None"

  # ══════════════════════════════════════════════
  # Phase 2: Current DVA State (replaces Go config.Load + validation)
  # ══════════════════════════════════════════════
  - id: dva_state
    type: context
    depends_on: [scaffold]
    context:
      raw_config: "cat {{param.target}}/dva.yml 2>/dev/null || cat {{param.target}}/dva.yaml 2>/dev/null || echo ''"
      manifest: |
        cd '{{param.target}}' && dva manifest -f json 2>/dev/null || echo '{}'
      resolved_config: |
        cd '{{param.target}}' && dva config show -f yaml 2>/dev/null | head -300 || echo ''
      validation: |
        cd '{{param.target}}' && dva config validate 2>&1 || true
      validation_strict: |
        cd '{{param.target}}' && dva config validate --strict 2>&1 || true

  - id: load_discovery_report
    type: context
    depends_on: [scaffold]
    context:
      discovery_report: |
        if [ -f '{{param.discovery_report}}' ]; then
          cat '{{param.discovery_report}}'
        else
          echo '{}'
        fi

  # ══════════════════════════════════════════════
  # Phase 3: Load Library Reference (static knowledge)
  # ══════════════════════════════════════════════
  # ══════════════════════════════════════════════
  # Locate agent-mesh-flows/shared
  # ══════════════════════════════════════════════
  # `read_file` resolves `src` against the run directory and refuses to leave am's
  # approved roots, so a repo-relative path only reaches the library when the flow
  # happens to run from inside the dva repo — and these flows exist to be pointed at
  # other projects. The path is machine-specific, so it arrives by parameter or env
  # var and the search below takes the first candidate that actually holds the library.
  #
  # Two conditions must hold on the workstation, and only the first is testable here:
  #   1. the directory resolves — proven below by looking for shared-guardrails.md;
  #   2. it is listed under `allowed_roots_add:` in
  #      ~/.config/agent-mesh/sandbox_override.yaml — enforced by am inside read_file.
  # `when:` does not gate that second check (measured: the path check runs before the
  # condition), so a missing root surfaces as "escaped all approved roots" on the next
  # step. The message below names both requirements for that reason.
  #
  # Failing loudly is deliberate. `exit_if_empty` exits the pipeline *successfully*,
  # which would hand back a report produced with no guardrails at all — the exact
  # defect this resolver exists to close.
  - id: resolve_shared
    type: context
    context:
      dir: |
        for cand in "{{param.shared_dir}}" "$DVA_SHARED_DIR" "$PWD/agent-mesh-flows/shared"; do
          [ -n "$cand" ] || continue
          [ -f "$cand/library/shared-guardrails.md" ] || continue
          printf '%s' "$cand"
          exit 0
        done
        echo "ERROR: agent-mesh-flows/shared not found." >&2
        echo "  Pass it explicitly:  -p shared_dir=<dva-repo>/agent-mesh-flows/shared" >&2
        echo "  or export DVA_SHARED_DIR to the same path." >&2
        echo "  The same path must also be listed under allowed_roots_add: in" >&2
        echo "  ~/.config/agent-mesh/sandbox_override.yaml — am's read_file cannot" >&2
        echo "  read outside an approved root." >&2
        exit 1

  - id: load_guardrails
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/shared-guardrails.md"

  - id: load_checklist
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/shared-checklist.md"

  - id: load_schema
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/dva-schema.md"

  - id: load_naming
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/naming-presets.md"

  - id: load_examples
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/reference-examples.md"

  - id: load_guardrails_mode
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/guardrails/guardrails-{{param.mode}}.md"

  # ══════════════════════════════════════════════
  # Phase 4: AI Improve (replaces Claude Code -p invocation)
  # ══════════════════════════════════════════════
  - id: improve
    type: llm
    depends_on:
      - backup_config
      - scan_compose
      - scan_build
      - scan_env
      - scan_subprojects
      - dva_state
      - load_discovery_report
      - load_guardrails
      - load_checklist
      - load_schema
      - load_naming
      - load_examples
      - load_guardrails_mode
    agent: claude
    profile: dva_improver
    instruction: |
      # Role & Objective
      당신은 DVA(Dev Virtual Auto) 설정 전문가입니다.
      프로젝트 구조를 분석하여, 개발자가 복잡한 Docker Compose나 스크립트 명령어 대신
      단순한 `dva [cmd]` 형식으로 작업할 수 있도록 `dva.yml`을 최적화하는 것이 목표입니다.

      ## Mode: {{param.mode}}
      {{load_guardrails_mode.output}}

      ## DVA Configuration Guardrails
      {{load_guardrails.output}}

      ## CRITICAL: version 필드
      - `version` 필드는 **건드리지 마세요**. 이 필드는 설정이 *읽는 쪽*에 요구하는 최소 DVA
        버전(reader floor)이지, 이 설정을 만든 바이너리의 버전이 아닙니다. 실행 중인 버전을
        써넣으면 그 설정은 더 낮은 DVA에서 전부 로드에 실패합니다.
      - 기존 값이 있으면 그대로 두고, 없으면 생략하세요. `version`은 optional이며 생략은
        "읽는 쪽에 아무것도 요구하지 않는다"는 뜻입니다.

      ## CRITICAL: 예약 커맨드 — interaction 키로 사용 금지
      다음 이름은 DVA 내장 커맨드로 예약되어 있습니다:
      `up`, `down`, `stop`, `restart`, `build`, `clean`, `logs`, `status`, `show`, `ls`, `run`,
      `config`, `doctor`, `provision`, `version`, `console`, `infra`, `app`, `stack`, `help`,
      `compose`, `validate`, `manifest`, `ktl`, `ssh`, `completion`, `init`

