      # Expected Output

      1. 발견한 문제를 우선순위대로 정리
      2. dva.yml을 직접 수정
      3. 변경 요약
      4. **필수 검증**: `dva config validate` 실행 → ERROR 0까지 수정 반복 (최대 3회)
      5. `dva.yml is valid` 확인 후 완료

      # MANDATORY SELF-REVIEW
      <!-- AUTOGEN:dva_flow_checklist:start -->
      # DVA Configuration Self-Review Checklist (Shared)

      > Single source of truth for dva.yml validation checklist.
      > Referenced by: improve prompt (auto mode), guided improve pipeline gates (interactive mode).

      ## Mandatory Checks (before finalizing dva.yml)

      ### Version & Header
      - [ ] `version` is optional or set to the reader floor — never the running CLI version; subprojects are checked independently, not against root
      - [ ] `yaml-language-server: $schema=...` comment on first line

      ### Structure
      - [ ] Section order follows canonical: version → vars → environment → env_file → stack → plans → environments → sites → health_checks → interaction → provision → modules → subprojects → endpoints → infra → ssh → devcontainer
      - [ ] `env_file:` uses object format (`files:` array; optional top-level `required:`)
      - [ ] `stack:` section present (no legacy `compose:` root-level)
      - [ ] New/rewrite config has at least one named `plans:` entry
      - [ ] Custom `checks:` do not duplicate built-in doctor checks
      - [ ] `provision:` exists only when setup/initialization work is required

      ### Stack & Compose
      - [ ] `stack.{entry}.runners.compose.tags: [infra]` present on primary compose runner
      - [ ] All files in `stack.{entry}.runners.compose.files` actually exist
      - [ ] Multi-stack entries do not redundantly list same base compose file
      - [ ] All services have `tags:`
      - [ ] Compose file has top-level `name:` matching `stack.{entry}.runners.compose.project_name`

      ### Ports & Endpoints
      - [ ] All host ports are project-unique (no common defaults: 5432, 6379, 3000, 8080, etc.)
      - [ ] User-facing ports declared in `endpoints:` section (not `services.ports`)

      ### Health Checks
      - [ ] All `health_checks` have `start:` and/or `start_hint:` (not both with identical values)
      - [ ] Health check URLs use literal values (no `${VAR:-DEFAULT}`)

      ### Lifecycle ownership
      - [ ] Each Compose service has one lifecycle owner: compose stack + plan
      - [ ] No matching `applications.*.run.docker.service` for a Compose-owned service
      - [ ] No standalone docker runner generated for an existing Compose service
      - [ ] Native app processes use native/process runners selected by plans
      - [ ] `plans.entries[].depends_on` has no circular references

      ### Interaction Commands
      - [ ] Host build commands use `runner: local`
      - [ ] Reserved commands use `replace:` hooks
      - [ ] No reserved DVA command names as plain interaction keys
      - [ ] No echo wrapper commands

      ### Provision
      - [ ] No `run: "dva <command>"` calls in provision steps
      - [ ] No raw compose/docker lifecycle command duplicates a named plan
      - [ ] No synthetic default/full/reset profile without setup evidence

      ### Subprojects (if applicable)
      - [ ] Subprojects use `exclude_tags: [infra]`
      - [ ] No `description:` field in subprojects (only `path`, `exclude_tags`, `import`)
      - [ ] Every imported subproject has its own `dva.yml`; placeholders without import entries (`import` omitted or `import: {}`) may be initialized later

      ### Plans & runner strategy
      - [ ] Plans select only declared runners
      - [ ] Compose service subsets use `plans.entries[].services`
      - [ ] Each plan explicitly contains the full capability closure; it does not assume another plan is an overlay
      - [ ] `local-infra` contains only verified core providers; `local-dev` adds verified native apps; `full-stack`, `observability`, and `tools` are opt-in
      - [ ] Every required capability has exactly one lifecycle provider
      - [ ] Injected `capability_bindings` have provider/consumer evidence, are materialized through supported DVA fields, and are not emitted as new config keys
      - [ ] `default_plan` is safe, local, and non-destructive; it is never generated as `full-stack`
      - [ ] Environments distinguish dev/stg/prd variables
      - [ ] Sites distinguish local/remote host differences

      ### Final Validation
      - [ ] `dva config validate` exits with ERROR 0
      <!-- AUTOGEN:dva_flow_checklist:end -->

      추가 확인:
      - [ ] `version` 필드를 손대지 않았는가? (기존 값 유지, 원래 없었으면 계속 없음)
      - [ ] `dva config validate` ERROR 0인가?

  # ══════════════════════════════════════════════
  # Phase 5: Post-improve Validation Loop
  # ══════════════════════════════════════════════
  - id: validate_pass1
    type: context
    depends_on: [improve]
    context:
      result: |
        cd '{{param.target}}' && dva config validate 2>&1 || true
      is_valid: |
        cd '{{param.target}}' && dva config validate 2>&1 | grep -q "dva.yml is valid" && printf true || printf false

  # Deterministic pre-screen before Retry 1 (catches structural issues yq can verify)
  - id: deterministic_check_1
    type: context
    depends_on: [validate_pass1]
    when: "{{validate_pass1.is_valid}} != 'true'"
    context:
      structural_errors: |
        cd '{{param.target}}'
        DVA_FILE=$([ -f 'dva.yml' ] && echo dva.yml || echo dva.yaml)
        ERRORS=""

        # Rule: run.native and run.docker must be YAML objects (not strings)
        for path in interaction; do
          if yq e ".${path} | keys | .[]" "$DVA_FILE" 2>/dev/null | while read key; do
            native=$(yq e ".${path}[\"${key}\"].run.native | type" "$DVA_FILE" 2>/dev/null)
            docker=$(yq e ".${path}[\"${key}\"].run.docker | type" "$DVA_FILE" 2>/dev/null)
            [ "$native" = "!!str" ] && echo "ERROR: interaction.${key}.run.native is a string — must be a YAML object {cmd: ...}"
            [ "$docker" = "!!str" ] && echo "ERROR: interaction.${key}.run.docker is a string — must be a YAML object {cmd: ...}"
          done; then :; fi
        done 2>/dev/null || true

        # Rule: stack section must not be empty if compose/kubectl/helm files detected
        stack_keys=$(yq e '.stack | keys | length' "$DVA_FILE" 2>/dev/null || echo 0)
        [ "$stack_keys" = "0" ] && ERRORS="$ERRORS\nERROR: .stack section is empty or missing — add at least one plugin entry"

        # Rule: new declarative model should expose at least one named plan
        plan_keys=$(yq e '.plans | keys | length' "$DVA_FILE" 2>/dev/null || echo 0)
        [ "$plan_keys" = "0" ] && ERRORS="$ERRORS\nERROR: .plans is empty or missing — add a named execution plan"

        if [ -z "$ERRORS" ]; then
          echo "OK — no structural rule violations detected"
        else
          printf "%b\n" "$ERRORS"
        fi

  # Retry 1: fix validation errors
  - id: fix_validation_1
    type: llm
    depends_on: [deterministic_check_1]
    when: "{{validate_pass1.is_valid}} != 'true'"
    agent: claude
    profile: dva_validator
    instruction: |
      # DVA Validation Fix (Retry 1/2)

      dva.yml에서 검출된 validation 에러를 수정하세요.

      ## Current dva.yml
      ```yaml
      {{dva_state.raw_config}}
      ```

      ## Validation Output
      ```text
      {{validate_pass1.result}}
      ```

      ## Deterministic Structural Check (fix these FIRST)
      ```text
      {{deterministic_check_1.structural_errors}}
      ```

      ## Instructions
      1. **Deterministic 에러를 최우선으로 수정** — 타입 오류, 누락 필드 등 위 구조적 지적을 먼저 처리.
      2. 에러/경고를 수정하세요. **최소 변경만** — 에러 수정에 집중.
      3. 기존 interaction 이름, 구조 유지.
      4. DVA schema {{check_prerequisites.dva_version | trim}} 호환 필수.

      ## DVA Guardrails Reference
      <!-- AUTOGEN:dva_flow_guardrails:start -->
      # DVA Configuration Guardrails (Shared)

      > Single source of truth for dva.yml generation/improvement rules.
      > Referenced by: improve prompt (auto mode), guided improve pipeline (interactive mode).

      > **Auto-generated sections** — rule 4 (`version:`), rule 9 (reserved commands) and rule 14
      > (section order) are regenerated from `internal/config` by `make generate` (tools/libgen) and
      > bounded by `<!-- AUTOGEN:... -->` markers. Edit the Go source, not the marker block. Other
      > rules are hand-authored. See `shared/library/README.md` for the ownership boundary.

      ## Critical Rules

      1. **`stack:` section required** — Compose config MUST be under `stack.<entry>.runners.compose`. Migrate legacy root-level `compose:` and `stack.<entry>.compose` fields to `runners.compose`.
      2. **`plans:` current model** — New/rewrite configs MUST use named `plans:`.
         Preserve legacy `modes:` only until an explicit migration; never generate new
         modes/applications merely to satisfy an old example.
      3. **Plan scope** — Derive self-contained plans from the capability closure in
         `naming-presets.md`. Provide only plans backed by evidence. Service selection
         belongs in `plans.*.entries[].services`; plans do not inherit or overlay each other.
      4. **`version:` field** — Optional, and it is a **minimum required reader version**, not the
         version of the binary that generated the config. Canonical source:
         `internal/config/version.go` — the block below is regenerated by `make generate`
         (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:version_rule:start -->
         Omit `version:` for no compatibility gate. When declaring it, use `0.1.44` — the floor `dva init` writes. Never scaffold the running CLI version: that makes every generated config refuse to load on an older DVA, ratcheting the floor up on each release. Subproject `version:` is checked against the running DVA independently; DVA never compares a subproject's version to root, so do not require them to agree.
         <!-- AUTOGEN:version_rule:end -->
      5. **`health_checks`: `start` and/or `start_hint`** — `start` is the auto-start command (optional). `start_hint` is human-readable hint text shown by `dva status` (optional). If `start` is set, `start_hint` is only needed when it differs from the start command. Do not set both to identical values (validation warning).
      6. **Health check URLs: literal values only** — `url:` and `address:` fields must use literal values (e.g., `http://localhost:14000/health`), NOT `${VAR:-DEFAULT}` patterns.
      7. **Port conventions** — Never use common default ports as host ports: 2181, 3000, 3306, 5432, 6379, 8080, 8443, 9090, 9092, 9200, 15672, 27017. Pick a project-specific range instead (e.g. 11100-11199).
      8. **`runner: local` for host commands** — Build/test/lint/fmt/check MUST use `runner: local`. Never use `echo 'Run: ...'` wrappers.
      9. **Reserved commands** — DVA built-in commands that MUST NOT appear as plain interaction
         keys. Hookable ones use `replace:` hooks; others must be renamed (e.g., `service-status`,
         `db-migrate`). Canonical source: `internal/config/reserved.go` — the block below is
         regenerated by `make generate` (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:reserved_commands:start -->
         Reserved (24, must not be interaction keys): `build`, `completion`, `compose`, `config`, `console`, `doctor`, `down`, `help`, `init`, `ktl`, `logs`, `ls`, `manifest`, `provision`, `restart`, `run`, `show`, `skill`, `ssh`, `status`, `stop`, `up`, `validate`, `version`
         Hookable (use `replace:` hooks, 6): `build`, `down`, `logs`, `restart`, `stop`, `up`
         <!-- AUTOGEN:reserved_commands:end -->
      10. **Provision: setup only** — NEVER call `run: "dva <command>"` (circular
          dependency), and do not duplicate plan up/down actions with raw lifecycle commands.
      11. **Provision evidence** — Generate only profiles backed by actual setup work;
          never invent `default`, `full`, or `reset` profiles to satisfy a template.
      12. **`env_file:` object format** — Prefer `{ files: [...] }` (optional `required:`); plain string path is also valid.
      13. **Built-in checks first** — Do not generate custom Docker socket, Compose
          file, or env-file checks already emitted by `dva doctor`. Add `checks:` only
          for project-specific prerequisites.
      14. **Section order (canonical)** — Canonical source:
          `internal/config/validate_warnings.go` — the order below is regenerated by
          `make generate` (tools/libgen). Legacy keys (`checks` … `modes`) retain a
          deterministic position during migration only; do not generate them for new configs.

          <!-- AUTOGEN:section_order:start -->
          `version` → `vars` → `environment` → `env_file` → `stack` → `plans` → `default_plan` → `environments` → `sites` → `checks` → `default_mode` → `suggestion_ignore` → `modes` → `health_checks` → `interaction` → `provision` → `modules` → `subprojects` → `endpoints` → `infra` → `ssh` → `devcontainer`
          <!-- AUTOGEN:section_order:end -->
      15. **File header** — First line must be `# yaml-language-server: $schema=...` schema comment.
      16. **`stack.<entry>.runners.compose.tags: [infra]`** — Primary compose runner MUST have compose-level `tags:` field.
      17. **Service metadata: tags required** — Every service MUST have `tags:`. Port metadata (label, http, paths) belongs in `endpoints:` section, NOT in `services.ports`.
      18. **Compose `name:` required** — compose.yml must have top-level `name:` matching `stack.<entry>.runners.compose.project_name`.
      19. **Compose `version:` key** — Remove if present (Compose Specification does not require it).
      20. **Stack files: verify existence** — Every file listed in `stack.{entry}.runners.compose.files` MUST actually exist. Run `ls` to verify.
      21. **Multi-stack entries: no duplicate base files** — Do NOT repeat base `compose.yml` in every entry.
      22. **Package names: EXACT from manifests** — Use `[package] name` from Cargo.toml, module path from go.mod, `name` from package.json. NOT directory names.
      23. **Naming presets** — Tags: infra, api, worker, ui, data, monitoring, build.
          Plans: local-infra, local-dev, full-stack, observability, tools. Environments:
          dev, test, stg, prd. The exact inclusion/default matrix and injected platform
          binding rules live in `naming-presets.md`.
          Environment names label variable sets, not deployment targets — see rule 41.
      24. **No echo wrappers** — Never generate `echo 'Run: ...'` dummy commands.
      25. **No code changes** — Only modify `dva.yml` and related config. Do not touch app code or Dockerfiles.
