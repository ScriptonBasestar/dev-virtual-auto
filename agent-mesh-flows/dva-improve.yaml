      # Phase 4: Review Tasks

      ## 0. MANDATORY: version 필드는 그대로 둔다
      `version` 필드를 새로 쓰거나 덮어쓰지 마세요. reader floor이지 빌드 스탬프가 아닙니다.
      기존 값은 유지, 없으면 생략.

      ## 1. 드리프트 검출
