  - id: validate_final
    type: context
    depends_on: [fix_validation_2, validate_pass1]
    context:
      result: |
        cd '{{param.target}}' && dva config validate 2>&1 || true
      is_valid: |
        cd '{{param.target}}' && dva config validate 2>&1 | grep -q "dva.yml is valid" && printf true || printf false

  # There is deliberately no version-rewrite phase here (TASK-135). `version:` is the
  # minimum DVA a config requires of its *reader*, not a stamp of the binary that edited
  # it — see internal/config/version.go. dva-improve edits somebody else's config and has
  # no evidence about what floor that config actually needs, so it leaves the field alone:
  # an existing value is the author's declaration, and an absent one is the no-gate
  # default. The step that used to live here sed-rewrote `^version:` to the running
  # binary's version unconditionally, raising every target's floor to whatever DVA
  # happened to be installed on the machine that ran the flow.

  # ══════════════════════════════════════════════
  # Phase 6: Semantic Warning Triage (non-destructive)
  # Strict warnings are SEPARATE from hard validation errors.
  # They are surfaced as suggestions only — the LLM MUST NOT
  # change structural fields just to silence them.
  # ══════════════════════════════════════════════
  - id: semantic_triage_state
    type: context
    depends_on: [validate_final]
    context:
      strict_result: |
        cd '{{param.target}}' && dva config validate --strict 2>&1 || true
      hard_result: |
        cd '{{param.target}}' && dva config validate 2>&1 || true
      is_hard_valid: |
        cd '{{param.target}}' && dva config validate 2>&1 | grep -q "dva.yml is valid" && printf true || printf false

  - id: semantic_triage
    type: llm
    depends_on: [semantic_triage_state]
    backend: fast
    instruction: |
      # Phase 6: Semantic Warning Triage

      Hard validation (ERROR 0 required) 결과:
      ```text
      {{semantic_triage_state.hard_result}}
      ```

      Strict validation (semantic drift warnings) 결과:
      ```text
      {{semantic_triage_state.strict_result}}
      ```

      ## 역할
      dva.yml의 hard validation은 이미 통과했습니다.
      아래 기준으로 strict 경고를 분류하고, 사용자에게 보고만 하세요.
      **직접 파일을 수정하지 마세요.**

      ## 분류 기준
      - **[IGNORE]** — DVA가 자동 처리하거나 의도된 설정 (e.g., 기본 포트, 단순 구조)
      - **[SUGGEST]** — 가능하면 개선 권장, 하지만 필수 아님 (e.g., 명명 규칙, 누락 endpoints)
      - **[REVIEW]** — 사용자가 직접 결정해야 할 설계 선택 (e.g., mode 전략, health_check 방식)

      ## Output Format
      분류된 경고 목록을 markdown 테이블로 출력:
      | Warning | Category | Rationale |
      |---------|----------|-----------|

      마지막에 한 줄 요약: `Hard Errors: 0 | Semantic Suggestions: N`

