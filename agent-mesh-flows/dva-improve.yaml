      ## 2. Makefile/package.json 매핑
      핵심 워크플로우만 DVA interaction으로 노출.
      prefix 기반 subcommand 그루핑 적용.

      ## 3. 네이밍 프리셋 준수
      {{load_naming.output}}

      ## 4. 누락 섹션 검사
      - [ ] compose runner가 필요한 `stack.<entry>.runners.compose` 선언
      - [ ] 신규/rewrite 설정에는 실행 가능한 `plans` 섹션
      - [ ] `env_file` 섹션
      - [ ] `health_checks` 섹션
      - [ ] 준비 작업이 있을 때만 `provision`
      - [ ] `endpoints` 섹션
      - [ ] `subprojects` 섹션 (서브프로젝트 감지 시)

      `workspace_map`의 실행 순서는 `plans.entries[].depends_on`에 반영하세요.

      **Lifecycle ownership invariant**: Compose 파일에 있는 서비스는 compose stack +
      plan이 유일하게 기동합니다. 같은 서비스를 `applications.*.run.docker.service`,
      별도 docker runner, interaction의 `docker compose up`, provision 시작 단계에
      중복 선언하지 마세요. `docker` runner는 Compose 서비스가 아닌 독립적인
      `docker run` 컨테이너에만 사용합니다.

      ## 5. 안티패턴 검사
      - echo 더미 없음, 기본 포트 미사용, 예약 커맨드 미사용

