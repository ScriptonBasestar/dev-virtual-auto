# yaml-language-server: $schema=../agent-mesh-flows/schemas/flow.schema.json
name: dva-diagnose
description: "Run dva up, collect errors, diagnose and auto-fix dva.yml configuration issues"
contract:
  goal: "dva up 실행 시 발생하는 오류를 분석하고 dva.yml 수정으로 해결 가능한 문제를 자동 수정한다"
  expected_results:
    - "오류가 AUTO_FIX / USER_DECISION / OUT_OF_SCOPE로 분류된다"
    - "AUTO_FIX 항목은 자동으로 dva.yml에 반영된다"
    - "dva up이 성공한다 (최대 3회 재시도)"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "dva.yml이 존재해야 한다"
    - "앱 소스 코드는 수정하지 않는다"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_diagnoser

parameters:
  - name: target
    description: "Target directory"
    default: "."
  - name: max_retries
    description: "Maximum diagnosis retry attempts"
    default: "3"

steps:
  # ══════════════════════════════════════════════
  # Phase 0: Prerequisites
  # ══════════════════════════════════════════════
  - id: check_prerequisites
    type: context
    context:
      dva_available: |
        command -v dva >/dev/null 2>&1 && echo "yes" || echo ""
      dva_version: "dva version --short 2>/dev/null || echo 'unknown'"
      has_dva_yml: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false
    exit_if_empty: dva_available

  - id: check_config_exists
    type: context
    depends_on: [check_prerequisites]
    context:
      can_proceed: |
        if [ "{{check_prerequisites.has_dva_yml | trim}}" = "true" ]; then
          echo "yes"
        else
          echo "dva.yml not found. Run 'dva init' or 'am run dva-improve' first." >&2
          echo ""
        fi
    exit_if_empty: can_proceed

  # ══════════════════════════════════════════════
  # Phase 1: Collect Current State
  # ══════════════════════════════════════════════
  - id: collect_state
    type: context
    depends_on: [check_config_exists]
    context:
      raw_config: "cat {{param.target}}/dva.yml 2>/dev/null || cat {{param.target}}/dva.yaml 2>/dev/null || echo ''"
      validation: "cd '{{param.target}}' && dva config validate 2>&1 || true"
      env_info: |
        cd '{{param.target}}'
        echo "=== Environment Files ==="
        ls .env .env.* 2>/dev/null || echo "no env files"
        echo ""
        echo "=== Docker ==="
        docker info --format '{{.ServerVersion}}' 2>/dev/null || echo "docker not available"
        echo ""
        echo "=== DVA Doctor ==="
        dva doctor 2>&1 || echo "doctor failed"

  # ══════════════════════════════════════════════
  # Phase 2: App Environment Scan
  # ══════════════════════════════════════════════
  - id: scan_app_env
    type: context
    depends_on: [check_config_exists]
    context:
      app_env_requirements: |
        cd '{{param.target}}'
        echo "=== Source Code Env Var Usage ==="
        # Go: os.Getenv, os.LookupEnv
        find . -name '*.go' -not -path '*/vendor/*' -exec grep -l 'os\.Getenv\|os\.LookupEnv' {} \; 2>/dev/null | head -20 | while read f; do
          echo "--- $f ---"
          grep -oE 'os\.(Getenv|LookupEnv)\("([^"]+)"\)' "$f" 2>/dev/null | head -10
        done
        # Rust: std::env::var
        find . -name '*.rs' -not -path '*/target/*' -exec grep -l 'env::var\|env::var_os' {} \; 2>/dev/null | head -20 | while read f; do
          echo "--- $f ---"
          grep -oE 'env::var(_os)?\("([^"]+)"\)' "$f" 2>/dev/null | head -10
        done
        # Python: os.environ, os.getenv
        find . -name '*.py' -not -path '*/.venv/*' -exec grep -l 'os\.environ\|os\.getenv' {} \; 2>/dev/null | head -20 | while read f; do
          echo "--- $f ---"
          grep -oE 'os\.(environ\.get|getenv)\(["'\'']([^"'\'']+)' "$f" 2>/dev/null | head -10
        done
        # Node: process.env
        find . -name '*.ts' -o -name '*.js' 2>/dev/null | grep -v node_modules | head -20 | while read f; do
          matches=$(grep -oE 'process\.env\.([A-Z_]+)' "$f" 2>/dev/null | head -10)
          [ -n "$matches" ] && echo "--- $f ---" && echo "$matches"
        done

  # ══════════════════════════════════════════════
  # Phase 3: Execute and Collect Errors
  # ══════════════════════════════════════════════
  - id: execute_dva_up
    type: shell
    depends_on: [collect_state, scan_app_env]
    ignore_error: true
    timeout_seconds: 120
    action: |
      cd '{{param.target}}'
      echo "=== dva up (attempt) ==="
      dva up 2>&1 | tail -50 || true
      echo ""
      echo "=== dva status ==="
      dva status 2>&1 | tail -20 || true

  # ══════════════════════════════════════════════
  # Phase 4: AI Diagnosis + Auto-Fix
  # ══════════════════════════════════════════════
  - id: load_guardrails
    type: read_file
    src: "workflow/library/shared-guardrails.md"

  - id: diagnose_and_fix
    type: llm
    depends_on: [collect_state, scan_app_env, execute_dva_up, load_guardrails]
    agent: claude
    instruction: |
      # DVA 진단 전문가

      dva up 실행 시 발생한 오류를 분석하고, dva.yml 수정으로 해결 가능한 문제를 자동 수정하라.

      ## 수정 범위
      - dva.yml, env 파일, compose 파일만 수정
      - 앱 소스 코드 수정 금지
      - 수정 불가능한 문제는 분류하여 리포트

      ## Phase 1: 현재 상태
      ```yaml
      {{collect_state.raw_config}}
      ```

      ### Validation
      ```
      {{collect_state.validation}}
      ```

      ### Environment Info
      ```
      {{collect_state.env_info}}
      ```

      ## Phase 2: 앱 환경 스캔
      ```
      {{scan_app_env.app_env_requirements}}
      ```

      ## Phase 3: 실행 결과
      ```
      {{execute_dva_up.output}}
      ```

      ## Instructions

      1. 오류 원인을 파악하세요.
      2. 각 문제를 분류:
         - **AUTO_FIX**: dva.yml 수정으로 즉시 해결 (환경변수, 포트, 의존성 순서 등)
         - **USER_DECISION**: 사용자 입력 필요 (포트 선택, 전략 변경)
         - **OUT_OF_SCOPE**: dva 범위 밖 (앱 버그, 외부 서비스)
      3. AUTO_FIX 항목은 즉시 dva.yml 수정
      4. 수정 후 `dva config validate` 실행하여 검증
      5. 결과를 아래 형식으로 출력:

      ```
      ## Diagnose Report
      ### AUTO_FIX (수정 완료)
      - [문제]: [수정 내용]
      ### USER_DECISION (사용자 확인 필요)
      - [문제]: [선택지]
      ### OUT_OF_SCOPE (dva 범위 밖)
      - [문제]: [권장 조치]
      ```

      ## DVA Guardrails
      {{load_guardrails.output}}

  # ══════════════════════════════════════════════
  # Phase 5: Re-validate and Re-execute
  # ══════════════════════════════════════════════
  - id: revalidate
    type: shell
    depends_on: [diagnose_and_fix]
    ignore_error: true
    action: |
      cd '{{param.target}}'
      echo "=== Post-fix validation ==="
      dva config validate 2>&1 || true

      echo ""
      echo "=== Post-fix dva up ==="
      dva up 2>&1 | tail -30 || true

      echo ""
      echo "=== Final status ==="
      dva status 2>&1 | tail -20 || true

  - id: print_summary
    type: llm
    depends_on: [revalidate]
    backend: fast
    instruction: |
      진단 결과를 요약하라.
      - 수정된 항목 (AUTO_FIX)
      - 사용자 확인 필요 항목 (USER_DECISION)
      - 범위 밖 항목 (OUT_OF_SCOPE)
      - 최종 dva up 성공 여부

      [REVALIDATE OUTPUT]
      {{revalidate.output}}
