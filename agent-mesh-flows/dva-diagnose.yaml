# yaml-language-server: $schema=schemas/flow.schema.json
name: dva-diagnose
description: "Run dva up, collect errors, diagnose and auto-fix dva.yml configuration issues"
contract:
  goal: "dva up 실행 시 발생하는 오류를 분석하고 dva.yml 수정으로 해결 가능한 문제를 자동 수정한다"
  expected_results:
    - "오류가 AUTO_FIX / USER_DECISION / OUT_OF_SCOPE로 분류된다"
    - "AUTO_FIX 항목은 자동으로 dva.yml에 반영된다"
    - "dva up이 성공한다 (최대 3회 재시도)"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "dva.yml이 존재해야 한다"
    - "앱 소스 코드는 수정하지 않는다"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_diagnoser

parameters:
  - name: target
    description: "Target directory"
    default: "."
  - name: max_retries
    description: "Maximum diagnosis retry attempts"
    default: "3"

steps:
  # ══════════════════════════════════════════════
  # Phase 0: Prerequisites
  # ══════════════════════════════════════════════
  - id: check_prerequisites
    type: context
    context:
      # A missing prerequisite is a stop, not a finish. `exit_if_empty` ends the pipeline
      # *successfully* (flow.schema.json), so an absent CLI produced a clean run that did
      # nothing — indistinguishable from a run that had nothing to do. Exit non-zero here
      # instead and let the step failure carry the reason.
      dva_available: |
        if ! command -v dva >/dev/null 2>&1; then
          echo "ERROR: dva is not on PATH. Install it, then re-run." >&2
          exit 1
        fi
        printf 'yes'
      # `dva version` has no --short flag; parse the --json contract instead. This flow only
      # reports the value, so the old 'unknown' misreported rather than corrupted anything.
      dva_version: "dva version --json 2>/dev/null | jq -r '.version // \"unknown\"' 2>/dev/null || echo 'unknown'"
      has_dva_yml: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false

  - id: check_config_exists
    type: context
    depends_on: [check_prerequisites]
    context:
      can_proceed: |
        if [ "{{check_prerequisites.has_dva_yml | trim}}" != "true" ]; then
          echo "ERROR: dva.yml not found. Run 'dva init' or 'am run dva dva-improve' first." >&2
          exit 1
        fi
        printf 'yes'

  # ══════════════════════════════════════════════
  # Phase 1: Collect Current State
  # ══════════════════════════════════════════════
  - id: collect_state
    type: context
    depends_on: [check_config_exists]
    context:
      raw_config: "cat {{param.target}}/dva.yml 2>/dev/null || cat {{param.target}}/dva.yaml 2>/dev/null || echo ''"
      validation: "cd '{{param.target}}' && dva config validate 2>&1 || true"
      env_info: |
        cd '{{param.target}}'
        echo "=== Environment Files ==="
        ls .env .env.* 2>/dev/null || echo "no env files"
        echo ""
        echo "=== Docker ==="
        docker info --format '{{.ServerVersion}}' 2>/dev/null || echo "docker not available"
        echo ""
        echo "=== DVA Doctor ==="
        dva doctor 2>&1 || echo "doctor failed"

  # ══════════════════════════════════════════════
  # Phase 2: App Environment Scan
  # ══════════════════════════════════════════════
  - id: scan_app_env
    type: context
    depends_on: [check_config_exists]
    context:
      app_env_requirements: |
        cd '{{param.target}}'
        echo "=== Source Code Env Var Usage ==="
        # Go: os.Getenv, os.LookupEnv
        find . -name '*.go' -not -path '*/vendor/*' -exec grep -l 'os\.Getenv\|os\.LookupEnv' {} \; 2>/dev/null | head -20 | while read f; do
          echo "--- $f ---"
          grep -oE 'os\.(Getenv|LookupEnv)\("([^"]+)"\)' "$f" 2>/dev/null | head -10
        done
        # Rust: std::env::var
        find . -name '*.rs' -not -path '*/target/*' -exec grep -l 'env::var\|env::var_os' {} \; 2>/dev/null | head -20 | while read f; do
          echo "--- $f ---"
          grep -oE 'env::var(_os)?\("([^"]+)"\)' "$f" 2>/dev/null | head -10
        done
        # Python: os.environ, os.getenv
        find . -name '*.py' -not -path '*/.venv/*' -exec grep -l 'os\.environ\|os\.getenv' {} \; 2>/dev/null | head -20 | while read f; do
          echo "--- $f ---"
          grep -oE 'os\.(environ\.get|getenv)\(["'\'']([^"'\'']+)' "$f" 2>/dev/null | head -10
        done
        # Node: process.env
        find . -name '*.ts' -o -name '*.js' 2>/dev/null | grep -v node_modules | head -20 | while read f; do
          matches=$(grep -oE 'process\.env\.([A-Z_]+)' "$f" 2>/dev/null | head -10)
          [ -n "$matches" ] && echo "--- $f ---" && echo "$matches"
        done

  # ══════════════════════════════════════════════
  # Phase 3: Execute and Collect Errors
  # ══════════════════════════════════════════════
  - id: execute_dva_up
    type: shell
    depends_on: [collect_state, scan_app_env]
    ignore_error: true
    timeout_seconds: 120
    action: |
      cd '{{param.target}}'
      echo "=== dva up (attempt) ==="
      dva up 2>&1 | tail -50 || true
      echo ""
      echo "=== dva status ==="
      dva status 2>&1 | tail -20 || true

  # ══════════════════════════════════════════════
  # Phase 4: AI Diagnosis + Auto-Fix
  # ══════════════════════════════════════════════
  - id: diagnose_and_fix
    type: llm
    depends_on: [collect_state, scan_app_env, execute_dva_up]
    agent: claude
    instruction: |
      # DVA 진단 전문가

      dva up 실행 시 발생한 오류를 분석하고, dva.yml 수정으로 해결 가능한 문제를 자동 수정하라.

      ## 수정 범위
      - dva.yml, env 파일, compose 파일만 수정
      - 앱 소스 코드 수정 금지
      - 수정 불가능한 문제는 분류하여 리포트

      ## Phase 1: 현재 상태
      ```yaml
      {{collect_state.raw_config}}
      ```

      ### Validation
      ```
      {{collect_state.validation}}
      ```

      ### Environment Info
      ```
      {{collect_state.env_info}}
      ```

      ## Phase 2: 앱 환경 스캔
      ```
      {{scan_app_env.app_env_requirements}}
      ```

      ## Phase 3: 실행 결과
      ```
      {{execute_dva_up.output}}
      ```

      ## Instructions

      1. 오류 원인을 파악하세요.
      2. 각 문제를 분류:
         - **AUTO_FIX**: dva.yml 수정으로 즉시 해결 (환경변수, 포트, 의존성 순서 등)
         - **USER_DECISION**: 사용자 입력 필요 (포트 선택, 전략 변경)
         - **OUT_OF_SCOPE**: dva 범위 밖 (앱 버그, 외부 서비스)
      3. AUTO_FIX 항목은 즉시 dva.yml 수정
      4. 수정 후 `dva config validate` 실행하여 검증
      5. 결과를 아래 형식으로 출력:

      ```
      ## Diagnose Report
      ### AUTO_FIX (수정 완료)
      - [문제]: [수정 내용]
      ### USER_DECISION (사용자 확인 필요)
      - [문제]: [선택지]
      ### OUT_OF_SCOPE (dva 범위 밖)
      - [문제]: [권장 조치]
      ```

      ## DVA Guardrails
      <!-- AUTOGEN:dva_flow_guardrails:start -->
      # DVA Configuration Guardrails (Shared)

      > Single source of truth for dva.yml generation/improvement rules.
      > Referenced by: improve prompt (auto mode), guided improve pipeline (interactive mode).

      > **Auto-generated sections** — rule 4 (`version:`), rule 9 (reserved commands) and rule 14
      > (section order) are regenerated from `internal/config` by `make generate` (tools/libgen) and
      > bounded by `<!-- AUTOGEN:... -->` markers. Edit the Go source, not the marker block. Other
      > rules are hand-authored. See `shared/library/README.md` for the ownership boundary.

      ## Critical Rules

      1. **`stack:` section required** — Compose config MUST be under `stack.<entry>.runners.compose`. Migrate legacy root-level `compose:` and `stack.<entry>.compose` fields to `runners.compose`.
      2. **`plans:` current model** — New/rewrite configs MUST use named `plans:`.
         Preserve legacy `modes:` only until an explicit migration; never generate new
         modes/applications merely to satisfy an old example.
      3. **Plan scope** — Derive self-contained plans from the capability closure in
         `naming-presets.md`. Provide only plans backed by evidence. Service selection
         belongs in `plans.*.entries[].services`; plans do not inherit or overlay each other.
      4. **`version:` field** — Optional, and it is a **minimum required reader version**, not the
         version of the binary that generated the config. Canonical source:
         `internal/config/version.go` — the block below is regenerated by `make generate`
         (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:version_rule:start -->
         Omit `version:` for no compatibility gate. When declaring it, use `0.1.44` — the floor `dva init` writes. Never scaffold the running CLI version: that makes every generated config refuse to load on an older DVA, ratcheting the floor up on each release. Subproject `version:` is checked against the running DVA independently; DVA never compares a subproject's version to root, so do not require them to agree.
         <!-- AUTOGEN:version_rule:end -->
      5. **`health_checks`: `start` and/or `start_hint`** — `start` is the auto-start command (optional). `start_hint` is human-readable hint text shown by `dva status` (optional). If `start` is set, `start_hint` is only needed when it differs from the start command. Do not set both to identical values (validation warning).
      6. **Health check URLs: literal values only** — `url:` and `address:` fields must use literal values (e.g., `http://localhost:14000/health`), NOT `${VAR:-DEFAULT}` patterns.
      7. **Port conventions** — Never use common default ports as host ports: 2181, 3000, 3306, 5432, 6379, 8080, 8443, 9090, 9092, 9200, 15672, 27017. Pick a project-specific range instead (e.g. 11100-11199).
      8. **`runner: local` for host commands** — Build/test/lint/fmt/check MUST use `runner: local`. Never use `echo 'Run: ...'` wrappers.
      9. **Reserved commands** — DVA built-in commands that MUST NOT appear as plain interaction
         keys. Hookable ones use `replace:` hooks; others must be renamed (e.g., `service-status`,
         `db-migrate`). Canonical source: `internal/config/reserved.go` — the block below is
         regenerated by `make generate` (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:reserved_commands:start -->
         Reserved (26, must not be interaction keys): `agent-deny`, `build`, `completion`, `compose`, `config`, `console`, `doctor`, `down`, `help`, `init`, `ktl`, `kubectl`, `logs`, `ls`, `manifest`, `provision`, `restart`, `run`, `show`, `skill`, `ssh`, `status`, `stop`, `up`, `validate`, `version`
         Hookable (use `replace:` hooks, 6): `build`, `down`, `logs`, `restart`, `stop`, `up`
         <!-- AUTOGEN:reserved_commands:end -->
      10. **Provision: setup only** — NEVER call `run: "dva <command>"` (circular
          dependency), and do not duplicate plan up/down actions with raw lifecycle commands.
      11. **Provision evidence** — Generate only profiles backed by actual setup work;
          never invent `default`, `full`, or `reset` profiles to satisfy a template.
      12. **`env_file:` object format** — Prefer `{ files: [...] }` (optional `required:`); plain string path is also valid.
      13. **Built-in checks first** — Do not generate custom Docker socket, Compose
          file, or env-file checks already emitted by `dva doctor`. Add `checks:` only
          for project-specific prerequisites.
      14. **Section order (canonical)** — Canonical source:
          `internal/config/validate_warnings.go` — the order below is regenerated by
          `make generate` (tools/libgen). Legacy keys (`checks` … `modes`) retain a
          deterministic position during migration only; do not generate them for new configs.

          <!-- AUTOGEN:section_order:start -->
          `version` → `vars` → `environment` → `env_file` → `stack` → `plans` → `default_plan` → `environments` → `sites` → `checks` → `default_mode` → `suggestion_ignore` → `modes` → `health_checks` → `interaction` → `provision` → `modules` → `subprojects` → `endpoints` → `infra` → `ssh` → `devcontainer`
          <!-- AUTOGEN:section_order:end -->
      15. **File header** — First line must be `# yaml-language-server: $schema=...` schema comment.
      16. **`stack.<entry>.runners.compose.tags: [infra]`** — Primary compose runner MUST have compose-level `tags:` field.
      17. **Service metadata: tags required** — Every service MUST have `tags:`. Port metadata (label, http, paths) belongs in `endpoints:` section, NOT in `services.ports`.
      18. **Compose `name:` required** — compose.yml must have top-level `name:` matching `stack.<entry>.runners.compose.project_name`.
      19. **Compose `version:` key** — Remove if present (Compose Specification does not require it).
      20. **Stack files: verify existence** — Every file listed in `stack.{entry}.runners.compose.files` MUST actually exist. Run `ls` to verify.
      21. **Multi-stack entries: no duplicate base files** — Do NOT repeat base `compose.yml` in every entry.
      22. **Package names: EXACT from manifests** — Use `[package] name` from Cargo.toml, module path from go.mod, `name` from package.json. NOT directory names.
      23. **Naming presets** — Tags: infra, api, worker, ui, data, monitoring, build.
          Plans: local-infra, local-dev, full-stack, observability, tools. Environments:
          dev, test, stg, prd. The exact inclusion/default matrix and injected platform
          binding rules live in `naming-presets.md`.
          Environment names label variable sets, not deployment targets — see rule 41.
      24. **No echo wrappers** — Never generate `echo 'Run: ...'` dummy commands.
      25. **No code changes** — Only modify `dva.yml` and related config. Do not touch app code or Dockerfiles.
      26. **Subprojects** — `exclude_tags: [infra]` to avoid parent infra duplication. Allowed fields: `path`, `exclude_tags`, `import`. Only add non-empty `import` entries after the child `dva.yml` exists; placeholders may omit `import` or use `import: {}`.
      27. **App declarations** — Model native app processes as native/process stack
          runners and select them from plans. Compose-hosted apps remain services of
          the compose stack entry.
      28. **Single lifecycle owner** — A Compose service MUST NOT also appear as
          `applications.*.run.docker.service`, a standalone docker runner, a raw
          `docker compose up` interaction, or a provision lifecycle step.
      29. **Runner meaning** — `compose` manages Compose services. `docker` manages a
          standalone `docker run` container. Merely being containerized does not
          justify generating both runners.
      30. **Plan dependencies** — Express cross-entry startup order with
          `plans.entries[].depends_on` and `order`.
      31. **Health ownership** — Compose healthchecks remain in Compose; native
          process readiness belongs to its stack runner/health configuration.
      32. **`stop` vs `down` semantics** — Validate both operations for the same
          named plan. `stop` preserves resources; `down` tears entries down in reverse dependency order.
      33. **Named lifecycle** — Use `dva up <plan>`/`down <plan>` for declarative
          lifecycle. `dva app` and `dva stack` were removed; `--mode` is migration-only.
      34. **No synthetic dual path** — Do not invent native and docker alternatives.
          Declare only execution paths proven by project files and developer workflow.
      35. **Environment switching** — Put dev/stg/prd variables in `environments:`
          and host/location differences in `sites:`; plans select both. Remote sites carry
          development or maintenance intent (rule 41).
      36. **Provision boundary** — Provision prepares files, dependencies, directories,
          or credentials. Lifecycle startup belongs to plans.
      37. **Interaction boundary** — Interactions are one-shot developer commands,
          not alternate lifecycle wrappers.
      38. **Compose command reuse** — Container exec interactions should use
          `service:` + `command:`. Avoid repeating declared Compose file/project flags.
      39. **Preserve migration** — In preserve mode, report legacy ownership overlap
          before migration; do not silently delete working commands.
      40. **Rewrite migration** — In rewrite mode, remove legacy applications/modes
          only after equivalent stack runners and plans exist.
      41. **Local-first scope** — Generated configuration serves local development and
          maintenance. Default every execution target to a local virtual environment, and
          declare a remote target only for a resource that cannot run locally (a shared
          database, a managed service). Never generate release, rollout, or incident-response
          workflows: DVA is not a production operations tool. Environment names follow
          `naming-presets.md` § Environment Presets.
      42. **Capability closure and safe default** — Every selected service must have one
          verified provider for each required capability. Never invent a provider or select
          two lifecycle owners. Prefer `default_plan: local-infra` only when it is local and
          non-destructive; never generate `full-stack` as the default. If no safe default is
          provable, omit `default_plan` and require `dva up <plan>`.
      43. **Platform bindings are input context** — Apply an injected `capability_bindings`
          preference only when its provider target and evidence are verified. Do not emit
          capability metadata as unsupported `dva.yml` keys, hardcode portfolio product names
          into generic defaults, or replace a working provider silently in preserve mode.
      <!-- AUTOGEN:dva_flow_guardrails:end -->

  # ══════════════════════════════════════════════
  # Phase 5: Re-validate and Re-execute
  # ══════════════════════════════════════════════
  - id: revalidate
    type: shell
    depends_on: [diagnose_and_fix]
    ignore_error: true
    action: |
      cd '{{param.target}}'
      echo "=== Post-fix validation ==="
      dva config validate 2>&1 || true

      echo ""
      echo "=== Post-fix dva up ==="
      dva up 2>&1 | tail -30 || true

      echo ""
      echo "=== Final status ==="
      dva status 2>&1 | tail -20 || true

  - id: print_summary
    type: llm
    depends_on: [revalidate]
    backend: fast
    instruction: |
      진단 결과를 요약하라.
      - 수정된 항목 (AUTO_FIX)
      - 사용자 확인 필요 항목 (USER_DECISION)
      - 범위 밖 항목 (OUT_OF_SCOPE)
      - 최종 dva up 성공 여부

      [REVALIDATE OUTPUT]
      {{revalidate.output}}
