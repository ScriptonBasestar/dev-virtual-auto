# yaml-language-server: $schema=../schemas/flow.schema.json
name: dva-improve-guided/10-verify
description: "Stage 10: Present discovered options and collect selection confirmation (USER GATE)"
contract:
  goal: "분석 결과를 사용자에게 제시하고 선택 방향을 확정한다"
  expected_results:
    - "발견된 옵션과 추천 조합이 markdown으로 제시된다"
    - "사용자가 선택 방향을 확인한다"
    - "확정된 계획이 저장된다"
  success_criteria:
    - "사용자가 승인/거부/수정 중 하나를 선택해야 한다"
    - "승인 없이 다음 stage로 진행하지 않는다"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

parameters:
  - name: target
    description: "Target directory"
    default: "."
  - name: approval_nonce
    description: "Parent-run nonce used to reject stale approval artifacts"
    default: ""

interactive:
  # auto_decide reviews the LLM output itself. confirm_before would ask before the
  # proposal exists and could not approve or reject the data consumed downstream.
  # Agent Mesh deliberately ignores interactive gates under explicit batch (-y);
  # for this guided flow, choosing -y is the caller's auto-approval of generated output.
  auto_decide: [present_proposal]

steps:
  # Same guard as `dva-improve.yaml`, which carries the full reasoning. Short version:
  # `file` and `read_file` resolve against the run directory and are path-sandboxed, while
  # `context`/`shell` follow `cd`. Run this stage from anywhere but the target and the two
  # disagree -- reports land in one directory while their `.gitignore` marker lands in the
  # other, and `read_file` cannot reach the stage report it needs. The parent pipeline
  # already assumes this: its hand-off gate tests a relative `tmp/improve-guided/` path.
  - id: check_run_dir
    type: context
    context:
      run_dir_ok: |
        RUN="$PWD"
        cd '{{param.target}}' || exit 1
        if [ "$PWD" = "$RUN" ]; then
          printf 'yes'
        else
          echo "ERROR: 10-verify must run with the target as the working directory." >&2
          echo "  run directory: $RUN" >&2
          echo "  target:        $PWD" >&2
          echo "" >&2
          echo "am resolves file/read_file paths against the run directory and refuses to" >&2
          echo "write outside it, so this stage's reports and the next stage's inputs would" >&2
          echo "end up in different directories." >&2
          echo "" >&2
          echo "Fix: cd '$PWD' && am run dva dva-improve-guided 10-verify" >&2
          exit 1
        fi

  - id: load_report
    type: read_file
    depends_on: [check_run_dir]
    src: "tmp/improve-guided/00-analysis-report.json"

  - id: check_dva_needed
    type: shell
    depends_on: [load_report]
    action: |
      REPORT="tmp/improve-guided/00-analysis-report.json"
      # Read the file, never an interpolated shell literal: the report is LLM-written and a
      # single apostrophe in it would break the command it was spliced into.
      # jq -e . accepts a *stream* of concatenated values, not one document: given
      # [1][2]{...} it exits 0, and a later jq -r prints a plausible value from the
      # trailing object while the array errors go to stderr. Require exactly one object.
      if ! jq -e -s 'length == 1 and (.[0] | type) == "object"' "$REPORT" >/dev/null 2>&1; then
        echo "ERROR: $REPORT is not a single JSON object — re-run stage 00." >&2
        exit 1
      fi
      # .dva_needed // true cannot express this gate: the jq // operator substitutes for
      # false as well as null, so an explicit false read back as true and this path was
      # unreachable for every possible input. Separate absent from present-and-false, and
      # treat absent as a stop — an undecidable gate must fail closed.
      if [ "$(jq -r 'has("dva_needed")' "$REPORT")" != "true" ]; then
        echo "ERROR: $REPORT has no dva_needed field — cannot decide whether to proceed." >&2
        exit 1
      fi
      # A non-zero exit for a legitimate no-action-needed verdict is deliberate, not a
      # bug to tidy up later. depends_on is ordering, not a condition, so exiting 0 here
      # would let present_proposal draft a plan for a project that was just found not to
      # need one. Stopping the stage is the only primitive that actually stops it — and
      # the reason is printed above, so the run is not silent about why.
      if [ "$(jq -r '.dva_needed' "$REPORT")" = "false" ]; then
        REASON=$(jq -r '.dva_not_needed_reason // "No reason given"' "$REPORT")
        echo "DVA is not needed for this project: $REASON"
        echo "Pipeline stopped."
        exit 1
      fi
      echo "DVA needed. Proceeding with proposal."

  - id: invalidate_previous_approval
    type: shell
    depends_on: [check_dva_needed]
    action: |
      # A rejected or failed review must not inherit approval from an earlier run.
      rm -f "tmp/improve-guided/10-proposal-approved.json"

  - id: present_proposal
    type: llm
    depends_on: [invalidate_previous_approval]
    json_mode: true
    instruction: |
      분석 리포트를 기반으로 사용자가 검토·승인할 구조화 변경 계획을 생성하라.
      Markdown이나 code fence 없이 정확히 하나의 JSON object만 반환하라.

      ## 포함 항목
      - Setup track (fresh/adopt/upgrade)
      - Development pattern (hybrid/container-first/devbox)
      - 발견된 앱/인프라/커맨드 옵션
      - 추천 기본 plan / environment 조합
      - 생성/수정할 파일 목록 (체크박스)
      - 서비스 그룹과 태그 매핑
      - 추천 named plans와 각 plan의 완전한 capability closure
      - native/Compose stack entry 계획
      - platform capability binding의 근거, 충돌, 미검증 항목
      - 리스크 평가

      ## 필수 JSON shape
      {
        "setup_track": "fresh|adopt|upgrade",
        "selected_plan": "실행할 정확한 named plan",
        "selected_environment": "선택한 environment 또는 빈 문자열",
        "selected_stack_entries": [],
        "capability_bindings": [],
        "rejected_options": [],
        "files": [],
        "risks": [],
        "summary_markdown": "사용자 검토용 요약"
      }

      selected_plan은 분석 리포트의 recommended_plans 중 실제 생성하기로 승인할
      정확한 이름이어야 한다. binding은 accepted/conflict/unverified 상태와 근거를
      보존하고, 거절되거나 미검증인 provider를 selected plan에 넣지 마라.

      [ANALYSIS REPORT]
      {{load_report.output}}

  # Rejection clears present_proposal.output. Convert that runtime behavior into an
  # explicit gate so save_approved cannot consume empty data.
  - id: proposal_handoff
    type: context
    depends_on: [present_proposal]
    context:
      reviewed: |
        printf '%s' '{{present_proposal.output | b64encode}}' | base64 -d
      accepted: |
        REVIEWED=$(printf '%s' '{{present_proposal.output | b64encode}}' | base64 -d)
        [ -n "$REVIEWED" ] && printf true || printf false

  # The reports below are run artifacts of this stage, written into whatever directory the
  # run was started from. Without this marker they show up as untracked files in that
  # project's `git status` after every guided run -- noise the user did not create and has
  # no way to attribute. The marker ignores the directory's contents and itself, so nothing
  # here reaches the index and the project's own .gitignore is never edited.
  #
  # `path` is relative on purpose: it resolves against the run directory, exactly like the
  # REPORT_DIR below and like `read_file`'s `src`. Anchoring it to `{{param.target}}` instead
  # would put the marker somewhere the reports are not.
  #
  # Snapshots of the config are a different lifetime and live in `backups/dva/`; `tmp/` is
  # for things that are safe to delete.
  - id: report_marker
    type: file
    file:
      op: write
      path: "tmp/improve-guided/.gitignore"
      content: "*\n"

  - id: save_approved
    type: shell
    depends_on: [proposal_handoff, report_marker]
    when: "{{proposal_handoff.accepted}} == 'true'"
    action: |
      REPORT_DIR="tmp/improve-guided"
      REPORT="$REPORT_DIR/10-proposal-approved.json"
      RAW="$REPORT_DIR/10-proposal-approved.raw"
      mkdir -p "$REPORT_DIR"
      # Encode before interpolation so reviewed text cannot become shell syntax.
      printf '%s' '{{proposal_handoff.reviewed | b64encode}}' | base64 -d > "$RAW"
      awk '
        { buf = buf $0 "\n" }
        END {
          i = index(buf, "{")
          if (i == 0) { exit 1 }
          j = 0
          for (k = length(buf); k >= 1; k--) {
            if (substr(buf, k, 1) == "}") { j = k; break }
          }
          if (j == 0) { exit 1 }
          printf "%s", substr(buf, i, j - i + 1)
        }
      ' "$RAW" > "$REPORT" || {
        echo "ERROR: the reviewed proposal contains no JSON object. Raw response kept at $RAW" >&2
        exit 1
      }
      if ! jq -e -s '
        length == 1 and
        (.[0] | type) == "object" and
        (.[0].setup_track | type) == "string" and
        (.[0].selected_plan | type) == "string" and
        (.[0].selected_plan | length) > 0
      ' "$REPORT" >/dev/null 2>&1; then
        echo "ERROR: reviewed proposal needs one object with setup_track and selected_plan. Raw response kept at $RAW" >&2
        exit 1
      fi
      NONCE=$(printf '%s' '{{param.approval_nonce | b64encode}}' | base64 -d)
      if [ -n "$NONCE" ]; then
        WITH_NONCE="$REPORT_DIR/10-proposal-approved.with-nonce.json"
        jq --arg nonce "$NONCE" '. + {approval_nonce: $nonce}' "$REPORT" > "$WITH_NONCE" || {
          echo "ERROR: cannot bind the approved proposal to this guided run." >&2
          exit 1
        }
        mv "$WITH_NONCE" "$REPORT"
      fi
      rm -f "$RAW"
      echo "Proposal approved and saved."
