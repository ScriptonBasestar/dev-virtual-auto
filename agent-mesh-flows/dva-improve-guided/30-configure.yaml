# yaml-language-server: $schema=../schemas/flow.schema.json
name: dva-improve-guided/30-configure
description: "Stage 30: Generate or improve dva.yml based on track (fresh/adopt/upgrade)"
contract:
  goal: "분석 리포트와 승인된 계획에 따라 dva.yml을 생성/개선한다"
  expected_results:
    - "dva.yml이 생성 또는 개선된다"
    - "모든 필수 섹션이 포함된다"
    - "dva config validate가 통과한다"
  success_criteria:
    - "shared-guardrails의 모든 규칙을 준수한다"
    - "setup_track에 따라 적절한 전략을 사용한다"
    - "기존 구조를 최대한 보존한다 (adopt/upgrade)"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_improver

parameters:
  - name: target
    description: "Target directory"
    default: "."
  - name: shared_dir
    description: "Absolute path to agent-mesh-flows/shared. Empty → $DVA_SHARED_DIR, then the run directory. Must also appear in am's allowed_roots_add."
    default: ""

steps:
  # ══════════════════════════════════════════════
  # Locate agent-mesh-flows/shared
  # ══════════════════════════════════════════════
  # `read_file` resolves `src` against the run directory and refuses to leave am's
  # approved roots, so a repo-relative path only reaches the library when the flow
  # happens to run from inside the dva repo — and these flows exist to be pointed at
  # other projects. The path is machine-specific, so it arrives by parameter or env
  # var and the search below takes the first candidate that actually holds the library.
  #
  # Two conditions must hold on the workstation, and only the first is testable here:
  #   1. the directory resolves — proven below by looking for shared-guardrails.md;
  #   2. it is listed under `allowed_roots_add:` in
  #      ~/.config/agent-mesh/sandbox_override.yaml — enforced by am inside read_file.
  # `when:` does not gate that second check (measured: the path check runs before the
  # condition), so a missing root surfaces as "escaped all approved roots" on the next
  # step. The message below names both requirements for that reason.
  #
  # Failing loudly is deliberate. `exit_if_empty` exits the pipeline *successfully*,
  # which would hand back a report produced with no guardrails at all — the exact
  # defect this resolver exists to close.
  # Same guard as `dva-improve.yaml`, which carries the full reasoning. Short version:
  # `file` and `read_file` resolve against the run directory and are path-sandboxed, while
  # `context`/`shell` follow `cd`. Run this stage from anywhere but the target and the two
  # disagree -- reports land in one directory while their `.gitignore` marker lands in the
  # other, and `read_file` cannot reach the stage report it needs. The parent pipeline
  # already assumes this: its hand-off gate tests a relative `tmp/improve-guided/` path.
  - id: check_run_dir
    type: context
    context:
      run_dir_ok: |
        RUN="$PWD"
        cd '{{param.target}}' || exit 1
        if [ "$PWD" = "$RUN" ]; then
          printf 'yes'
        else
          echo "ERROR: 30-configure must run with the target as the working directory." >&2
          echo "  run directory: $RUN" >&2
          echo "  target:        $PWD" >&2
          echo "" >&2
          echo "am resolves file/read_file paths against the run directory and refuses to" >&2
          echo "write outside it, so this stage's reports and the next stage's inputs would" >&2
          echo "end up in different directories." >&2
          echo "" >&2
          echo "Fix: cd '$PWD' && am run dva dva-improve-guided 30-configure" >&2
          exit 1
        fi

  - id: resolve_shared
    type: context
    depends_on: [check_run_dir]
    context:
      dir: |
        for cand in "{{param.shared_dir}}" "$DVA_SHARED_DIR" "$PWD/agent-mesh-flows/shared"; do
          [ -n "$cand" ] || continue
          [ -f "$cand/library/shared-guardrails.md" ] || continue
          printf '%s' "$cand"
          exit 0
        done
        echo "ERROR: agent-mesh-flows/shared not found." >&2
        echo "  Pass it explicitly:  -p shared_dir=<dva-repo>/agent-mesh-flows/shared" >&2
        echo "  or export DVA_SHARED_DIR to the same path." >&2
        echo "  The same path must also be listed under allowed_roots_add: in" >&2
        echo "  ~/.config/agent-mesh/sandbox_override.yaml — am's read_file cannot" >&2
        echo "  read outside an approved root." >&2
        exit 1

  - id: load_proposal
    type: read_file
    src: "tmp/improve-guided/10-proposal-approved.json"

  - id: load_guardrails
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/shared-guardrails.md"

  - id: load_schema
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/dva-schema.md"

  - id: load_naming
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/naming-presets.md"

  - id: load_examples
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/reference-examples.md"

  - id: load_checklist
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/shared-checklist.md"

  - id: detect_track
    type: context
    depends_on: [load_proposal]
    context:
      # Read the file rather than an interpolated shell literal, and do not default a
      # missing track: silently choosing `adopt` writes an upgrade-shaped config when the
      # real track was `fresh`, and nothing downstream re-derives it.
      track: |
        PROPOSAL="tmp/improve-guided/10-proposal-approved.json"
        # jq -e . accepts a *stream* of concatenated values, not one document: given
        # [1][2]{...} it exits 0, and a later jq -r prints a plausible value from the
        # trailing object while the array errors go to stderr. Require exactly one object.
        if ! jq -e -s 'length == 1 and (.[0] | type) == "object"' "$PROPOSAL" >/dev/null 2>&1; then
          echo "ERROR: $PROPOSAL is not a single JSON object — re-run stage 10." >&2
          exit 1
        fi
        track=$(jq -r '.setup_track // empty' "$PROPOSAL")
        case "$track" in
          fresh|adopt|upgrade) printf '%s' "$track" ;;
          *) echo "ERROR: setup_track is '$track' — expected fresh, adopt or upgrade." >&2
             exit 1 ;;
        esac
      # No dva_version here on purpose (TASK-135): this stage writes a real config, and the
      # running binary's version is not a legal value for `version:` — that field is the
      # minimum DVA the config requires of its reader, not a stamp of what produced it.

  # Snapshot the config before the agent edits it. This stage is the guided path's write
  # path, so it needs the same net as dva-improve.yaml, where the rationale is recorded:
  # git is the history, the snapshot covers only the uncommitted window, the backup directory
  # ignores its own contents so the target's .gitignore is never touched, and it sits in
  # `backups/dva/` rather than `tmp/` because a snapshot must outlive a `tmp/` cleanup.
  - id: backup_paths
    type: context
    context:
      has_config: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false
      marker: |
        printf '%s/backups/dva/.gitignore' '{{param.target}}'
      src: |
        cd '{{param.target}}'
        # Every filename is quoted -- am's shell policy analyzer reads an unquoted bare word
        # as a command name and blocks the step on "dva.yml not in allowlist".
        CONFIG=''
        if [ -f 'dva.yml' ]; then CONFIG='dva.yml'; elif [ -f 'dva.yaml' ]; then CONFIG='dva.yaml'; fi
        if [ -n "$CONFIG" ]; then printf '%s/%s' '{{param.target}}' "$CONFIG"; fi
      dest: |
        cd '{{param.target}}'
        CONFIG=''
        if [ -f 'dva.yml' ]; then CONFIG='dva.yml'; elif [ -f 'dva.yaml' ]; then CONFIG='dva.yaml'; fi
        if [ -n "$CONFIG" ]; then
          printf '%s/backups/dva/%s.%s.bak' '{{param.target}}' "$CONFIG" "$(date +%Y%m%d-%H%M%S)"
        fi

  # On the `fresh` track there is no prior config, so both steps skip together.
  - id: backup_marker
    type: file
    depends_on: [backup_paths]
    when: "{{backup_paths.has_config}} == 'true'"
    file:
      op: write
      path: "{{backup_paths.marker}}"
      content: "*\n"

  - id: backup_config
    type: file
    depends_on: [backup_marker]
    when: "{{backup_paths.has_config}} == 'true'"
    file:
      op: copy
      from: "{{backup_paths.src}}"
      to: "{{backup_paths.dest}}"

  - id: configure
    type: llm
    depends_on:
      - backup_config
      - load_proposal
      - load_guardrails
      - load_schema
      - load_naming
      - load_examples
      - load_checklist
      - detect_track
    agent: claude
    instruction: |
      # Stage 30: Configure DVA

      승인된 선택 계획에 따라 dva.yml을 생성/개선하라.

      ## Setup Track: {{detect_track.track | trim}}
      - **fresh**: compose.yml + dva.yml 모두 신규 생성
      - **adopt**: 기존 compose 기반으로 dva.yml만 생성
      - **upgrade**: 기존 dva.yml을 개선

      ## DVA Version
      `version` 필드에 실행 중인 DVA 버전을 **쓰지 마라**. 이 필드는 설정이 *읽는 쪽*에
      요구하는 최소 DVA 버전(reader floor)이지, 이 설정을 만든 바이너리의 버전이 아니다.
      실행 중인 버전을 적으면 그 설정은 더 낮은 DVA에서 전부 로드에 실패한다.

      기존 값이 있으면 그대로 두고, 없으면 필드를 생략하라. `version`은 optional이며 생략은
      "읽는 쪽에 아무것도 요구하지 않는다"는 뜻이다 — fresh track에서 새로 만드는 경우에도
      마찬가지다.

      ## Guardrails
      {{load_guardrails.output}}

      ## Schema Reference
      {{load_schema.output}}

      ## Naming Presets
      {{load_naming.output}}

      ## Reference Examples
      {{load_examples.output}}

      ## Approved Proposal
      {{load_proposal.output}}

      ## Instructions

      ### adopt/upgrade track:
      1. 기존 dva.yml 로드 (있으면)
      2. 안티패턴 변환 (echo 래퍼 → 실제 명령, 프리픽스 커맨드 → replace 훅)
      3. 누락 필수 섹션 추가
      4. 사용자에게 제시된 후보 중 선택된 applications 섹션 생성
      5. interaction 매핑 (Makefile/package.json → dva commands)
      6. endpoints 완비

      ### fresh track:
      1. compose.yml 생성 (인프라 서비스)
      2. dva.yml 신규 생성 (전체 구조)
      3. 위 adopt 규칙 동일 적용

      ## Post-configure
      1. `dva config validate` 실행 → ERROR 0까지 수정
      2. 결과를 `tmp/improve-guided/30-configure-report.txt`에 저장

      ## Self-Review Checklist
      {{load_checklist.output}}

  # Same marker as the other stages, for the same reason: without it the report below shows
  # up as an untracked file in the project's `git status` after every run.
  #
  # Relative, like the markers in stages 00/10/20/40 -- not anchored to `{{param.target}}`,
  # which was tried and refused: `type: file` is path-sandboxed and rejects a write outside
  # the run root with "escaped all approved roots". Shell steps are not sandboxed, which is
  # why the report below can be written into the target at all.
  #
  # That asymmetry leaves a residual gap. `validate` runs after `cd '{{param.target}}'`, so
  # its report follows the target while every other stage's follows the run directory. When
  # the two are the same -- the supported way to run this pipeline, and what every relative
  # `read_file` src here already assumes -- this marker covers the report. When they differ,
  # nothing declarative can reach the target. TASK-190 covers closing that.
  - id: report_marker
    type: file
    depends_on: [configure]
    file:
      op: write
      path: "tmp/improve-guided/.gitignore"
      content: "*\n"

  - id: validate
    type: shell
    depends_on: [configure, report_marker]
    action: |
      cd '{{param.target}}'
      echo "=== dva config validate ==="
      RESULT=$(dva config validate 2>&1) || true
      echo "$RESULT"

      REPORT_DIR="tmp/improve-guided"
      mkdir -p "$REPORT_DIR"
      echo "$RESULT" > "$REPORT_DIR/30-configure-report.txt"

      if echo "$RESULT" | grep -q "dva.yml is valid"; then
        echo "VALIDATION: PASS"
      else
        echo "VALIDATION: WARN — review configure-report.txt"
      fi
