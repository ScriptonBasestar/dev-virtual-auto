# yaml-language-server: $schema=../schemas/flow.schema.json
name: dva-improve-guided/30-configure
description: "Stage 30: Generate or improve dva.yml based on track (fresh/adopt/upgrade)"
contract:
  goal: "분석 리포트와 승인된 계획에 따라 dva.yml을 생성/개선한다"
  expected_results:
    - "dva.yml이 생성 또는 개선된다"
    - "모든 필수 섹션이 포함된다"
    - "dva config validate가 통과한다"
  success_criteria:
    - "shared-guardrails의 모든 규칙을 준수한다"
    - "setup_track에 따라 적절한 전략을 사용한다"
    - "기존 구조를 최대한 보존한다 (adopt/upgrade)"
pipeline_role: worker
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_improver

parameters:
  - name: target
    description: "Target directory"
    default: "."

steps:
  - id: load_proposal
    type: read_file
    src: "tmp/improve-guided/10-proposal-approved.json"

  - id: load_guardrails
    type: read_file
    src: "agent-mesh-flows/shared/library/shared-guardrails.md"

  - id: load_schema
    type: read_file
    src: "agent-mesh-flows/shared/library/dva-schema.md"

  - id: load_naming
    type: read_file
    src: "agent-mesh-flows/shared/library/naming-presets.md"

  - id: load_examples
    type: read_file
    src: "agent-mesh-flows/shared/library/reference-examples.md"

  - id: load_checklist
    type: read_file
    src: "agent-mesh-flows/shared/library/shared-checklist.md"

  - id: detect_track
    type: context
    depends_on: [load_proposal]
    context:
      track: "echo '{{load_proposal.output}}' | jq -r '.setup_track // \"adopt\"' 2>/dev/null || echo 'adopt'"
      # No dva_version here on purpose (TASK-135): this stage writes a real config, and the
      # running binary's version is not a legal value for `version:` — that field is the
      # minimum DVA the config requires of its reader, not a stamp of what produced it.

  - id: configure
    type: llm
    depends_on:
      - load_proposal
      - load_guardrails
      - load_schema
      - load_naming
      - load_examples
      - load_checklist
      - detect_track
    agent: claude
    instruction: |
      # Stage 30: Configure DVA

      승인된 선택 계획에 따라 dva.yml을 생성/개선하라.

      ## Setup Track: {{detect_track.track | trim}}
      - **fresh**: compose.yml + dva.yml 모두 신규 생성
      - **adopt**: 기존 compose 기반으로 dva.yml만 생성
      - **upgrade**: 기존 dva.yml을 개선

      ## DVA Version
      `version` 필드에 실행 중인 DVA 버전을 **쓰지 마라**. 이 필드는 설정이 *읽는 쪽*에
      요구하는 최소 DVA 버전(reader floor)이지, 이 설정을 만든 바이너리의 버전이 아니다.
      실행 중인 버전을 적으면 그 설정은 더 낮은 DVA에서 전부 로드에 실패한다.

      기존 값이 있으면 그대로 두고, 없으면 필드를 생략하라. `version`은 optional이며 생략은
      "읽는 쪽에 아무것도 요구하지 않는다"는 뜻이다 — fresh track에서 새로 만드는 경우에도
      마찬가지다.

      ## Guardrails
      {{load_guardrails.output}}

      ## Schema Reference
      {{load_schema.output}}

      ## Naming Presets
      {{load_naming.output}}

      ## Reference Examples
      {{load_examples.output}}

      ## Approved Proposal
      {{load_proposal.output}}

      ## Instructions

      ### adopt/upgrade track:
      1. 기존 dva.yml 로드 (있으면)
      2. 안티패턴 변환 (echo 래퍼 → 실제 명령, 프리픽스 커맨드 → replace 훅)
      3. 누락 필수 섹션 추가
      4. 사용자에게 제시된 후보 중 선택된 applications 섹션 생성
      5. interaction 매핑 (Makefile/package.json → dva commands)
      6. endpoints 완비

      ### fresh track:
      1. compose.yml 생성 (인프라 서비스)
      2. dva.yml 신규 생성 (전체 구조)
      3. 위 adopt 규칙 동일 적용

      ## Post-configure
      1. `dva config validate` 실행 → ERROR 0까지 수정
      2. 결과를 `tmp/improve-guided/30-configure-report.txt`에 저장

      ## Self-Review Checklist
      {{load_checklist.output}}

  - id: validate
    type: shell
    depends_on: [configure]
    action: |
      cd '{{param.target}}'
      echo "=== dva config validate ==="
      RESULT=$(dva config validate 2>&1) || true
      echo "$RESULT"

      REPORT_DIR="tmp/improve-guided"
      mkdir -p "$REPORT_DIR"
      echo "$RESULT" > "$REPORT_DIR/30-configure-report.txt"

      if echo "$RESULT" | grep -q "dva.yml is valid"; then
        echo "VALIDATION: PASS"
      else
        echo "VALIDATION: WARN — review configure-report.txt"
      fi
