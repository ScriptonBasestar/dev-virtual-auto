# yaml-language-server: $schema=../schemas/flow.schema.json
name: dva-improve-guided/00-analyze
description: "Stage 00: Scan target project and enumerate candidate DVA options"
contract:
  goal: "프로젝트 구조를 분석하여 선택 가능한 DVA 옵션을 수집한다"
  expected_results:
    - "DVA 필요 여부가 판단된다"
    - "setup_track(fresh/adopt/upgrade)이 분류된다"
    - "분석 리포트가 JSON으로 저장된다"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "분석은 compose(ops/ 포함), Dockerfile, .gz-git.yaml, 빌드 도구, 패키지 매니페스트에 근거한다"
pipeline_role: analyzer
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_analyzer

parameters:
  - name: target
    description: "Target directory to scan"
    default: "."
  - name: capability_bindings
    description: "JSON array of portfolio/provider bindings with capability, provider, consumer, ownership, and evidence"
    default: "[]"
  - name: apply_mode
    description: "propose or force DVA-owned command migration. Not dva up --force."
    default: "propose"
    enum: [propose, force]
  - name: legacy_surface
    description: "Keep old Make/npm/compose entrypoints as dva aliases, or remove them"
    default: "alias"
    enum: [alias, remove]

steps:
  # Same guard as `dva-improve.yaml`, which carries the full reasoning. Short version:
  # `file` and `read_file` resolve against the run directory and are path-sandboxed, while
  # `context`/`shell` follow `cd`. Run this stage from anywhere but the target and the two
  # disagree -- reports land in one directory while their `.gitignore` marker lands in the
  # other, and `read_file` cannot reach the stage report it needs. The parent pipeline
  # already assumes this: its hand-off gate tests a relative `tmp/improve-guided/` path.
  - id: check_run_dir
    type: context
    context:
      run_dir_ok: |
        RUN="$PWD"
        cd '{{param.target}}' || exit 1
        if [ "$PWD" = "$RUN" ]; then
          printf 'yes'
        else
          echo "ERROR: 00-analyze must run with the target as the working directory." >&2
          echo "  run directory: $RUN" >&2
          echo "  target:        $PWD" >&2
          echo "" >&2
          echo "am resolves file/read_file paths against the run directory and refuses to" >&2
          echo "write outside it, so this stage's reports and the next stage's inputs would" >&2
          echo "end up in different directories." >&2
          echo "" >&2
          echo "Fix: cd '$PWD' && am run dva dva-improve-guided 00-analyze" >&2
          exit 1
        fi

  - id: check_dva
    type: context
    depends_on: [check_run_dir]
    context:
      # A missing prerequisite is a stop, not a finish. `exit_if_empty` ends the pipeline
      # *successfully* (flow.schema.json), so an absent CLI produced a clean run that did
      # nothing — indistinguishable from a run that had nothing to do. Exit non-zero here
      # instead and let the step failure carry the reason.
      dva_available: |
        if ! command -v dva >/dev/null 2>&1; then
          echo "ERROR: dva is not on PATH. Install it, then re-run." >&2
          exit 1
        fi
        printf 'yes'
      # `dva version` has no --short flag; parse the --json contract instead. Stage 00 only
      # reports the value, but stage 30 hands it to an LLM that writes `version:`, so all
      # stages resolve it the same way.
      dva_version: "dva version --json 2>/dev/null | jq -r '.version // \"unknown\"' 2>/dev/null || echo 'unknown'"
      docker_available: "command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1 && echo 'yes' || echo 'no'"

  - id: detect_basics
    type: context
    depends_on: [check_dva]
    context:
      has_dva_yml: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false
      has_compose: |
        cd '{{param.target}}' && ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml ops/*/compose.yml ops/*/compose.yaml 2>/dev/null >/dev/null && printf true || printf false
      has_dockerfile: |
        cd '{{param.target}}' && ls Dockerfile Dockerfile.* */Dockerfile 2>/dev/null >/dev/null && printf true || printf false
      has_makefile: "[ -f '{{param.target}}/Makefile' ] && printf true || printf false"
      build_tools: |
        cd '{{param.target}}'
        found=""
        for f in Makefile package.json pyproject.toml go.mod Cargo.toml Gemfile build.gradle pom.xml; do
          [ -f "$f" ] && found="$found $f"
        done
        echo "${found:-None}"

  # No `when:` here on purpose. The gate it used to carry (`has_dva_yml == true`, filtered
  # and unquoted) never held, so these commands have always run unconditionally -- and they
  # are written to survive that: each falls back to an empty document when there is no
  # dva.yml. Repairing the gate would be worse than deleting it, because `analyze` below is
  # ungated and interpolates these keys, and a skipped step's key renders as the literal
  # `{{dva_cli_data.dva_show}}` text straight into the prompt. The fallbacks are the
  # condition, expressed where it cannot fail open.
  - id: dva_cli_data
    type: context
    depends_on: [detect_basics]
    context:
      dva_show: "cd '{{param.target}}' && dva show --json 2>/dev/null || echo '{}'"
      dva_doctor: "cd '{{param.target}}' && dva doctor --json 2>/dev/null || echo '{\"checks\":[]}'"
      dva_manifest: "cd '{{param.target}}' && dva manifest -f json 2>/dev/null || echo '{}'"
      dva_validate: "cd '{{param.target}}' && dva config validate --strict 2>&1 || true"
      dva_config: "cd '{{param.target}}' && dva config show -f yaml 2>/dev/null | head -300 || echo ''"

  - id: scan_project
    type: context
    depends_on: [detect_basics]
    context:
      compose_files: |
        cd '{{param.target}}'
        ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml \
           compose.*.yaml compose.*.yml docker-compose.*.yml docker-compose.*.yaml \
           infra/compose*.y*ml docker/compose*.y*ml compose/compose*.y*ml \
           ops/*/compose.yml ops/*/compose.yaml 2>/dev/null || echo 'none'
      compose_services: |
        cd '{{param.target}}'
        # Emit the keys of each top-level block separately. A flat indent grep conflates
        # services with networks/volumes, so a network reads as an undeclared service
        # (measured: the backend network of cwrapper-devbox reported as a missing service).
        for f in $(ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null); do
          echo "=== $f ==="
          # One awk pass per file rather than a shell function: the am allowlist knows
          # commands, not a function the step just defined, so calling one blocks the
          # step -- and a blocked step does not stop the run, it just produces nothing.
          awk '
            BEGIN { split("services networks volumes", want, " ") }
            /^[^[:space:]#]/ {
              cur = ""
              for (i = 1; i <= 3; i++) if ($0 ~ "^" want[i] ":[[:space:]]*(#.*)?$") { cur = want[i]; base = 0 }
              next
            }
            cur != "" && match($0, /^[[:space:]]+/) {
              ind = RLENGTH; rest = substr($0, ind + 1)
              if (rest ~ /^#/) next
              if (rest ~ /^[A-Za-z0-9_.-]+:/) {
                if (base == 0) base = ind
                if (ind == base) { sub(/:.*/, "", rest); keys[cur] = keys[cur] rest " " }
              }
            }
            END { for (i = 1; i <= 3; i++) printf "  %-9s %s\n", want[i] ":", keys[want[i]] }
          ' "$f"
        done
      existing_dva: "cat {{param.target}}/dva.yml 2>/dev/null || cat {{param.target}}/dva.yaml 2>/dev/null || echo ''"
      makefile_targets: |
        cd '{{param.target}}'
        [ -f 'Makefile' ] && grep -E '^[a-zA-Z_-]+:.*##' Makefile 2>/dev/null | head -40 || echo 'no Makefile'
      package_json_scripts: |
        cd '{{param.target}}'
        if [ ! -f 'package.json' ]; then echo "None"; exit 0; fi
        if command -v jq >/dev/null 2>&1; then
          scripts=$(jq -r '.scripts // {} | to_entries[] | "  \(.key): \(.value)"' package.json 2>/dev/null)
          [ -n "$scripts" ] && echo "package.json scripts:" && echo "$scripts" || echo "package.json has no scripts"
        else
          echo "package.json scripts (raw):"
          grep -A 50 '"scripts"' package.json 2>/dev/null | grep -E '^\s+"[^"]+":' | head -30
        fi
      env_files: "ls {{param.target}}/.env {{param.target}}/.env.example {{param.target}}/.env.* 2>/dev/null || echo 'none'"
      port_mappings: |
        cd '{{param.target}}'
        for f in $(ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null); do
          grep -E 'ports:' -A 10 "$f" 2>/dev/null | grep -E '"[0-9]+:[0-9]+"' | head -20
        done
      gz_git: |
        cd '{{param.target}}'
        if [ -f '.gz-git.yaml' ]; then
          echo "=== .gz-git.yaml ==="
          cat '.gz-git.yaml'
        else
          echo "None"
        fi
      subprojects: |
        cd '{{param.target}}'
        for d in */; do
          [ -d "$d" ] || continue
          base=$(basename "$d")
          case "$base" in
            node_modules|vendor|.git|.idea|.vscode|tmp|build|dist|target|compose|docker|infra|infrastructure|scripts|docs|monitoring|k8s|data|specs|reports|agent-mesh-flows) continue ;;
          esac
          markers=""
          [ -f "$d/package.json" ] && markers="$markers package.json"
          [ -f "$d/go.mod" ] && markers="$markers go.mod"
          [ -f "$d/pyproject.toml" ] && markers="$markers pyproject.toml"
          [ -f "$d/Cargo.toml" ] && markers="$markers Cargo.toml"
          [ -n "$markers" ] && echo "$base:$markers"
        done
        # A detection snippet reports absence as data. Without this the exit status of
        # the loop is whatever the last guard returned, so a final directory carrying no
        # marker fails the step and takes the whole discovery run down with it.
        exit 0
      workspace_map: |
        cd '{{param.target}}'
        if [ -f 'pnpm-workspace.yaml' ]; then
          echo "=== pnpm-workspace.yaml ==="; cat pnpm-workspace.yaml
        elif [ -f 'pnpm-workspace.yml' ]; then
          echo "=== pnpm-workspace.yml ==="; cat pnpm-workspace.yml
        fi
        if [ -f 'package.json' ]; then
          ws=$(grep -A 20 '"workspaces"' package.json 2>/dev/null | head -20)
          [ -n "$ws" ] && echo "=== package.json workspaces ===$ws"
        fi
        if [ -f 'Cargo.toml' ]; then
          members=$(awk '/^\[workspace\]/,/^\[/' Cargo.toml 2>/dev/null | grep 'members' -A 20 | head -20)
          [ -n "$members" ] && echo "=== Cargo.toml [workspace.members] ==="
          [ -n "$members" ] && echo "$members"
        fi
        if [ -f 'go.work' ]; then
          echo "=== go.work ==="; cat go.work
        fi
        [ ! -f 'pnpm-workspace.yaml' ] && [ ! -f 'pnpm-workspace.yml' ] && \
        [ ! -f 'Cargo.toml' ] && [ ! -f 'go.work' ] && echo "None"
        exit 0
      k8s_manifests: |
        cd '{{param.target}}'
        # Detect Kubernetes manifests in common directories
        found=$(find . \( -path '*/node_modules' -o -path '*/.git' -o -path '*/vendor' \) -prune -o \
          \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null | \
          xargs grep -l '^kind:' 2>/dev/null | head -20)
        if [ -n "$found" ]; then
          echo "K8s manifest files:"
          echo "$found"
          # Summarize kinds
          echo "\nKinds detected:"
          echo "$found" | xargs grep -h '^kind:' 2>/dev/null | sort | uniq -c | sort -rn | head -15
        else
          echo "None"
        fi
      helm_charts: |
        cd '{{param.target}}'
        # Detect Helm Chart.yaml files
        charts=$(find . \( -path '*/node_modules' -o -path '*/.git' \) -prune -o -name 'Chart.yaml' -print 2>/dev/null | head -10)
        if [ -n "$charts" ]; then
          echo "Helm charts found:"
          for c in $charts; do
            dir=$(dirname "$c")
            name=$(grep '^name:' "$c" 2>/dev/null | head -1)
            version=$(grep '^version:' "$c" 2>/dev/null | head -1)
            echo "  $dir — $name $version"
          done
        else
          echo "None"
        fi
      package_names: |
        cd '{{param.target}}'
        # Go
        [ -f 'go.mod' ] && echo "go: $(head -1 go.mod | sed 's/module //')"
        # Rust
        [ -f 'Cargo.toml' ] && grep -A2 '^\[package\]' Cargo.toml 2>/dev/null | grep 'name' | head -1 | sed 's/.*= *"\(.*\)"/rust: \1/'
        # Node
        [ -f 'package.json' ] && echo "node: $(grep '"name"' package.json 2>/dev/null | head -1 | sed 's/.*: *"\(.*\)".*/\1/')"
        # Python
        [ -f 'pyproject.toml' ] && grep -A2 '^\[project\]' pyproject.toml 2>/dev/null | grep 'name' | head -1 | sed 's/.*= *"\(.*\)"/python: \1/'
        # Same reason as subprojects: the last guard decides the exit status, so a
        # project without pyproject.toml would read as a failed scan.
        exit 0
      dir_tree: "find {{param.target}} -maxdepth 3 -not -path '*/\\.*' -not -path '*/vendor/*' -not -path '*/node_modules/*' -not -path '*/target/*' 2>/dev/null | head -80"

  - id: analyze
    type: llm
    depends_on: [detect_basics, dva_cli_data, scan_project]
    json_mode: true
    instruction: |
      프로젝트를 분석하여 DVA 설정 계획과 선택 가능한 옵션을 JSON으로 생성하라.

      후보는 아래 라이브러리 규칙 안에서만 제안한다. 규칙과 충돌하는 후보는 리포트에
      넣지 않는다 — 이 리포트에서 승인된 후보는 stage 20과 stage 30이 다시 도출하지
      않고 소비하므로 여기서 통과한 것은 그대로 반영된다.

      apply_mode={{param.apply_mode}} legacy_surface={{param.legacy_surface}}

      ## Devbox apply
      <!-- AUTOGEN:dva_flow_devbox_apply:start -->
      # Devbox Apply Policy

      Canonical rules for applying DVA across a workspace. Skills, diagnosis, plan
      templates, and `am run dva-improve*` consume this file. Do not copy the lists
      below into other documents.

      Parameters (flows: `apply_mode`, `legacy_surface`):

      | Parameter | Values | Default |
      |-----------|--------|---------|
      | `apply_mode` | `propose` — emit a table, do not mutate until accepted; `force` — apply in this run | `propose` |
      | `legacy_surface` | `alias` — keep the old name as a one-line handoff to DVA; `remove` — delete it | `alias` |

      `apply_mode=force` is not the CLI flag `dva up --force`.

      ## A. Command migration

      DVA owns every workflow it can express: named-plan lifecycle (`up`/`down`/`stop`/`restart`/`logs`/`build`),
      `interaction`, `provision`, and `doctor` checks.

      1. Inventory Make targets, package scripts, `ops/**` helpers, and raw
         `docker compose`/`skaffold` entrypoints.
      2. If DVA can own the work, the implementation moves into `dva.yml`. Wrapping
         the old command (`command: make check`, `run: docker compose up`) is not
         migration.
      3. Alias direction is old → DVA (`make api-check` → `dva api-check`). Never
         `dva` → `make` for a DVA-owned action, and never `run: dva …` from provision
         or Make.
      4. `propose`: print a table (old command, DVA name, alias or delete, reason).
         Do not edit until the user accepts, unless `apply_mode=force`.
      5. `alias`: leave a one-line Make/npm script that calls DVA. `remove`: delete
         the old entrypoint and point docs at `dva ls`.
      6. Leave a raw command only when DVA cannot express it; record why
         (`suggestion_ignore` or the apply table).
      7. Advertised commands in README, CLAUDE.md, and tasks must match `dva ls` /
         `dva show`.

      ## B. `.gz-git.yaml` children

      When `.gz-git.yaml` exists, every **locally present** `workspaces:` entry with a
      dev/app surface (Makefile, package scripts, Compose, language manifest plus a
      run/test/build command) **must** be connected to DVA.

      1. Child owns `dva.yml` in its repository (interactions/provision and, when it
         runs a long process, a `native` stack entry). Root does not commit child files.
      2. Root declares `subprojects.<name>.path`. Do not declare a subproject whose
         child `dva.yml` is missing.
      3. Root `import.plans` / `import.interactions` / `import.provision` only for
         names that should appear in the root `dva ls`. Omitting import hides the
         name from the root listing; it does not skip connecting the child.
      4. Same-repo nested configs (`prototype/dva.yml`) are also `subprojects`. Do
         not leave a second config that `dva` discovers only by changing cwd.
      5. Missing children: report unavailable; do not clone without authority. Do not
         skip a present child because of its name.
      6. Exclude only when `.gz-git.yaml`, nearest repo guidance, or a
         generated/vendor/archive path says so.
      7. A present child with **no** executable surface: record that assessment; do
         not invent an empty ceremonial `dva.yml`.

      Root-only work is allowed only when the user forbids child-repository edits;
      then list deferred inventory entries and call the result partial coverage.

      ## C. Infra and app plans

      1. Collect capabilities from Compose (including `ops/**/compose.y*ml`),
         README/Makefile, ADR, and app env: database, cache, object-storage,
         identity, queue.
      2. If the app needs a named store (for example RustFS), that provider is a
         stack entry plus an infra plan. Do not substitute a template postgres/redis
         for a different product.
      3. App-dependent DB and middleware live on a plan **separate from apps**.
         Default names: `local-infra` (verified providers), `local-dev` (`local-infra`
         plus native apps). Split further when lifecycles differ (`design` is not
         `rustfs`).
      4. Design-only Compose (Penpot) is `tools`/`design`, not product infra.
      5. Native apps are child `native` runners selected by imported root plans.
         Host ports use a project range; common defaults (8080, 3000, 5432, 6379)
         are a finding, not a silent keep.
      6. One lifecycle owner per Compose service. Plans repeat their full closure;
         they do not inherit.

      ## D. Compose default

      1. Scan root compose files, `compose/`, `infra/`, `docker/`, `infrastructure/`,
         and `ops/*/compose.y*ml`. Skaffold/k8s evidence selects those runners; it
         does not replace local Compose when the app runs locally.
      2. If local infra is required and no Compose (and no verified skaffold/k8s
         local path) exists, **create modular Compose**:
         - `compose/infra-<capability>.yaml` (and `compose/app-*.yaml` only for
           compose-hosted apps)
         - root `compose.yaml` with `include:`
         - one DVA stack compose runner pointing at that root file
         - top-level `name:` matching `project_name`; healthchecks; loopback publish
      3. If `ops/<name>/compose.yml` already exists, adopt it; do not duplicate.
         Make/`docker compose` lifecycle becomes an alias or is removed (section A).
      4. Generate only services the evidence names. Do not add a stock postgres
         because a template shows one.
      5. Do not generate skaffold unless the repo already has a skaffold/k8s local
         workflow.
      <!-- AUTOGEN:dva_flow_devbox_apply:end -->

      ## 라이브러리 규칙 — 가드레일
      <!-- AUTOGEN:dva_flow_guardrails:start -->
      # DVA Configuration Guardrails (Shared)

      > Single source of truth for dva.yml generation/improvement rules.
      > Referenced by: improve prompt (auto mode), guided improve pipeline (interactive mode).

      > **Auto-generated sections** — rule 4 (`version:`), rule 9 (reserved commands) and rule 14
      > (section order) are regenerated from `internal/config` by `make generate` (tools/libgen) and
      > bounded by `<!-- AUTOGEN:... -->` markers. Edit the Go source, not the marker block. Other
      > rules are hand-authored. See `shared/library/README.md` for the ownership boundary.

      ## Critical Rules

      1. **`stack:` section required** — Compose config MUST be under `stack.<entry>.runners.compose`. Migrate legacy root-level `compose:` and `stack.<entry>.compose` fields to `runners.compose`.
      2. **`plans:` current model** — New/rewrite configs MUST use named `plans:`.
         Preserve legacy `modes:` only until an explicit migration; never generate new
         modes/applications merely to satisfy an old example.
      3. **Plan scope** — Derive self-contained plans from the capability closure in
         `naming-presets.md`. Provide only plans backed by evidence. Service selection
         belongs in `plans.*.entries[].services`; plans do not inherit or overlay each other.
      4. **`version:` field** — Optional, and it is a **minimum required reader version**, not the
         version of the binary that generated the config. Canonical source:
         `internal/config/version.go` — the block below is regenerated by `make generate`
         (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:version_rule:start -->
         Omit `version:` for no compatibility gate. When declaring it, use `0.1.44` — the floor `dva init` writes. Never scaffold the running CLI version: that makes every generated config refuse to load on an older DVA, ratcheting the floor up on each release. Subproject `version:` is checked against the running DVA independently; DVA never compares a subproject's version to root, so do not require them to agree.
         <!-- AUTOGEN:version_rule:end -->
      5. **`health_checks`: `start` and/or `start_hint`** — `start` is the auto-start command (optional). `start_hint` is human-readable hint text shown by `dva status` (optional). If `start` is set, `start_hint` is only needed when it differs from the start command. Do not set both to identical values (validation warning).
      6. **Health check URLs: literal values only** — `url:` and `address:` fields must use literal values (e.g., `http://localhost:14000/health`), NOT `${VAR:-DEFAULT}` patterns.
      7. **Port conventions** — Never use common default ports as host ports: 2181, 3000, 3306, 5432, 6379, 8080, 8443, 9090, 9092, 9200, 15672, 27017. Pick a project-specific range instead (e.g. 11100-11199).
      8. **`runner: local` for host commands** — Build/test/lint/fmt/check MUST use `runner: local`. Never use `echo 'Run: ...'` wrappers.
      9. **Reserved commands** — DVA built-in commands that MUST NOT appear as plain interaction
         keys. Hookable ones use `replace:` hooks; others must be renamed (e.g., `service-status`,
         `db-migrate`). Canonical source: `internal/config/reserved.go` — the block below is
         regenerated by `make generate` (tools/libgen); do not edit it by hand.

         <!-- AUTOGEN:reserved_commands:start -->
         Reserved (25, must not be interaction keys): `agent-deny`, `build`, `completion`, `compose`, `config`, `console`, `doctor`, `down`, `help`, `init`, `ktl`, `logs`, `ls`, `manifest`, `provision`, `restart`, `run`, `show`, `skill`, `ssh`, `status`, `stop`, `up`, `validate`, `version`
         Hookable (use `replace:` hooks, 6): `build`, `down`, `logs`, `restart`, `stop`, `up`
         <!-- AUTOGEN:reserved_commands:end -->
      10. **Provision: setup only** — NEVER call `run: "dva <command>"` (circular
          dependency), and do not duplicate plan up/down actions with raw lifecycle commands.
      11. **Provision evidence** — Generate only profiles backed by actual setup work;
          never invent `default`, `full`, or `reset` profiles to satisfy a template.
      12. **`env_file:` object format** — Prefer `{ files: [...] }` (optional `required:`); plain string path is also valid.
      13. **Built-in checks first** — Do not generate custom Docker socket, Compose
          file, or env-file checks already emitted by `dva doctor`. Add `checks:` only
          for project-specific prerequisites.
      14. **Section order (canonical)** — Canonical source:
          `internal/config/validate_warnings.go` — the order below is regenerated by
          `make generate` (tools/libgen). Legacy keys (`checks` … `modes`) retain a
          deterministic position during migration only; do not generate them for new configs.

          <!-- AUTOGEN:section_order:start -->
          `version` → `vars` → `environment` → `env_file` → `stack` → `plans` → `default_plan` → `environments` → `sites` → `checks` → `default_mode` → `suggestion_ignore` → `modes` → `health_checks` → `interaction` → `provision` → `modules` → `subprojects` → `endpoints` → `infra` → `ssh` → `devcontainer`
          <!-- AUTOGEN:section_order:end -->
      15. **File header** — First line must be `# yaml-language-server: $schema=...` schema comment.
      16. **`stack.<entry>.runners.compose.tags: [infra]`** — Primary compose runner MUST have compose-level `tags:` field.
      17. **Service metadata: tags required** — Every service MUST have `tags:`. Port metadata (label, http, paths) belongs in `endpoints:` section, NOT in `services.ports`.
      18. **Compose `name:` required** — compose.yml must have top-level `name:` matching `stack.<entry>.runners.compose.project_name`.
      19. **Compose `version:` key** — Remove if present (Compose Specification does not require it).
      20. **Stack files: verify existence** — Every file listed in `stack.{entry}.runners.compose.files` MUST actually exist. Run `ls` to verify.
      21. **Multi-stack entries: no duplicate base files** — Do NOT repeat base `compose.yml` in every entry.
      22. **Package names: EXACT from manifests** — Use `[package] name` from Cargo.toml, module path from go.mod, `name` from package.json. NOT directory names.
      23. **Naming presets** — Tags: infra, api, worker, ui, data, monitoring, build.
          Plans: local-infra, local-dev, full-stack, observability, tools. Environments:
          dev, test, stg, prd. The exact inclusion/default matrix and injected platform
          binding rules live in `naming-presets.md`.
          Environment names label variable sets, not deployment targets — see rule 41.
      24. **No echo wrappers** — Never generate `echo 'Run: ...'` dummy commands.
      25. **No code changes** — Only modify `dva.yml` and related config. Do not touch app code or Dockerfiles.
      26. **Subprojects** — `exclude_tags: [infra]` to avoid parent infra duplication. Allowed fields: `path`, `exclude_tags`, `import`. Only add non-empty `import` entries after the child `dva.yml` exists; placeholders may omit `import` or use `import: {}`.
      27. **App declarations** — Model native app processes as native/process stack
          runners and select them from plans. Compose-hosted apps remain services of
          the compose stack entry.
      28. **Single lifecycle owner** — A Compose service MUST NOT also appear as
          `applications.*.run.docker.service`, a standalone docker runner, a raw
          `docker compose up` interaction, or a provision lifecycle step.
      29. **Runner meaning** — `compose` manages Compose services. `docker` manages a
          standalone `docker run` container. Merely being containerized does not
          justify generating both runners.
      30. **Plan dependencies** — Express cross-entry startup order with
          `plans.entries[].depends_on` and `order`.
      31. **Health ownership** — Compose healthchecks remain in Compose; native
          process readiness belongs to its stack runner/health configuration.
      32. **`stop` vs `down` semantics** — Validate both operations for the same
          named plan. `stop` preserves resources; `down` tears entries down in reverse dependency order.
      33. **Named lifecycle** — Use `dva up <plan>`/`down <plan>` for declarative
          lifecycle. `dva app` and `dva stack` were removed; `--mode` is migration-only.
      34. **No synthetic dual path** — Do not invent native and docker alternatives.
          Declare only execution paths proven by project files and developer workflow.
      35. **Environment switching** — Put dev/stg/prd variables in `environments:`
          and host/location differences in `sites:`; plans select both. Remote sites carry
          development or maintenance intent (rule 41).
      36. **Provision boundary** — Provision prepares files, dependencies, directories,
          or credentials. Lifecycle startup belongs to plans.
      37. **Interaction boundary** — Interactions are one-shot developer commands,
          not alternate lifecycle wrappers.
      38. **Compose command reuse** — Container exec interactions should use
          `service:` + `command:`. Avoid repeating declared Compose file/project flags.
      39. **Preserve migration** — In preserve mode, report legacy ownership overlap
          before migration; do not silently delete working commands.
      40. **Rewrite migration** — In rewrite mode, remove legacy applications/modes
          only after equivalent stack runners and plans exist.
      41. **Local-first scope** — Generated configuration serves local development and
          maintenance. Default every execution target to a local virtual environment, and
          declare a remote target only for a resource that cannot run locally (a shared
          database, a managed service). Never generate release, rollout, or incident-response
          workflows: DVA is not a production operations tool. Environment names follow
          `naming-presets.md` § Environment Presets.
      42. **Capability closure and safe default** — Every selected service must have one
          verified provider for each required capability. Never invent a provider or select
          two lifecycle owners. Prefer `default_plan: local-infra` only when it is local and
          non-destructive; never generate `full-stack` as the default. If no safe default is
          provable, omit `default_plan` and require `dva up <plan>`.
      43. **Platform bindings are input context** — Apply an injected `capability_bindings`
          preference only when its provider target and evidence are verified. Do not emit
          capability metadata as unsupported `dva.yml` keys, hardcode portfolio product names
          into generic defaults, or replace a working provider silently in preserve mode.
      <!-- AUTOGEN:dva_flow_guardrails:end -->

      ## 라이브러리 규칙 — 네이밍 프리셋
      <!-- AUTOGEN:dva_flow_naming:start -->
      # DVA Naming and Plan Presets

      > `dva.yml` 생성기가 사용하는 결정 규약. 새/rewrite 설정은 현재 `stack` + named
      > `plans` 모델만 생성하며 legacy `modes`, `compose_services`, `default_mode`를 만들지 않는다.
      > 이 문서의 분류는 생성 규칙이며 DVA validator가 대신 판단해 주지 않는다.

      ## Service Tags

      | Tag | Meaning | Examples |
      |-----|---------|----------|
      | `infra` | Runtime infrastructure | postgres, redis, rabbitmq, oidc-provider |
      | `api` | HTTP/gRPC handlers | api-server, gateway, graphql |
      | `worker` | Background processing | sidekiq, consumer, scheduler |
      | `ui` | User-facing dev servers | next, vite, storybook |
      | `data` | Database/search/object storage | postgres, meilisearch, minio |
      | `monitoring` | Observability | prometheus, grafana, jaeger |
      | `build` | Build-time only | builder, compiler, asset-pipeline |

      Use every tag supported by project evidence. The primary Compose runner has `tags: [infra]`.
      Subprojects exclude parent-owned infrastructure with `exclude_tags: [infra]`.

      ## Capability Closure

      Classify discovered services before writing plans. A plan is complete only when every selected
      capability's required capabilities have a single lifecycle provider.

      | Capability | Typical evidence | Requires | Plan class |
      |------------|------------------|----------|------------|
      | `database` | DATABASE_URL, migrations, SQL driver | — | core |
      | `cache` | REDIS_URL, cache client | — | core when startup requires it |
      | `identity` | OIDC issuer/client settings, identity-provider service | `database` unless explicitly external/self-contained | core when normal development authenticates |
      | `queue` | broker URL, producer/consumer | — | core only when startup requires it; otherwise extended |
      | `object-storage` / `search` | S3, MinIO, Elasticsearch settings | — | core only when startup requires it; otherwise extended |
      | `app-native` | verified local run command | its runtime dependencies | local-dev |
      | `app-compose` | app service in a verified Compose model | its runtime dependencies | full-stack |
      | `observability` | metrics/tracing Compose files | observed targets | opt-in |
      | `tools` | admin UI, mail viewer, debug utility | its declared dependencies | opt-in |

      Do not infer capability requirements from a service name alone. Verify Compose `depends_on`,
      environment variables, manifests, README/Makefile targets, and existing DVA declarations. Do not
      select two database providers, or both native and Compose ownership for the same app.

      ## Provider Resolution

      Resolve each required capability deterministically:

      1. An explicit project provider contract or documented platform-policy opt-out wins.
      2. Preserve mode keeps a working existing lifecycle owner and reports a conflicting binding.
      3. Fresh/rewrite mode applies an accepted portfolio/platform binding before generic inference.
      4. Otherwise use a verified local service already present in the project's Compose model
         (root, `compose/`, `ops/*/compose.y*ml`).
      5. If none resolves and local startup requires the capability, scaffold a modular Compose
         service named after the evidence (see `devbox-apply.md` §D). Do not substitute a
         template postgres/redis for a different product. If the capability is optional, report
         it and omit the plan.
      6. Never invent a sibling path, second database, or unverified command.

      Rewrite/new generation applies a platform binding only when its target and lifecycle command or
      imported plan are verified. A remote/shared provider is represented as an external dependency or
      imported plan, not by generating a second local database.

      ### Injected platform bindings

      Portfolio-specific relationships enter discovery as `capability_bindings`; product names and
      provider choices do not belong in generic DVA defaults. Each binding supplies `capability`,
      `provider`, `consumer`, `ownership`, and concrete `evidence`. Apply this deterministic table:

      | Evidence | Result |
      |----------|--------|
      | Provider and consumer are separate parent-owned stack entries | Include both in one plan and make the consumer entry depend on the provider entry |
      | Provider and consumer are services of one Compose entry | Select both services; ordering remains in Compose `depends_on`, not plan `depends_on` |
      | Either side is an external/shared runtime or separately imported plan | Emit verified prerequisite commands or health contracts separately; do not pretend two plans are one atomic plan |
      | Existing config already owns a local/embedded DB | Preserve it in preserve mode and report the provider-policy mismatch; migrate only in rewrite mode after the orchestrator target is verified |
      | Project explicitly opts out of the platform provider | Use the project's verified provider and record the exception in the generated summary |
      | No verified provider target exists | Report the unresolved capability; do not guess a service or sibling path |

      Bindings are generation inputs and are never emitted as new `dva.yml` keys. Without an injected
      binding, use the generic provider-resolution order above.

      ## Deterministic Plan Matrix

      Each plan is a self-contained list. DVA does not compose or inherit plans, so repeat the resolved
      entry/service closure explicitly and keep matching `up`, `stop`, and `down` names symmetric.

      | Plan | Exact inclusion rule | Default policy |
      |------|----------------------|----------------|
      | `local-infra` | Verified core providers needed by the normal native workflow; no app, monitoring, or tool entries | Preferred `default_plan` when all providers are local and non-destructive |
      | `local-dev` | Complete `local-infra` closure plus every verified native app entry and its dependencies | Generate when native run commands exist; not the default merely because it is convenient |
      | `full-stack` | Runtime capability closure plus verified Compose-hosted app services | Explicit opt-in; never the generated default |
      | `observability` | The complete base closure needed by observed targets plus monitoring entries/services | Explicit opt-in; not an overlay at runtime |
      | `tools` | Only verified tool services plus their capability closure | Explicit opt-in |

      Omit a plan whose execution path has no evidence. Add project-specific plans only for a distinct,
      documented workflow and use project vocabulary. If several plans exist but no safe local default can
      be proven, omit `default_plan` so bare `dva up` fails and forces a name.

      ### Command policy

      | Level | Rule |
      |-------|------|
      | Required | Discover names with `dva ls`, `dva show`, or `dva manifest -f json`; run lifecycle as `dva up <plan>`, `dva stop <plan>`, and `dva down <plan>` |
      | Recommended | Use `dva up local-infra` for dependencies only and `dva up local-dev` for the verified native workflow |
      | Discouraged | Bare `dva up`; it hides which `default_plan` was selected and is suitable only for a documented human shortcut |
      | Forbidden | `dva up *`, guessed plan names, raw Compose/Kubernetes lifecycle duplicates, and making `full-stack` the generated default |

      ## Canonical Hybrid Example

      ```yaml
      stack:
        core-compose:
          default_runner: compose
          runners:
            compose:
              files: [compose.yml]
              tags: [infra]
              services:
                postgres: { tags: [infra, data] }
                redis: { tags: [infra, data] }
                api: { tags: [api] }
        api:
          default_runner: native
          runners:
            native: { run: make run }

      plans:
        local-infra:
          entries:
            - name: core-compose
              runner: compose
              services: [postgres, redis]
        local-dev:
          entries:
            - name: core-compose
              runner: compose
              services: [postgres, redis]
            - name: api
              runner: native
              depends_on: [core-compose]
        full-stack:
          entries:
            - name: core-compose
              runner: compose
              services: [postgres, redis, api]
      default_plan: local-infra
      ```

      The service lists contain concrete Compose service names, not tags. Native entries are separate
      stack entries. Replace every example value with names and commands verified in the target project.

      ## Environment and Site Presets

      | Environment | Meaning |
      |-------------|---------|
      | `dev` | Local development variables |
      | `test` | Test-specific database/logging variables |
      | `stg` | Staging-shaped variables used for local validation |
      | `prd` | Production-shaped variables used for local validation |

      Use `environments` for variable sets and `sites` for host/location differences. DVA is a local
      development and maintenance tool: a remote site does not grant deployment or incident authority.
      Match existing project vocabulary such as `.env.staging` when evidence is stronger than this preset.
