# yaml-language-server: $schema=../schemas/flow.schema.json
name: dva-improve-guided/00-analyze
description: "Stage 00: Scan target project and enumerate candidate DVA options"
contract:
  goal: "프로젝트 구조를 분석하여 선택 가능한 DVA 옵션을 수집한다"
  expected_results:
    - "DVA 필요 여부가 판단된다"
    - "setup_track(fresh/adopt/upgrade)이 분류된다"
    - "분석 리포트가 JSON으로 저장된다"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "분석은 compose, Dockerfile, 빌드 도구, 패키지 매니페스트에 근거한다"
pipeline_role: analyzer
default_backend: smart

imports:
  profiles:
    - dva-common

default_profile: dva_analyzer

parameters:
  - name: target
    description: "Target directory to scan"
    default: "."
  - name: shared_dir
    description: "Absolute path to agent-mesh-flows/shared. Empty → $DVA_SHARED_DIR, then the run directory. Must also appear in am's allowed_roots_add."
    default: ""

steps:
  - id: check_dva
    type: context
    context:
      dva_available: |
        command -v dva >/dev/null 2>&1 && echo "yes" || echo ""
      # `dva version` has no --short flag; parse the --json contract instead. Stage 00 only
      # reports the value, but stage 30 hands it to an LLM that writes `version:`, so all
      # stages resolve it the same way.
      dva_version: "dva version --json 2>/dev/null | jq -r '.version // \"unknown\"' 2>/dev/null || echo 'unknown'"
      docker_available: "command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1 && echo 'yes' || echo 'no'"
    exit_if_empty: dva_available

  - id: detect_basics
    type: context
    depends_on: [check_dva]
    context:
      has_dva_yml: |
        cd '{{param.target}}' && { [ -f 'dva.yml' ] || [ -f 'dva.yaml' ]; } && printf true || printf false
      has_compose: |
        cd '{{param.target}}' && ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null >/dev/null && printf true || printf false
      has_dockerfile: |
        cd '{{param.target}}' && ls Dockerfile Dockerfile.* */Dockerfile 2>/dev/null >/dev/null && printf true || printf false
      has_makefile: "[ -f '{{param.target}}/Makefile' ] && printf true || printf false"
      build_tools: |
        cd '{{param.target}}'
        found=""
        for f in Makefile package.json pyproject.toml go.mod Cargo.toml Gemfile build.gradle pom.xml; do
          [ -f "$f" ] && found="$found $f"
        done
        echo "${found:-None}"

  - id: dva_cli_data
    type: context
    depends_on: [detect_basics]
    when: "{{detect_basics.has_dva_yml | trim}} == true"
    context:
      dva_show: "cd '{{param.target}}' && dva show --json 2>/dev/null || echo '{}'"
      dva_doctor: "cd '{{param.target}}' && dva doctor --json 2>/dev/null || echo '{\"checks\":[]}'"
      dva_manifest: "cd '{{param.target}}' && dva manifest -f json 2>/dev/null || echo '{}'"
      dva_validate: "cd '{{param.target}}' && dva config validate --strict 2>&1 || true"
      dva_config: "cd '{{param.target}}' && dva config show -f yaml 2>/dev/null | head -300 || echo ''"

  - id: scan_project
    type: context
    depends_on: [detect_basics]
    context:
      compose_files: |
        cd '{{param.target}}'
        ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml \
           compose.*.yaml compose.*.yml docker-compose.*.yml docker-compose.*.yaml \
           infra/compose*.y*ml docker/compose*.y*ml compose/compose*.y*ml 2>/dev/null || echo 'none'
      compose_services: |
        cd '{{param.target}}'
        # Emit each top-level block's keys separately. A flat indent grep conflates
        # services with networks/volumes, so a network reads as an undeclared service
        # (measured: cwrapper-devbox's `backend` network reported as a missing service).
        yaml_block_keys() {
          awk -v blk="$2" '
            BEGIN { inb = 0; base = 0 }
            $0 ~ "^" blk ":[[:space:]]*(#.*)?$" { inb = 1; base = 0; next }
            /^[^[:space:]#]/ { inb = 0 }
            inb && match($0, /^[[:space:]]+/) {
              ind = RLENGTH; rest = substr($0, ind + 1)
              if (rest ~ /^#/) next
              if (rest ~ /^[A-Za-z0-9_.-]+:/) {
                if (base == 0) base = ind
                if (ind == base) { sub(/:.*/, "", rest); printf "%s ", rest }
              }
            }
            END { printf "\n" }
          ' "$1"
        }
        for f in $(ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null); do
          echo "=== $f ==="
          echo "  services: $(yaml_block_keys "$f" services)"
          echo "  networks: $(yaml_block_keys "$f" networks)"
          echo "  volumes:  $(yaml_block_keys "$f" volumes)"
        done
      existing_dva: "cat {{param.target}}/dva.yml 2>/dev/null || cat {{param.target}}/dva.yaml 2>/dev/null || echo ''"
      makefile_targets: |
        cd '{{param.target}}'
        [ -f 'Makefile' ] && grep -E '^[a-zA-Z_-]+:.*##' Makefile 2>/dev/null | head -40 || echo 'no Makefile'
      package_json_scripts: |
        cd '{{param.target}}'
        if [ ! -f 'package.json' ]; then echo "None"; exit 0; fi
        if command -v jq >/dev/null 2>&1; then
          scripts=$(jq -r '.scripts // {} | to_entries[] | "  \(.key): \(.value)"' package.json 2>/dev/null)
          [ -n "$scripts" ] && echo "package.json scripts:" && echo "$scripts" || echo "package.json has no scripts"
        else
          echo "package.json scripts (raw):"
          grep -A 50 '"scripts"' package.json 2>/dev/null | grep -E '^\s+"[^"]+":' | head -30
        fi
      env_files: "ls {{param.target}}/.env {{param.target}}/.env.example {{param.target}}/.env.* 2>/dev/null || echo 'none'"
      port_mappings: |
        cd '{{param.target}}'
        for f in $(ls compose.yaml compose.yml docker-compose.yml docker-compose.yaml 2>/dev/null); do
          grep -E 'ports:' -A 10 "$f" 2>/dev/null | grep -E '"[0-9]+:[0-9]+"' | head -20
        done
      subprojects: |
        cd '{{param.target}}'
        for d in */; do
          [ -d "$d" ] || continue
          base=$(basename "$d")
          case "$base" in
            node_modules|vendor|.git|.idea|.vscode|tmp|build|dist|target|compose|docker|infra|infrastructure|scripts|docs|monitoring|k8s|data|specs|reports|agent-mesh-flows) continue ;;
          esac
          markers=""
          [ -f "$d/package.json" ] && markers="$markers package.json"
          [ -f "$d/go.mod" ] && markers="$markers go.mod"
          [ -f "$d/pyproject.toml" ] && markers="$markers pyproject.toml"
          [ -f "$d/Cargo.toml" ] && markers="$markers Cargo.toml"
          [ -n "$markers" ] && echo "$base:$markers"
        done
        # A detection snippet reports absence as data. Without this the loop's exit
        # status is whatever the last guard returned, so a final directory carrying no
        # marker fails the step and takes the whole discovery run down with it.
        exit 0
      workspace_map: |
        cd '{{param.target}}'
        if [ -f 'pnpm-workspace.yaml' ]; then
          echo "=== pnpm-workspace.yaml ==="; cat pnpm-workspace.yaml
        elif [ -f 'pnpm-workspace.yml' ]; then
          echo "=== pnpm-workspace.yml ==="; cat pnpm-workspace.yml
        fi
        if [ -f 'package.json' ]; then
          ws=$(grep -A 20 '"workspaces"' package.json 2>/dev/null | head -20)
          [ -n "$ws" ] && echo "=== package.json workspaces ===$ws"
        fi
        if [ -f 'Cargo.toml' ]; then
          members=$(awk '/^\[workspace\]/,/^\[/' Cargo.toml 2>/dev/null | grep 'members' -A 20 | head -20)
          [ -n "$members" ] && echo "=== Cargo.toml [workspace.members] ==="
          [ -n "$members" ] && echo "$members"
        fi
        if [ -f 'go.work' ]; then
          echo "=== go.work ==="; cat go.work
        fi
        [ ! -f 'pnpm-workspace.yaml' ] && [ ! -f 'pnpm-workspace.yml' ] && \
        [ ! -f 'Cargo.toml' ] && [ ! -f 'go.work' ] && echo "None"
        exit 0
      k8s_manifests: |
        cd '{{param.target}}'
        # Detect Kubernetes manifests in common directories
        found=$(find . \( -path '*/node_modules' -o -path '*/.git' -o -path '*/vendor' \) -prune -o \
          \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null | \
          xargs grep -l '^kind:' 2>/dev/null | head -20)
        if [ -n "$found" ]; then
          echo "K8s manifest files:"
          echo "$found"
          # Summarize kinds
          echo "\nKinds detected:"
          echo "$found" | xargs grep -h '^kind:' 2>/dev/null | sort | uniq -c | sort -rn | head -15
        else
          echo "None"
        fi
      helm_charts: |
        cd '{{param.target}}'
        # Detect Helm Chart.yaml files
        charts=$(find . \( -path '*/node_modules' -o -path '*/.git' \) -prune -o -name 'Chart.yaml' -print 2>/dev/null | head -10)
        if [ -n "$charts" ]; then
          echo "Helm charts found:"
          for c in $charts; do
            dir=$(dirname "$c")
            name=$(grep '^name:' "$c" 2>/dev/null | head -1)
            version=$(grep '^version:' "$c" 2>/dev/null | head -1)
            echo "  $dir — $name $version"
          done
        else
          echo "None"
        fi
      package_names: |
        cd '{{param.target}}'
        # Go
        [ -f go.mod ] && echo "go: $(head -1 go.mod | sed 's/module //')"
        # Rust
        [ -f Cargo.toml ] && grep -A2 '^\[package\]' Cargo.toml 2>/dev/null | grep 'name' | head -1 | sed 's/.*= *"\(.*\)"/rust: \1/'
        # Node
        [ -f package.json ] && echo "node: $(grep '"name"' package.json 2>/dev/null | head -1 | sed 's/.*: *"\(.*\)".*/\1/')"
        # Python
        [ -f pyproject.toml ] && grep -A2 '^\[project\]' pyproject.toml 2>/dev/null | grep 'name' | head -1 | sed 's/.*= *"\(.*\)"/python: \1/'
        # Same reason as `subprojects`: the last guard decides the exit status, so a
        # project without pyproject.toml would read as a failed scan.
        exit 0
      dir_tree: "find {{param.target}} -maxdepth 3 -not -path '*/\\.*' -not -path '*/vendor/*' -not -path '*/node_modules/*' -not -path '*/target/*' 2>/dev/null | head -80"

  # ══════════════════════════════════════════════
  # ══════════════════════════════════════════════
  # Locate agent-mesh-flows/shared
  # ══════════════════════════════════════════════
  # `read_file` resolves `src` against the run directory and refuses to leave am's
  # approved roots, so a repo-relative path only reaches the library when the flow
  # happens to run from inside the dva repo — and these flows exist to be pointed at
  # other projects. The path is machine-specific, so it arrives by parameter or env
  # var and the search below takes the first candidate that actually holds the library.
  #
  # Two conditions must hold on the workstation, and only the first is testable here:
  #   1. the directory resolves — proven below by looking for shared-guardrails.md;
  #   2. it is listed under `allowed_roots_add:` in
  #      ~/.config/agent-mesh/sandbox_override.yaml — enforced by am inside read_file.
  # `when:` does not gate that second check (measured: the path check runs before the
  # condition), so a missing root surfaces as "escaped all approved roots" on the next
  # step. The message below names both requirements for that reason.
  #
  # Failing loudly is deliberate. `exit_if_empty` exits the pipeline *successfully*,
  # which would hand back a report produced with no guardrails at all — the exact
  # defect this resolver exists to close.
  - id: resolve_shared
    type: context
    context:
      dir: |
        for cand in "{{param.shared_dir}}" "$DVA_SHARED_DIR" "$PWD/agent-mesh-flows/shared"; do
          [ -n "$cand" ] || continue
          [ -f "$cand/library/shared-guardrails.md" ] || continue
          printf '%s' "$cand"
          exit 0
        done
        echo "ERROR: agent-mesh-flows/shared not found." >&2
        echo "  Pass it explicitly:  -p shared_dir=<dva-repo>/agent-mesh-flows/shared" >&2
        echo "  or export DVA_SHARED_DIR to the same path." >&2
        echo "  The same path must also be listed under allowed_roots_add: in" >&2
        echo "  ~/.config/agent-mesh/sandbox_override.yaml — am's read_file cannot" >&2
        echo "  read outside an approved root." >&2
        exit 1

  # ══════════════════════════════════════════════
  # Library rules this stage's own output is judged against
  # ══════════════════════════════════════════════
  # Stage 00 writes no dva.yml, so it looked like a stage that needed no guardrails.
  # But `candidate_environments`, `recommended_modes` and `changes[]` are carried
  # verbatim into stage 30 and into `dva-improve` through `param.discovery_report`,
  # and neither re-derives them — a candidate that breaks a rule here is already
  # past the gate before any stage that loads the library sees it. Measured on a
  # foreign project: the report proposed `development/staging/production` against the
  # dev/stg/prd preset, and 4 of 7 changes built a stg/prd deployment axis that
  # rule 41 forbids. Schema and examples stay out — they govern generation, and
  # generation happens in stage 30, which already loads them.
  - id: load_guardrails
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/shared-guardrails.md"

  - id: load_naming
    type: read_file
    depends_on: [resolve_shared]
    src: "{{resolve_shared.dir}}/library/naming-presets.md"

  - id: analyze
    type: llm
    depends_on: [detect_basics, dva_cli_data, scan_project, load_guardrails, load_naming]
    json_mode: true
    instruction: |
      프로젝트를 분석하여 DVA 설정 계획과 선택 가능한 옵션을 JSON으로 생성하라.

      후보는 아래 라이브러리 규칙 안에서만 제안한다. 규칙과 충돌하는 후보는 리포트에
      넣지 않는다 — 이 리포트는 stage 30 과 `dva-improve` 의 `discovery_report` 입력이고,
      두 단계 모두 후보를 다시 도출하지 않으므로 여기서 통과한 것은 그대로 반영된다.

      ## 라이브러리 규칙 — 가드레일
      {{load_guardrails.output}}

      ## 라이브러리 규칙 — 네이밍 프리셋
      {{load_naming.output}}

      ## DVA CLI 정보
      - DVA 버전: {{check_dva.dva_version}}
      - Docker: {{check_dva.docker_available | trim}}

      ## 탐지 결과
      - 기존 dva.yml: {{detect_basics.has_dva_yml | trim}}
      - 기존 compose: {{detect_basics.has_compose | trim}}
      - Dockerfile: {{detect_basics.has_dockerfile | trim}}
      - Build tools: {{detect_basics.build_tools}}

      ## DVA Necessity Check
      - compose 없고, Dockerfile 없고, 인프라 의존성 없으면 → dva_needed: false
      - 순수 ops/docs 프로젝트면 → dva_needed: false

      ## Track 분류
      - **fresh**: compose 없음 → dva.yml + compose.yaml 신규 생성
      - **adopt**: compose 있음, dva.yml 없음 → dva.yml 생성
      - **upgrade**: dva.yml 있음 → 업그레이드

      ## DVA CLI 데이터 (upgrade track)
      {{dva_cli_data.dva_show}}
      {{dva_cli_data.dva_validate}}
      {{dva_cli_data.dva_config}}

      ## 프로젝트 스캔
      [COMPOSE FILES] {{scan_project.compose_files}}
      [COMPOSE SERVICES] {{scan_project.compose_services}}
      [EXISTING DVA] {{scan_project.existing_dva}}
      [MAKEFILE] {{scan_project.makefile_targets}}
      [PACKAGE_JSON_SCRIPTS] {{scan_project.package_json_scripts}}
      [ENV FILES] {{scan_project.env_files}}
      [PORTS] {{scan_project.port_mappings}}
      [SUBPROJECTS] {{scan_project.subprojects}}
      [WORKSPACE MAP] {{scan_project.workspace_map}}
      [PACKAGES] {{scan_project.package_names}}
      [K8S MANIFESTS] {{scan_project.k8s_manifests}}
      [HELM CHARTS] {{scan_project.helm_charts}}
      [TREE] {{scan_project.dir_tree}}

      ## Kubernetes/Helm Stack Inference
      - K8s manifests detected (k8s_manifests != None) → suggest `stack.kubectl` with `dir:` pointing to manifest directory.
      - Helm charts detected (helm_charts != None) → suggest `stack.helm` with appropriate `chart:` and `release:` fields.
      - Both present → suggest `stack.kubectl` for raw manifests AND `stack.helm` for charts.
      - 실행 대상은 로컬 클러스터(kind/minikube/k3d/docker-desktop)를 기본값으로 둔다.
        로컬에서 실행할 수 없는 리소스에 한해서만 원격 대상을 선언한다 (규칙 41).
      - K8s/Helm 과 compose 가 함께 있으면 둘 다 **로컬 실행 전략**으로 제안한다.
        `environments:` 를 배포 대상 축(staging/production)으로 만들지 않는다 —
        environment 이름은 변수 집합의 라벨이다 (규칙 23·41,
        naming-presets § Environment Presets). release/rollout/incident 워크플로우도
        제안하지 않는다.
      - Do NOT force a compose-only stack entry when the primary infra is Kubernetes-native.

      ## Output Format
      ```json
      {
        "dva_needed": true,
        "dva_not_needed_reason": "",
        "setup_track": "fresh|adopt|upgrade",
        "development_pattern": "hybrid|container-first|devbox",
        "project_archetype": "web-app|service-daemon|microservices|simple-app",
        "stack": ["detected technologies"],
        "package_names": {"lang": "name"},
        "service_groups": [{"name": "svc", "tags": ["infra"]}],
        "recommended_modes": ["local-infra", "full-stack"],
        "candidate_environments": ["dev", "test"],
        "detected_applications": [{"name": "api", "port": 8080, "framework": "..."}],
        "candidate_options": {
          "applications": [{"name": "api", "native_run": ["..."], "docker_services": ["api"]}],
          "interactions": [{"name": "test", "source": "package.json", "command": "npm test"}]
        },
        "selection_hints": ["추천 기본 mode는 hybrid"],
        "compose_issues": ["issues"],
        "port_discrepancies": [],
        "naming_compliance": {"issues": []},
        "changes": [
          {"id": "C001", "action": "create|modify", "path": "dva.yml", "reason": "why", "risk": "low"}
        ],
        "summary": {"total": 0, "create": 0, "modify": 0}
      }
      ```

      `recommended_modes` 는 plan 프리셋 이름(local-infra / local-dev / full-stack /
      observability 또는 프로젝트 어휘), `candidate_environments` 는 environment 프리셋
      이름(dev / test / stg / prd)만 사용한다 — 규칙 23.

  - id: save_report
    type: shell
    depends_on: [analyze]
    action: |
      REPORT_DIR="tmp/improve-guided"
      mkdir -p "$REPORT_DIR"
      cat <<'REPORT_EOF' > "$REPORT_DIR/00-analysis-report.json"
      {{analyze.output}}
      REPORT_EOF
      echo "Report saved: $REPORT_DIR/00-analysis-report.json"

  - id: print_summary
    type: llm
    depends_on: [analyze]
    backend: fast
    instruction: |
      분석 리포트를 markdown 요약으로 변환.
      포함: DVA 필요 여부, track, 패턴, 서비스 그룹, 변경 계획.

      {{analyze.output}}
