      ## Kubernetes/Helm Stack Inference
      - A runner always lives in the `runners:` map under a stack entry. Putting a runner name
        directly under `stack:` as its own key is **not** rejected: stack entries accept
        arbitrary keys, so it silently becomes an entry *named* after the runner, the runner is
        inferred from that name, and the keys meant as runner config are ignored -- `kubectl
        apply` then runs with no manifests at all. It validates, so nothing surfaces the
        mistake. Nest under `runners:`.
      - K8s manifests detected (k8s_manifests != None) → suggest a stack entry whose
        `stack.<entry>.runners.kubectl` sets `manifests:` (an array of strings) to the manifest
        paths. There is no `dir:` key — the kubectl runner accepts only `manifests`,
        `namespace`, `context`, `kubeconfig`.
      - Helm charts detected (helm_charts != None) → suggest `stack.<entry>.runners.helm` with
        `chart:` and `release:`. The helm runner accepts only `chart`, `release`, `namespace`,
        `context`, `values`, `set`.
      - Both present → suggest one entry using `runners.kubectl` for the raw manifests AND a
        separate entry using `runners.helm` for the charts.
      - 실행 대상은 로컬 클러스터(kind/minikube/k3d/docker-desktop)를 기본값으로 둔다.
        로컬에서 실행할 수 없는 리소스에 한해서만 원격 대상을 선언한다 (규칙 41).
      - K8s/Helm 과 compose 가 함께 있으면 둘 다 **로컬 실행 전략**으로 제안한다.
        `environments:` 를 배포 대상 축(staging/production)으로 만들지 않는다 —
        environment 이름은 변수 집합의 라벨이다 (규칙 23·41,
        naming-presets § Environment Presets). release/rollout/incident 워크플로우도
        제안하지 않는다.
      - Do NOT force a compose-only stack entry when the primary infra is Kubernetes-native.

      ## Output Format
      ```json
      {
        "dva_needed": true,
        "dva_not_needed_reason": "",
        "setup_track": "fresh|adopt|upgrade",
        "development_pattern": "hybrid|container-first|devbox",
        "project_archetype": "web-app|service-daemon|microservices|simple-app",
        "stack": ["detected technologies"],
        "package_names": {"lang": "name"},
        "service_groups": [{"name": "svc", "tags": ["infra"]}],
        "recommended_plans": ["local-infra", "full-stack"],
        "candidate_environments": ["dev", "test"],
        "detected_stack_entries": [{"name": "api", "runner": "native", "port": 8080, "framework": "..."}],
        "capability_bindings": [
          {"capability": "database", "provider": "...", "consumer": "...", "ownership": "parent-stack|external|separate-plan|project-local", "evidence": ["..."], "status": "accepted|conflict|unverified"}
        ],
        "candidate_options": {
          "stack_entries": [{"name": "api", "native_run": ["..."], "docker_services": ["api"]}],
          "interactions": [{"name": "test", "source": "package.json", "command": "npm test"}]
        },
        "selection_hints": ["안전한 기본 plan은 local-infra"],
        "compose_issues": ["issues"],
        "port_discrepancies": [],
        "naming_compliance": {"issues": []},
        "changes": [
          {"id": "C001", "action": "create|modify", "path": "dva.yml", "reason": "why", "risk": "low"}
        ],
        "summary": {"total": 0, "create": 0, "modify": 0}
      }
      ```

      `recommended_plans` 는 plan 프리셋 이름(local-infra / local-dev / full-stack /
      observability 또는 프로젝트 어휘), `candidate_environments` 는 environment 프리셋
      이름(dev / test / stg / prd)만 사용한다 — 규칙 23.

  # The reports below are run artifacts of this stage, written into whatever directory the
  # run was started from. Without this marker they show up as untracked files in that
  # project's `git status` after every guided run -- noise the user did not create and has
  # no way to attribute. The marker ignores the directory's contents and itself, so nothing
  # here reaches the index and the project's own .gitignore is never edited.
  #
  # `path` is relative on purpose: it resolves against the run directory, exactly like the
  # REPORT_DIR below and like `read_file`'s `src`. Anchoring it to `{{param.target}}` instead
  # would put the marker somewhere the reports are not.
  #
  # Snapshots of the config are a different lifetime and live in `backups/dva/`; `tmp/` is
  # for things that are safe to delete.
  - id: report_marker
    type: file
    file:
      op: write
      path: "tmp/improve-guided/.gitignore"
      content: "*\n"

  - id: save_report
    type: shell
    depends_on: [analyze, report_marker]
    action: |
      REPORT_DIR="tmp/improve-guided"
      REPORT="$REPORT_DIR/00-analysis-report.json"
      RAW="$REPORT_DIR/00-analysis-report.raw"
      mkdir -p "$REPORT_DIR"
      cat <<'REPORT_EOF' > "$RAW"
      {{analyze.output}}
      REPORT_EOF

      # json_mode: true is best-effort. The smart backend is a fallback chain, so the
      # provider that answers is not fixed, and some decorate the response outside the JSON
      # contract (measured: grok-4.5 prepends citation markers like [1][2][3]). Slice the
      # outermost object out of whatever came back, then prove it parses — stage 10
      # reads and validates this file before producing the approved artifact.
      awk '
        { buf = buf $0 "\n" }
        END {
          i = index(buf, "{")
          if (i == 0) { exit 1 }
          j = 0
          for (k = length(buf); k >= 1; k--) {
            if (substr(buf, k, 1) == "}") { j = k; break }
          }
          if (j == 0) { exit 1 }
          printf "%s", substr(buf, i, j - i + 1)
        }
      ' "$RAW" > "$REPORT" || {
        echo "ERROR: the analysis response contains no JSON object. Raw response kept at $RAW" >&2
        exit 1
      }
      # jq -e . accepts a *stream* of concatenated values, not one document: given
      # [1][2]{...} it exits 0, and a later jq -r prints a plausible value from the
      # trailing object while the array errors go to stderr. Require exactly one object.
      if ! jq -e -s 'length == 1 and (.[0] | type) == "object"' "$REPORT" >/dev/null 2>&1; then
        echo "ERROR: the analysis response is not a single JSON object. Raw response kept at $RAW" >&2
        jq . "$REPORT" 2>&1 | head -5 >&2
        exit 1
      fi

      # Report the repair rather than performing it silently — stripping is expected for
      # some providers, but an unexplained size delta is how a truncated report hides.
      # Count non-whitespace bytes only: a trailing newline is not framing noise, and
      # reporting it on every clean response would train the reader to ignore the line.
      stripped=$(( $(tr -d '[:space:]' < "$RAW" | wc -c) - $(tr -d '[:space:]' < "$REPORT" | wc -c) ))
      if [ "$stripped" -gt 0 ]; then
        echo "NOTE: stripped $stripped byte(s) of non-JSON framing from the response" >&2
      fi
      rm -f "$RAW"
      echo "Report saved: $REPORT"

  - id: print_summary
    type: llm
    depends_on: [analyze]
    backend: fast
    instruction: |
      분석 리포트를 markdown 요약으로 변환.
      포함: DVA 필요 여부, track, 패턴, 서비스 그룹, 변경 계획.

      {{analyze.output}}
