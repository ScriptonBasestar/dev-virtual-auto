# yaml-language-server: $schema=../schemas/flow.schema.json
name: dva-improve-guided/40-execute
description: "Stage 40: Validate configuration and start services"
contract:
  goal: "DVA 설정을 검증하고 인프라를 시작하여 정상 동작을 확인한다"
  expected_results:
    - "dva config validate가 통과한다"
    - "dva up이 성공한다"
    - "서비스가 healthy/running 상태에 도달한다"
  success_criteria:
    - "DVA CLI가 설치되어 있어야 한다"
    - "validation 통과가 execute의 전제조건이다"
pipeline_role: worker
default_backend: fast

imports:
  profiles:
    - dva-common

parameters:
  - name: target
    description: "Target directory"
    default: "."
  - name: plan
    description: "Optional exact plan override; empty reads the approved Stage 10 proposal"
    default: ""

steps:
  # Same guard as `dva-improve.yaml`, which carries the full reasoning. Short version:
  # `file` and `read_file` resolve against the run directory and are path-sandboxed, while
  # `context`/`shell` follow `cd`. Run this stage from anywhere but the target and the two
  # disagree -- reports land in one directory while their `.gitignore` marker lands in the
  # other, and `read_file` cannot reach the stage report it needs. The parent pipeline
  # already assumes this: its hand-off gate tests a relative `tmp/improve-guided/` path.
  - id: check_run_dir
    type: context
    context:
      run_dir_ok: |
        RUN="$PWD"
        cd '{{param.target}}' || exit 1
        if [ "$PWD" = "$RUN" ]; then
          printf 'yes'
        else
          echo "ERROR: 40-execute must run with the target as the working directory." >&2
          echo "  run directory: $RUN" >&2
          echo "  target:        $PWD" >&2
          echo "" >&2
          echo "am resolves file/read_file paths against the run directory and refuses to" >&2
          echo "write outside it, so this stage's reports and the next stage's inputs would" >&2
          echo "end up in different directories." >&2
          echo "" >&2
          echo "Fix: cd '$PWD' && am run dva dva-improve-guided 40-execute" >&2
          exit 1
        fi

  - id: validate_config
    type: shell
    depends_on: [check_run_dir]
    action: |
      cd '{{param.target}}'
      echo "=== dva config validate ==="
      dva config validate 2>&1

      echo ""
      echo "=== dva config validate --strict ==="
      dva config validate --strict 2>&1

  - id: doctor_check
    type: shell
    depends_on: [validate_config]
    action: |
      cd '{{param.target}}'
      echo "=== dva doctor ==="
      dva doctor 2>&1 || echo "doctor check skipped"

  - id: resolve_plan
    type: context
    depends_on: [doctor_check]
    context:
      plan: |
        cd '{{param.target}}' || exit 1
        OVERRIDE=$(printf '%s' '{{param.plan | b64encode}}' | base64 -d)
        if [ -n "$OVERRIDE" ]; then
          PLAN="$OVERRIDE"
        else
          PROPOSAL="tmp/improve-guided/10-proposal-approved.json"
          if ! jq -e -s 'length == 1 and (.[0] | type) == "object"' "$PROPOSAL" >/dev/null 2>&1; then
            echo "ERROR: $PROPOSAL is not one approved JSON object; pass plan explicitly or re-run stage 10." >&2
            exit 1
          fi
          PLAN=$(jq -r '.selected_plan // empty' "$PROPOSAL")
        fi
        if [ -z "$PLAN" ]; then
          echo "ERROR: no approved named plan; pass plan explicitly or re-run stage 10." >&2
          exit 1
        fi
        SHOW=$(dva show --json) || {
          echo "ERROR: cannot inspect generated plans with 'dva show --json'." >&2
          exit 1
        }
        if ! printf '%s' "$SHOW" | jq -e --arg plan "$PLAN" \
          '((.plans | type) == "object") and (.plans | has($plan))' >/dev/null 2>&1; then
          echo "ERROR: approved plan '$PLAN' is not declared by the generated dva.yml." >&2
          exit 1
        fi
        printf '%s' "$PLAN"

  - id: start_services
    type: shell
    depends_on: [resolve_plan]
    action: |
      cd '{{param.target}}'
      PLAN=$(printf '%s' '{{resolve_plan.plan | b64encode}}' | base64 -d)

      echo "=== dva up $PLAN ==="
      if OUTPUT=$(dva up "$PLAN" 2>&1); then
        printf '%s\n' "$OUTPUT" | tail -30
      else
        STATUS=$?
        printf '%s\n' "$OUTPUT" | tail -30
        exit "$STATUS"
      fi

  - id: verify_status
    type: context
    depends_on: [start_services]
    context:
      stack_status: "cd '{{param.target}}' && dva status --json 2>/dev/null || echo '{}'"
      dva_show: "cd '{{param.target}}' && dva show --json 2>/dev/null || echo '{}'"

  # The reports below are run artifacts of this stage, written into whatever directory the
  # run was started from. Without this marker they show up as untracked files in that
  # project's `git status` after every guided run -- noise the user did not create and has
  # no way to attribute. The marker ignores the directory's contents and itself, so nothing
  # here reaches the index and the project's own .gitignore is never edited.
  #
  # `path` is relative on purpose: it resolves against the run directory, exactly like the
  # REPORT_DIR below and like `read_file`'s `src`. Anchoring it to `{{param.target}}` instead
  # would put the marker somewhere the reports are not.
  #
  # Snapshots of the config are a different lifetime and live in `backups/dva/`; `tmp/` is
  # for things that are safe to delete.
  - id: report_marker
    type: file
    file:
      op: write
      path: "tmp/improve-guided/.gitignore"
      content: "*\n"

  - id: save_report
    type: shell
    depends_on: [verify_status, report_marker]
    action: |
      REPORT_DIR="tmp/improve-guided"
      mkdir -p "$REPORT_DIR"
      # The delimiter is quoted because am reads an unquoted heredoc body as shell and
      # blocks the step on its first word -- measured: this report blocked on DVA, the
      # first word of its own title line. Quoting also stops shell expansion inside the
      # body, which costs nothing here: the two values below are am template references,
      # substituted before the shell sees this text.
      cat > "$REPORT_DIR/40-execution-report.txt" <<'EOF'
      === DVA Status ===
      {{verify_status.stack_status}}

      === DVA Show ===
      {{verify_status.dva_show}}
      EOF
      echo "Execution report saved."

  - id: print_summary
    type: llm
    depends_on: [verify_status]
    backend: fast
    instruction: |
      실행 결과를 요약하라.

      [STATUS] {{verify_status.stack_status}}
      [SHOW] {{verify_status.dva_show}}
