# yaml-language-server: $schema=schemas/flow.schema.json
name: dva-improve-guided
description: "Interactive DVA setup pipeline: analyze options, confirm selections, configure, execute"
contract:
  goal: "프로젝트 분석 → 발견 옵션 검토/선택 → 디렉토리 정리 → dva.yml 생성/개선 → 실행 검증까지 완료"
  expected_results:
    - "프로젝트 분석 리포트가 생성된다"
    - "interactive 실행은 추천 조합을 검토하고, 명시적 batch(-y)는 생성안을 자동 승인한다"
    - "dva.yml이 생성 또는 개선된다"
    - "dva config validate가 통과한다"
    - "dva up이 성공한다 (--skip-execute가 아닌 경우)"
  success_criteria:
    - "Stage 10에서 분석 결과와 추천 옵션을 사용자에게 제시해야 한다"
    - "interactive에서는 Stage 10 output review를 수락해야 한다; -y는 caller의 명시적 auto-approval이다"
    - "모든 stage가 gate PASS로 완료되어야 한다"
    - "DVA CLI가 설치되어 있어야 한다"
pipeline_role: orchestrator
default_backend: smart

parameters:
  - name: target
    description: "Target directory to analyze and configure"
    default: "."
  - name: skip_execute
    description: "Stop after configure stage (no dva up)"
    default: "false"
    enum: ["true", "false"]
  - name: plan
    description: "Optional exact plan override; empty executes the approved selected_plan"
    default: ""
  - name: capability_bindings
    description: "JSON array of portfolio/provider bindings used during discovery"
    default: "[]"
  - name: apply_mode
    description: "How to apply DVA-owned command/lifecycle migration: propose or force. Not dva up --force."
    default: "propose"
    enum: [propose, force]
  - name: legacy_surface
    description: "After DVA owns an action, keep the old entrypoint as a dva alias, or remove it"
    default: "alias"
    enum: [alias, remove]
steps:
  # Always refresh analysis. Reusing a file based only on its existence silently ignores
  # changed capability bindings and project evidence.
  # ── Stage 00: Analyze ──
  - id: analyze
    type: pipeline
    run_pipeline: dva-improve-guided/00-analyze
    pipeline_params:
      target: "{{param.target}}"
      capability_bindings: "{{param.capability_bindings}}"
      apply_mode: "{{param.apply_mode}}"
      legacy_surface: "{{param.legacy_surface}}"

  - id: approval_context
    type: context
    depends_on: [analyze]
    context:
      # Bind the approval artifact to this run. An old valid-looking file must not
      # authorize mutation after an interactive error is continued.
      nonce: |
        printf '%s-%s' "$(date +%s)" "$$"

  # ── Stage 10: Select (USER GATE) ──
  - id: verify
    type: pipeline
    depends_on: [approval_context]
    run_pipeline: dva-improve-guided/10-verify
    pipeline_params:
      target: "{{param.target}}"
      approval_nonce: "{{approval_context.nonce}}"

  # Re-check the durable approval artifact at the parent layer. Every downstream
  # mutation carries this gate because Agent Mesh does not propagate a skipped step
  # into an ungated dependent.
  - id: approval_gate
    type: context
    depends_on: [verify]
    context:
      approved: |
        PROPOSAL="tmp/improve-guided/10-proposal-approved.json"
        EXPECTED=$(printf '%s' '{{approval_context.nonce | b64encode}}' | base64 -d)
        if jq -e -s '
          length == 1 and
          (.[0] | type) == "object" and
          (.[0].selected_plan | type) == "string" and
          (.[0].selected_plan | length) > 0 and
          .[0].approval_nonce == $nonce
        ' --arg nonce "$EXPECTED" "$PROPOSAL" >/dev/null 2>&1; then
          printf true
        else
          printf false
        fi

  # ── Stage 20: Transform ──
  - id: transform
    type: pipeline
    depends_on: [approval_gate]
    when: "{{approval_gate.approved}} == 'true'"
    run_pipeline: dva-improve-guided/20-transform
    pipeline_params:
      target: "{{param.target}}"

  # ── Stage 30: Configure ──
  # Track routing is handled inside the configure flow based on analysis report
  - id: configure
    type: pipeline
    depends_on: [transform]
    when: "{{approval_gate.approved}} == 'true'"
    run_pipeline: dva-improve-guided/30-configure
    pipeline_params:
      target: "{{param.target}}"
      apply_mode: "{{param.apply_mode}}"
      legacy_surface: "{{param.legacy_surface}}"

  # ── Stage 40: Execute ──
  - id: execute
    type: pipeline
    depends_on: [configure]
    when: "{{approval_gate.approved}} == 'true' && {{param.skip_execute}} != 'true'"
    run_pipeline: dva-improve-guided/40-execute
    pipeline_params:
      target: "{{param.target}}"
      plan: "{{param.plan}}"
