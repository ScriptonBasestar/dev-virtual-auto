# yaml-language-server: $schema=schemas/flow.schema.json
name: dva-improve-guided
description: "Interactive DVA setup pipeline: analyze options, confirm selections, configure, execute"
contract:
  goal: "프로젝트 분석 → 발견 옵션 검토/선택 → 디렉토리 정리 → dva.yml 생성/개선 → 실행 검증까지 완료"
  expected_results:
    - "프로젝트 분석 리포트가 생성된다"
    - "사용자가 발견된 옵션과 추천 조합을 검토한다"
    - "dva.yml이 생성 또는 개선된다"
    - "dva config validate가 통과한다"
    - "dva up이 성공한다 (--skip-execute가 아닌 경우)"
  success_criteria:
    - "Stage 10에서 분석 결과와 추천 옵션을 사용자에게 제시해야 한다"
    - "모든 stage가 gate PASS로 완료되어야 한다"
    - "DVA CLI가 설치되어 있어야 한다"
pipeline_role: orchestrator
default_backend: smart

parameters:
  - name: target
    description: "Target directory to analyze and configure"
    default: "."
  - name: skip_execute
    description: "Stop after configure stage (no dva up)"
    default: "false"
    enum: ["true", "false"]
  - name: mode
    description: "DVA mode to use for execution (e.g., infra)"
    default: ""
  - name: shared_dir
    description: "Absolute path to agent-mesh-flows/shared. Empty → $DVA_SHARED_DIR, then the run directory. Must also appear in am's allowed_roots_add."
    default: ""

steps:
  - id: check_existing_analysis
    type: context
    context:
      has_analysis_report: |
        [ -f 'tmp/improve-guided/00-analysis-report.json' ] && printf true || printf false

  # ── Stage 00: Analyze ──
  # `when:` contract, measured against am cb8b4ce -- every rule here cost a wrong guess:
  #   1. Quote the operand. A template renders to a string, but a bare `true`/`false`
  #      operand parses as a boolean, and a string never equals a boolean. Unquoted,
  #      `!= true` ran the step for every value and `== true` skipped it for every value.
  #   2. No filters. `{{ref | trim}}` runs the step unconditionally, whatever the operator.
  #   3. A skip propagates only into dependents that carry their own `when:`; an ungated
  #      dependent runs regardless. That is what lets stage 00 be skipped here while
  #      verify/transform/configure/execute still run.
  #   4. A skipped step's key renders as the literal `{{ref}}` text, not as empty -- so a
  #      gate must read a step that actually ran, and a prompt must never read a gated one.
  #   5. The producer must not emit a trailing newline. am does not trim, so a context value
  #      built with `echo true` renders as "true\n" and never equals 'true' -- `== 'true'`
  #      skipped for every value and `!= 'true'` ran for every value, the same silent
  #      fail-open as rule 1. Emit flags with `printf true || printf false`.
  # All five failures are silent and still exit 0, so `am validate` cannot see them;
  # `go run ./tools/flowcheck` enforces rules 1, 2 and 5 mechanically.
  - id: analyze
    type: pipeline
    depends_on: [check_existing_analysis]
    when: "{{check_existing_analysis.has_analysis_report}} != 'true'"
    run_pipeline: dva-improve-guided/00-analyze
    pipeline_params:
      target: "{{param.target}}"
      shared_dir: "{{param.shared_dir}}"

  # ── Stage 10: Select (USER GATE) ──
  - id: verify
    type: pipeline
    depends_on: [analyze]
    run_pipeline: dva-improve-guided/10-verify
    pipeline_params:
      target: "{{param.target}}"

  # ── Stage 20: Transform ──
  - id: transform
    type: pipeline
    depends_on: [verify]
    run_pipeline: dva-improve-guided/20-transform
    pipeline_params:
      target: "{{param.target}}"

  # ── Stage 30: Configure ──
  # Track routing is handled inside the configure flow based on analysis report
  - id: configure
    type: pipeline
    depends_on: [transform]
    run_pipeline: dva-improve-guided/30-configure
    pipeline_params:
      target: "{{param.target}}"
      shared_dir: "{{param.shared_dir}}"

  # ── Stage 40: Execute ──
  - id: execute
    type: pipeline
    depends_on: [configure]
    when: "{{param.skip_execute}} != 'true'"
    run_pipeline: dva-improve-guided/40-execute
    pipeline_params:
      target: "{{param.target}}"
      mode: "{{param.mode}}"
