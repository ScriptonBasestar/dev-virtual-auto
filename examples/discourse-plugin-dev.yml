# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Discourse Plugin Development

version: "0.1.44"

env_file:
  - .env

vars:
  RUBY_VERSION: "3.2"
  RAILS_ENV: development
  DISCOURSE_HOSTNAME: localhost

stack:
  discourse-compose:
    description: Discourse plugin development stack
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: gorisa-discourse

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  local-discourse:
    description: Local Discourse plugin development
    environment: dev
    site: local
    entries:
      - name: discourse-compose
        runner: compose
        order: 10
        services: [discourse, postgres, redis]

interaction:
  rails:
    description: Run Rails commands
    service: discourse
    command: bundle exec rails
    subcommands:
      console:
        description: Open Rails console
        command: bundle exec rails console
      server:
        description: Start Rails server
        command: bundle exec rails server -b 0.0.0.0
      db:create:
        description: Create database
        command: bundle exec rails db:create
      db:migrate:
        description: Run migrations
        command: bundle exec rails db:migrate
  bundle:
    description: Run Bundler commands
    service: discourse
    command: bundle
  rspec:
    description: Run RSpec tests
    service: discourse
    command: bundle exec rspec
    environment:
      RAILS_ENV: test
  shell:
    description: Open bash shell
    service: discourse
    command: bash
  plugin:
    description: Plugin development commands
    service: discourse
    command: bundle exec rails
    subcommands:
      test:
        description: Run plugin tests
        environment:
          RAILS_ENV: test
        command: bundle exec rails plugin:spec
      install:
        description: Install plugin dependencies
        command: bundle exec rails plugin:install_all_gems

provision:
  default:
    - step: Install gems
      run: dva bundle install
    - step: Create database
      run: dva rails db:create
    - step: Run migrations
      run: dva rails db:migrate
