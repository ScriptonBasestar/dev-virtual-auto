# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Kubernetes DVA Configuration
# Use Case: Development against Kubernetes cluster
# Features: kubectl stack runner, kubectl interactions, named plans
#
# Usage:
#   dva ls
#   dva up k8s-dev
#   dva k8s get pods
#   dva rails console
#   dva provision deploy

version: "0.1.44"

stack:
  cluster-app:
    description: Kubernetes application bundle
    default_runner: kubectl
    runners:
      kubectl:
        namespace: myapp-development
        context: minikube
        manifests:
          - k8s/web.yaml
          - k8s/worker.yaml
          - k8s/postgres.yaml

environments:
  dev:
    vars:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  k8s-dev:
    description: Kubernetes development environment
    environment: dev
    site: local
    entries:
      - name: cluster-app
        runner: kubectl
        order: 10

interaction:
  k8s:
    description: Run kubectl commands
    command: kubectl
    runner: kubectl
    shell: false

  rails:
    description: Run Rails commands in the web pod
    command: bundle exec rails
    runner: kubectl
    pod: web
    subcommands:
      console:
        description: Start Rails console
        command: console

  bash:
    description: Start bash shell in the web pod
    command: /bin/bash
    runner: kubectl
    pod: web

  k8s-logs:
    description: Stream logs from the web pod
    command: kubectl logs -f
    runner: kubectl
    pod: web

  port-forward:
    description: Forward local port 3000 to the web pod
    command: kubectl port-forward pod/web 3000:3000
    runner: kubectl

provision:
  deploy:
    - step: Applying manifests
      run: kubectl apply -f k8s/
    - step: Waiting for rollout
      run: kubectl rollout status deployment/web -n myapp-development

  rollback:
    - step: Rolling back deployment
      run: kubectl rollout undo deployment/web -n myapp-development
