# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Basic DVA Configuration
# Use Case: Simple Rails project with PostgreSQL
# Features: stack declaration, plans, environments, sites, interactions, provision
#
# Usage:
#   dva ls
#   dva up local-dev
#   dva shell
#   dva rails console
#   dva rake db:migrate
#   dva provision

version: "0.1.44"

env_file:
  - .env

vars:
  RAILS_ENV: development
  DATABASE_URL: postgres://user:password@db:5432/myapp_development

stack:
  rails-compose:
    description: Rails app + PostgreSQL via Docker Compose
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: myapp

environments:
  dev:
    vars:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  local-dev:
    description: Basic local development environment
    environment: dev
    site: local
    entries:
      - name: rails-compose
        runner: compose
        order: 10
        services: [web, db]

interaction:
  shell:
    description: Start a shell in the web container
    service: web
    command: /bin/bash

  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
    compose:
      run_options:
        - rm
    subcommands:
      console:
        description: Start Rails console
        command: console

  bundle:
    description: Run bundle commands
    service: web
    command: bundle

  rake:
    description: Run Rake tasks
    service: web
    command: bundle exec rake

  psql:
    description: Connect to PostgreSQL database
    service: db
    command: psql -h db -U user myapp_development
    environment:
      PGPASSWORD: password

provision:
  default:
    - step: Installing dependencies
      run: dva bundle install
    - step: Setting up database
      run:
        - dva rails db:create
        - dva rails db:migrate
        - dva rails db:seed
