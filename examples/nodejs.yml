# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Node.js DVA Configuration

version: "0.1.44"

vars:
  NODE_ENV: development
  MONGODB_URL: mongodb://mongo:27017/myapp_development
  REDIS_URL: redis://redis:6379/0
  PORT: ${PORT:-3000}

env_file:
  - .env

stack:
  node-compose:
    description: Node.js app + MongoDB + Redis
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: myapp_node

plans:
  node-local:
    environment: dev
    site: local
    entries:
      - name: node-compose
        runner: compose
        order: 10
        services: [node, mongo, redis]

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

interaction:
  shell:
    description: Start a shell in the node container
    service: node
    command: /bin/bash
  npm:
    description: Run npm commands
    service: node
    command: npm
  yarn:
    description: Run yarn commands
    service: node
    command: yarn
  node:
    description: Start Node.js REPL
    service: node
    command: node
  mongo:
    description: Connect to MongoDB shell
    service: mongo
    command: mongosh myapp_development
  redis:
    description: Connect to Redis CLI
    service: redis
    command: redis-cli
  test:
    description: Run tests with Jest
    service: node
    command: npm test
    environment:
      NODE_ENV: test

provision:
  default:
    - step: Installing dependencies
      run: dva npm install
    - step: Building project
      run: dva npm run build
