# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: DevContainer Integration
# Use Case: Docker Compose based development with DevContainer support

version: "0.1.44"

env_file:
  - .env

stack:
  devcontainer-compose:
    description: Shared compose stack for DevContainer
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: myapp

plans:
  local-devcontainer:
    description: DevContainer-oriented local environment
    environment: dev
    site: local
    entries:
      - name: devcontainer-compose
        runner: compose
        order: 10
        services: [app, db, redis]

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

interaction:
  shell:
    description: Open Bash shell in app container
    service: app
    command: bash
  bundle:
    description: Run Bundler commands
    service: app
    command: bundle
  rails:
    description: Run Rails commands
    service: app
    command: bundle exec rails

provision:
  default:
    - step: Installing dependencies
      run: dva bundle install
    - step: Setting up database
      run: dva rails db:create db:migrate db:seed
devcontainer:
  enabled: true
  name: My Rails App Development
  service: app
  workspaceFolder: /workspace
  remoteUser: vscode
  features:
    docker-in-docker: {}
    github-cli:
      version: latest
    git: {}
  customizations:
    vscode:
      extensions:
        - rebornix.ruby
        - castwide.solargraph
        - kaiwood.endwise
        - ms-azuretools.vscode-docker
  forwardPorts: [3000, 5432, 6379]
  postCreateCommand: bundle install && rails db:setup
