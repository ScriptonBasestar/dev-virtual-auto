# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Full-Stack DVA Configuration
# Use Case: Rails + Node.js + PostgreSQL + Redis
# Features: multi-runner stack, compose + kubernetes targets, named plans, rich interactions
#
# Usage:
#   dva ls
#   dva up local-dev
#   dva up remote-stg
#   dva rails console
#   dva npm install
#   dva provision deploy

version: "0.1.44"

vars:
  RAILS_ENV: development
  NODE_ENV: development
  DATABASE_URL: postgres://user:password@db:5432/myapp_development
  REDIS_URL: redis://redis:6379/0
  PORT: ${PORT:-3000}
  APP_PORT: ${PORT:-3000}
  ENABLE_WEB_CONSOLE: "true"
  WORKER_CONCURRENCY: "4"

env_file:
  - .env

stack:
  core-infra:
    description: PostgreSQL and Redis via Docker Compose
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
          - docker-compose.override.yml
        project_name: myapp_project

  web:
    description: Rails web application
    default_runner: native
    runners:
      native:
        dir: myapp
        build: bundle exec rails assets:precompile
        run: bundle exec rails server -p 3000 -b 0.0.0.0
      docker:
        image: myorg/web:dev
        run: docker run --rm --name web myorg/web:dev
      kubectl:
        namespace: myapp-development
        context: minikube
        manifests:
          - k8s/web.yaml

  frontend:
    description: Node.js frontend
    default_runner: native
    runners:
      native:
        dir: frontend
        build: npm run build
        run: npm run start
      docker:
        image: myorg/frontend:dev
        run: docker run --rm --name frontend myorg/frontend:dev

  app-k8s:
    description: Shared Kubernetes deployment bundle
    default_runner: kubectl
    runners:
      kubectl:
        namespace: myapp-development
        context: minikube
        manifests:
          - k8s/web.yaml
          - k8s/worker.yaml

plans:
  local-dev:
    description: Local full-stack development
    environment: dev
    site: local
    entries:
      - name: core-infra
        runner: compose
        order: 10
        services: [db, redis]
      - name: web
        runner: native
        order: 20
        depends_on: [core-infra]
      - name: frontend
        runner: native
        order: 30
        depends_on: [web]

  remote-stg:
    description: Remote staging-like environment
    environment: stg
    site: remote
    entries:
      - name: core-infra
        runner: compose
        order: 10
        services: [db, redis]
      - name: web
        runner: docker
        order: 20
        depends_on: [core-infra]
      - name: frontend
        runner: docker
        order: 30
        depends_on: [web]

  cloud-web:
    description: Web tier on the cluster; the cloud site switches web to kubectl
    environment: stg
    site: cloud
    entries:
      - name: web
        order: 10

default_plan: local-dev

environments:
  dev:
    environment:
      APP_ENV: dev
      LOG_LEVEL: debug

  stg:
    environment:
      APP_ENV: stg
      LOG_LEVEL: info
      DATABASE_URL: postgres://user:password@stg-db:5432/myapp_staging

# entry_overrides only matter when they change a runner or add vars; web/frontend
# already default to native, so the local site carries vars only.
sites:
  local:
    vars:
      DVA_SITE: local

  remote:
    vars:
      DVA_SITE: remote
    entry_overrides:
      web:
        runner: docker
      frontend:
        runner: docker

  cloud:
    vars:
      DVA_SITE: cloud
    entry_overrides:
      web:
        runner: kubectl

interaction:
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
    default_args: server -p 3000 -b 0.0.0.0
    environment:
      RAILS_LOG_TO_STDOUT: "true"
    compose:
      method: run
      run_options:
        - service-ports
        - rm
    subcommands:
      console:
        description: Start Rails console
        command: console
      db:
        description: Database related commands
        subcommands:
          migrate:
            description: Run database migrations
            command: db:migrate
          seed:
            description: Seed the database
            command: db:seed

  npm:
    description: Run npm commands
    service: frontend
    command: npm

  psql:
    description: Connect to PostgreSQL database
    service: db
    command: psql -h db -U user myapp_development
    environment:
      PGPASSWORD: password

  rspec:
    description: Run RSpec tests
    service: web
    command: bundle exec rspec
    environment:
      RAILS_ENV: test

  shell:
    description: Start a shell in the web container
    service: web
    command: /bin/bash

  k8s:
    description: Run kubectl commands
    command: kubectl
    runner: kubectl

provision:
  default:
    - step: Building containers
      run: docker compose build
    - step: Setting up database
      run:
        - dva rails db:create
        - dva rails db:migrate
        - dva rails db:seed
    - step: Installing Node.js dependencies
      run: dva npm install

  reset:
    - step: Cleaning temporary files
      run: rm -rf tmp/ log/*.log
    - step: Rebuilding containers
      run: docker compose build --no-cache

  deploy:
    - step: Building containers
      run: docker compose build
    - step: Running migrations
      run: dva rails db:migrate
    - step: Precompiling assets
      run: dva rails assets:precompile
