# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Basic env_file Usage

version: "0.1.44"

env_file:
  - .env

vars:
  RAILS_ENV: development
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"

stack:
  rails-compose:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  local-dev:
    environment: dev
    site: local
    entries:
      - name: rails-compose
        runner: compose
        order: 10
        services: [web, postgres]

interaction:
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
  shell:
    description: Open bash shell
    service: web
    command: bash
