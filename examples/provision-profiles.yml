# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Provision Profiles

version: "0.1.44"

vars:
  RAILS_ENV: development

stack:
  rails-compose:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml

plans:
  local-rails:
    environment: dev
    site: local
    entries:
      - name: rails-compose
        runner: compose
        order: 10
        services: [web, db]

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

interaction:
  shell:
    description: Start a shell
    service: web
    command: /bin/bash
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
  bundle:
    description: Run bundle commands
    service: web
    command: bundle
  rake:
    description: Run Rake tasks
    service: web
    command: bundle exec rake
  rspec:
    description: Run RSpec tests
    service: web
    command: bundle exec rspec
    environment:
      RAILS_ENV: test

provision:
  default:
    - step: Installing dependencies
      run: dva bundle install
    - step: Setting up database
      run:
        - dva rails db:create
        - dva rails db:migrate
        - dva rails db:seed
  reset:
    - step: Cleaning temporary files
      run:
        - rm -rf tmp/ log/*.log
    - step: Rebuilding containers
      run: docker compose build --no-cache
  seed:
    - step: Seeding database
      run: dva rails db:seed
  ci:
    - step: Installing dependencies
      run: dva bundle install --jobs 4 --retry 3
