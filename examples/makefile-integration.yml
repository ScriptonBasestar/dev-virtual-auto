# dva.yml - Example configuration for Makefile integration
# This demonstrates DVA commands used in Makefile.dev.mk examples

version: '8.1.0'

environment:
  COMPOSE_EXT: development
  RAILS_ENV: development

compose:
  files:
    - docker-compose.yml
  project_name: myapp

interaction:
  # Rails console - used by 'make dva-console'
  rails:
    description: Run Rails commands
    service: app
    command: bundle exec rails
    subcommands:
      console:
        description: Open Rails console
        command: bundle exec rails console

      db:migrate:
        description: Run database migrations
        command: bundle exec rails db:migrate

      db:seed:
        description: Seed database
        command: bundle exec rails db:seed

  # RSpec tests - used by 'make dva-test'
  rspec:
    description: Run RSpec tests
    service: app
    environment:
      RAILS_ENV: test
    command: bundle exec rspec

  # Shell access
  shell:
    description: Open bash shell in app container
    service: app
    command: bash

  # Database console
  psql:
    description: Open PostgreSQL console
    service: app
    command: psql -h postgres -U myapp_user myapp_development

  # Bundler
  bundle:
    description: Run Bundler commands
    service: app
    command: bundle

# Provisioning - used by 'make dva-provision'
provision:
  # Note: Run 'dva up' first to start containers
  - dva bundle install
  - dva rails db:create
  - dva rails db:migrate
  - dva rails db:seed
  - echo "✓ Provisioning complete"
