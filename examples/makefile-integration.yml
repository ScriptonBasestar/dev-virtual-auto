# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Makefile Integration

version: "0.1.44"

vars:
  COMPOSE_EXT: development
  RAILS_ENV: development

stack:
  make-compose:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: myapp

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  local-make:
    environment: dev
    site: local
    entries:
      - name: make-compose
        runner: compose
        order: 10
        services: [app, postgres]

interaction:
  rails:
    description: Run Rails commands
    service: app
    command: bundle exec rails
    subcommands:
      console:
        description: Open Rails console
        command: bundle exec rails console
      db:migrate:
        description: Run database migrations
        command: bundle exec rails db:migrate
  rspec:
    description: Run RSpec tests
    service: app
    command: bundle exec rspec
    environment:
      RAILS_ENV: test
  shell:
    description: Open bash shell in app container
    service: app
    command: bash
  bundle:
    description: Run Bundler commands
    service: app
    command: bundle

provision:
  default:
    - step: Install dependencies
      run: dva bundle install
    - step: Create database
      run: dva rails db:create
    - step: Run migrations
      run: dva rails db:migrate
