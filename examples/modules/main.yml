# yaml-language-server: $schema=../../internal/config/schema.json
#
# Example: Modular DVA Configuration with Modules

version: "0.1.44"

vars:
  RAILS_ENV: development

stack:
  rails-compose:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml

modules:
  - sast
  - testing

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  local-modules:
    environment: dev
    site: local
    entries:
      - name: rails-compose
        runner: compose
        order: 10
        services: [web, db]

interaction:
  shell:
    description: Start a shell in the web container
    service: web
    command: /bin/bash
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
    subcommands:
      console:
        description: Start Rails console
        command: console
      server:
        description: Start Rails server
        command: server -b 0.0.0.0
  bundle:
    description: Run bundle commands
    service: web
    command: bundle

provision:
  default:
    - step: Install dependencies
      run: dva bundle install
    - step: Prepare database
      run: dva rails db:create db:migrate db:seed
