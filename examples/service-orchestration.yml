# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Service Orchestration & Diagnostics
# Use Case: API + Worker + Frontend microservice project
# Features: compose service subsets, doctor checks, endpoints, environments, sites
#
# Usage:
#   dva doctor
#   dva ls
#   dva up local-infra
#   dva up local-full
#   dva provision setup

version: "0.1.44"

vars:
  ENABLE_AUTH: "false"
  RUST_LOG: info
  DATABASE_URL: postgresql://db_orchestrator:password@postgres:5432/db_orchestrator
  KAFKA_BROKERS: kafka:29092

env_file:
  - .env

stack:
  infra-compose:
    description: PostgreSQL and Kafka infrastructure
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: db-orchestrator

  api:
    description: API server
    default_runner: native
    runners:
      native:
        dir: .
        run: cargo run -p db-orchestrator-api
      compose:
        files:
          - docker-compose.yml
        project_name: db-orchestrator

  worker:
    description: Worker process
    default_runner: native
    runners:
      native:
        dir: .
        run: cargo run -p db-orchestrator-worker
      compose:
        files:
          - docker-compose.yml
        project_name: db-orchestrator

  frontend:
    description: Frontend UI
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
        project_name: db-orchestrator

plans:
  local-infra:
    description: Infrastructure services only
    environment: dev
    site: local
    entries:
      - name: infra-compose
        runner: compose
        order: 10
        services: [postgres, kafka]

  local-full:
    description: Infra + native app processes + frontend
    environment: dev
    site: local
    entries:
      - name: infra-compose
        runner: compose
        order: 10
        services: [postgres, kafka]
      - name: api
        runner: native
        order: 20
        depends_on: [infra-compose]
      - name: worker
        runner: native
        order: 30
        depends_on: [api]
      - name: frontend
        runner: compose
        order: 40
        depends_on: [api]
        services: [frontend]

  stg-infra:
    description: Infrastructure with staging-like settings
    environment: stg
    site: local
    entries:
      - name: infra-compose
        runner: compose
        order: 10
        services: [postgres, kafka]

default_plan: local-full

environments:
  dev:
    environment:
      APP_ENV: dev
  stg:
    environment:
      APP_ENV: stg
      ENABLE_AUTH: "true"

# entry_overrides only matter when they change a runner or add vars; api/worker
# already default to native, so the local site carries vars only.
sites:
  local:
    vars:
      DVA_SITE: local

checks:
  - name: Docker daemon accessible
    type: docker_socket
    fix_hint: Start Docker Desktop or ensure dockerd is running
  - name: .env file exists
    type: file_exists
    path: .env
    fix_hint: cp .env.example .env
  - name: Docker Compose files exist
    type: file_exists
    path: docker-compose.yml

interaction:
  api-logs:
    description: View API server logs
    service: api
    command: tail -f /var/log/api.log
  worker-logs:
    description: View worker logs
    service: worker
    command: tail -f /var/log/worker.log
provision:
  default_profile: setup
  setup:
    - step: Starting infrastructure
      run: docker compose up -d postgres kafka
    - step: Waiting for database
      run: docker compose exec postgres pg_isready -U db_orchestrator
    - step: Running migrations
      run: make migrate
    - step: Seeding initial data
      run: make seed

endpoints:
  api:
    url: http://localhost:8080
    label: API Server
    tags: [app]
    paths:
      /health: Health check
  frontend:
    url: http://localhost:3000
    label: Web UI
    tags: [ui]
