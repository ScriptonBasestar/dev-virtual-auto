# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: LLM-Friendly DVA Configuration

version: "0.1.44"

vars:
  APP_ENV: development
  DATABASE_URL: postgres://user:password@db:5432/app_dev

stack:
  ai-compose:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml

environments:
  dev:
    vars:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  ai-local:
    environment: dev
    site: local
    entries:
      - name: ai-compose
        runner: compose
        order: 10
        services: [app, db]

interaction:
  shell:
    description: Open bash shell in app container
    service: app
    command: /bin/bash
  server:
    description: Start development server
    service: app
    command: npm run dev
  db:
    description: Database operations
    service: app
    command: npm run db
    subcommands:
      migrate:
        description: Run database migrations
        command: npm run db:migrate
      seed:
        description: Seed database
        command: npm run db:seed
  test:
    description: Run test suite
    service: app
    command: npm test
  npm:
    description: Run npm commands
    service: app
    command: npm

provision:
  default:
    - step: Install dependencies
      run: dva npm install
    - step: Run migrations
      run: dva db migrate
