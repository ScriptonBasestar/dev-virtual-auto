# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Multi-Runner Application Stack
# Use Case: Rust API + worker + Svelte frontend
# Features: multi-runner stack entries, compose infra bundle, plans, site overrides
#
# Usage:
#   dva ls
#   dva up local-backend
#   dva up local-full
#   dva show local-full
#   dva run test

version: "0.1.44"

env_file:
  - .env.example
  - .env

vars:
  DATABASE_URL: "postgres://dev:dev@localhost:15432/myapp"
  REDIS_URL: "redis://localhost:16379"

stack:
  infra:
    description: PostgreSQL and Redis infrastructure
    default_runner: compose
    runners:
      compose:
        files:
          - compose.yml
        project_name: myapp
        up_options: ["-d", "--wait"]

  api:
    description: REST API server
    default_runner: native
    runners:
      native:
        dir: rust-workspace
        build: cargo build -p api-server
        run: cargo run --release -p api-server
      docker:
        image: myorg/api-rs:dev
        run: docker run --rm --name api-rs myorg/api-rs:dev

  worker:
    description: Background worker
    default_runner: native
    runners:
      native:
        dir: rust-workspace
        build: cargo build -p worker
        run: cargo run --release -p worker
      docker:
        image: myorg/worker-rs:dev
        run: docker run --rm --name worker-rs myorg/worker-rs:dev

  web:
    description: Svelte frontend
    default_runner: native
    runners:
      native:
        dir: frontend
        build: pnpm build
        run: pnpm build && pnpm preview
      docker:
        image: myorg/web-ui:dev
        run: docker run --rm --name web-ui myorg/web-ui:dev

environments:
  dev:
    vars:
      APP_ENV: dev
      LOG_LEVEL: debug

  stg:
    vars:
      APP_ENV: stg
      LOG_LEVEL: info

sites:
  local:
    vars:
      DVA_SITE: local
    entry_overrides:
      api:
        runner: native
      worker:
        runner: native
      web:
        runner: native

  docker-host:
    vars:
      DVA_SITE: docker-host
    entry_overrides:
      api:
        runner: docker
      worker:
        runner: docker
      web:
        runner: docker

plans:
  local-backend:
    description: Infra + API + worker
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis]
      - name: api
        runner: native
        order: 20
        depends_on: [infra]
      - name: worker
        runner: native
        order: 30
        depends_on: [api]

  local-full:
    description: Full stack on local machine
    environment: dev
    site: local
    entries:
      - name: infra
        runner: compose
        order: 10
        services: [postgres, redis]
      - name: api
        runner: native
        order: 20
        depends_on: [infra]
      - name: worker
        runner: native
        order: 30
        depends_on: [api]
      - name: web
        runner: native
        order: 40
        depends_on: [api]

interaction:
  db:
    description: Database management
    subcommands:
      shell:
        description: PostgreSQL interactive console
        service: postgres
        command: psql -U dev -d myapp
      migrate:
        description: Run database migrations
        command: cargo run -p migration
        runner: local

  test:
    description: Run all Rust tests
    command: cargo test
    runner: local

  lint:
    description: Run clippy
    command: cargo clippy --all-targets -- -D warnings
    runner: local

provision:
  default:
    - step: Start infrastructure
      run: docker compose -f compose.yml up -d --wait
    - step: Run migrations
      run: cargo run -p migration
    - step: Install frontend dependencies
      run: cd frontend && pnpm install
