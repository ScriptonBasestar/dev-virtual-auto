# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: env_file Priority

version: "0.1.44"

vars:
  RAILS_ENV: development
  LOG_LEVEL: info
  DATABASE_HOST: postgres

env_file:
  - .env.defaults
  - .env
  - .env.local

stack:
  compose-bundle:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml

plans:
  local-priority:
    environment: dev
    site: local
    entries:
      - name: compose-bundle
        runner: compose
        order: 10

environments:
  dev:
    environment:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

interaction:
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
    environment:
      RAILS_LOG_TO_STDOUT: "true"
  rspec:
    description: Run tests
    service: web
    command: bundle exec rspec
    environment:
      RAILS_ENV: test
