# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Multi-Environment with env_file

version: "0.1.44"

vars:
  NODE_ENV: ${ENV:-development}
  RAILS_ENV: ${ENV:-development}
  APP_NAME: myapp

env_file:
  - .env.${ENV:-development}
  - .env.local

stack:
  compose-bundle:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml
          - docker-compose.${ENV:-development}.yml

plans:
  env-aware:
    environment: ${ENV:-development}
    site: local
    entries:
      - name: compose-bundle
        runner: compose
        order: 10

environments:
  development:
    environment:
      APP_ENV: development
  staging:
    environment:
      APP_ENV: staging
  production:
    environment:
      APP_ENV: production

sites:
  local:
    vars:
      DVA_SITE: local

interaction:
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
  shell:
    description: Open bash shell
    service: web
    command: bash
