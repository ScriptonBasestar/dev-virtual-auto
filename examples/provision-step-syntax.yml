# yaml-language-server: $schema=../internal/config/schema.json
#
# Example: Provision Step Syntax

version: "0.1.44"

vars:
  RAILS_ENV: development

stack:
  rails-compose:
    default_runner: compose
    runners:
      compose:
        files:
          - docker-compose.yml

environments:
  dev:
    vars:
      APP_ENV: dev

sites:
  local:
    vars:
      DVA_SITE: local

plans:
  local-steps:
    environment: dev
    site: local
    entries:
      - name: rails-compose
        runner: compose
        order: 10

interaction:
  shell:
    description: Start a shell
    service: web
    command: /bin/bash
  rails:
    description: Run Rails commands
    service: web
    command: bundle exec rails
  bundle:
    description: Run bundle commands
    service: web
    command: bundle

provision:
  default:
    - step: Installing Ruby gems
      run: dva bundle install
    - step: Installing Node.js packages
      run: dva npm install
    - step: Setting up database
      run:
        - dva rails db:create
        - dva rails db:migrate
        - dva rails db:seed
    - step: Setup complete
      note: Development environment ready
  reset:
    - step: Cleaning temporary files
      run:
        - rm -rf tmp/cache/*
        - rm -rf log/*.log
    - step: Rebuilding containers
      run: docker compose build --no-cache
